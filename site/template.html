        <button class="qbtn" style="margin-left:0" onclick="startQuiz({mode:'topic',id:'${t.id}'})">測驗本課題</button>
      </div>
      <div class="tmeta">來源：${esc(t.pdf||'')} ｜ ${(t.sections||[]).length} 章 · ${totalPts} 個知識點 <span style="color:var(--amber)">(虛擬滾動模式)</span></div>
      <div class="tlayout">
        <aside class="rail">${rail}</aside>
        <div>${blocks}</div>
      </div>
    </div>`;
    // next tick 初始化虚拟列表
    setTimeout(function(){
      const contentEl = document.getElementById('vcontent');
      const listEl = document.getElementById('vlist');
      if(contentEl && listEl) virtInit(contentEl, listEl, items);
    }, 0);
  }else{
    // 普通渲染模式
    blocks=(t.sections||[]).map(s=>{
      const pts=(s.points||[]).map(p=>ptCard(p,t)).join('');
      return `<section class="sblock" id="sec-${s.id}"><h3>${esc(s.title)}</h3>${pts}</section>`;
    }).join('');
    app.innerHTML=`
    <div class="view">
      <div class="thead">
        <button class="back" onclick="goBack()">← 上一步</button>
        <button class="back" onclick="go('#/home')">← 返回首頁</button>
        <h2><span style="color:${colorOf(t.id)}">●</span> ${esc(t.title)}${t.tags&&t.tags.length?' <span class="tags">'+t.tags.map(g=>'<span class="tag">'+tsub(g)+'</span>').join('')+'</span>':''}</h2>
        <button class="qbtn" style="margin-left:0" onclick="startQuiz({mode:'topic',id:'${t.id}'})">測驗本課題</button>
      </div>
      <div class="tmeta">來源：${esc(t.pdf||'')} ｜ ${(t.sections||[]).length} 章 · ${totalPts} 個知識點</div>
      <div class="tlayout">
        <aside class="rail">${rail}</aside>
        <div>${blocks}</div>
      </div>
    </div>`;
  }
  if(anchor){
    if(useVirt && anchor.indexOf('pt-')===0){
      // 虚拟列表：目标卡片可能还没渲染，等初始化后按索引滚动
      setTimeout(function(){ virtJumpPoint(anchor.slice(3)); },80);
    }else{
      var el=document.getElementById(anchor);
      scrollToEl(el);
      // 章节/知识点锚点跳转后闪一下高亮（必要回馈，不受动画模式影响）
      var hl=anchor.indexOf('sec-')===0 ? el : el;
      if(hl){
        var d=(!animDisabled() && !prefersReducedMotion()) ? Math.max(160, Math.round(300*animK())) : 0;
        if(d) setTimeout(function(){ flashAnchor(hl); }, d); else flashAnchor(hl);
      }
    }
  }
  if(!useVirt) observePointReads();  // 虚拟模式由 virtRender 负责观察
}
function jumpSec(sid){
  if(VIRT.contentEl){ virtJumpSection(sid); return; }
  var el=document.getElementById('sec-'+sid);
  scrollToEl(el);
  if(el){
    var d=(!animDisabled() && !prefersReducedMotion()) ? Math.max(160, Math.round(300*animK())) : 0;
    if(d) setTimeout(function(){ flashAnchor(el); }, d); else flashAnchor(el);
  }
}
function countPts(t){return (t.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);}
function ptCard(p,t){
  const xs=(XMAP[p.id]||[]);
  const cross=xs.filter(x=>PMAP[x.to]&&PMAP[x.to].t.id!==t.id);
  const inner=xs.filter(x=>PMAP[x.to]&&PMAP[x.to].t.id===t.id&&x.to!==p.id);
  let xl='';
  if(cross.length||inner.length){
    const items=[...cross,...inner].map(x=>{
      const o=PMAP[x.to]; if(!o)return '';
      const same=o.t.id===t.id;
      return `<span class="xl">🔗 <b>${same?'同課題':'跨課題 '+esc(o.t.title)}</b> · <span class="jump" onclick="jumpPoint('${o.p.id}')">${esc(o.s.title)} → ${esc(o.p.title)}</span>${x.label?'<br><span style="color:#7a756a;font-size:13px">'+esc(x.label)+'</span>':''}</span>`;
    }).join('');
    xl=`<div class="xlinks">${cross.length?'<div style="font-size:13px;color:#b45309;margin-bottom:2px">這個知識點還與……相連</div>':''}${items}</div>`;
  }
  const st=pointStats(p.id);
  const m=pointMastery(p.id);
  const mp=Math.round(m*100);
  const rv=(STORE.get().review||{})[p.id];
  const due=rv&&rv.due<=Date.now();
  let mbadge='';
  if(st[1])mbadge=`<span class="badge ${mp>=85?'ok':mp>=30?'mid':''}" style="${mp>=85||mp>=30?'':'background:#f1ede4;color:#7a756a'}">${masteryLabel(m)} ${mp}%</span>`;
  const exLv=(p.exam&&p.exam.level)||0;
  return `<div class="pcard" id="pt-${p.id}" data-pid="${p.id}"${exLv?' data-exam="'+exLv+'"':''}>
    <h4>${esc(p.title)}${p.page?'<span class="pg">📄 第 '+p.page+' 頁</span>':''}${st[1]?'<span class="pg">'+st[0]+'/'+st[1]+' 答對</span>':''}${mbadge}${due?'<span class="badge due">該複習了</span>':''}
      <button class="qbtn" onclick="startQuiz({mode:'point',id:'${p.id}'})">測驗</button></h4>
    <div class="md">${mdLite(p.body,(p.exam&&p.exam.years&&p.exam.years.length)?(p.exam.keywords||[]):null)}</div>
    ${(p.tags||[]).length?'<div class="tags">'+p.tags.map(g=>'<span class="tag">'+esc(g)+'</span>').join('')+'</div>':''}
    ${examBadge(p)}
    ${xl}
  </div>`;
}
/* ---------------- 畫中畫：不離開測驗也能看知識點 ----------------
   以前點「相關知識點」會跳頁，那一輪測驗就得重來；
   現在改成右下角浮動小窗，關掉就回到原本的題號與作答狀態。 */
let PIP_CUR='', PIP_HIST=[];
function pipEl(){return document.getElementById('pip');}
function pipQuizRunning(){return !!(QZ&&(location.hash||'').indexOf('/run')>=0);}
function openPip(pid,keepHist){
  const o=PMAP[pid]; if(!o)return;
  if(!keepHist)PIP_HIST=[];
  if(PIP_CUR&&PIP_CUR!==pid)PIP_HIST.push(PIP_CUR);
  PIP_CUR=pid;
  markSeen(pid);
  renderPip();
  const el=pipEl(); if(!el)return;
  el.classList.add('on');
  bindPipDrag();
  const saved=loadPipPos();
  if(saved)placePip(saved.left,saved.top,false);
}
function pipBack(){
  if(PIP_HIST.length){PIP_CUR=PIP_HIST.pop();renderPip();}
  else closePip();
}
function closePip(){
  PIP_CUR='';PIP_HIST=[];
  const el=pipEl();
  if(!el) return;
  // 先移除 .on 讓過渡播放（Safari 下用 visibility 過渡，元素不會瞬間消失）
  el.classList.remove('on');
  // 過渡結束後才清空內部 DOM，避免「動畫還在跑但內容已被清掉」的閃現；
  // 完全關閉動畫時直接清（沒有過渡可等）。
  const clearNow = animMode()==='off' || animDisabled();
  const delay = clearNow ? 0 : Math.round(220*animK());
  if(el.__clearT) clearTimeout(el.__clearT);
  if(clearNow){
    el.innerHTML='';
  }else{
    el.__clearT=setTimeout(function(){
      el.__clearT=null;
      // 期間若又被打開（PIP_CUR 有值）就不要清
      if(!PIP_CUR && !el.classList.contains('on')) el.innerHTML='';
    },delay);
  }
}
function renderPip(){
  const el=pipEl(); if(!el)return;
  const o=PMAP[PIP_CUR]; if(!o){closePip();return;}
  const p=o.p,t=o.t,sec=o.s;
  const xs=(XMAP[p.id]||[]).map(x=>{
    const q=PMAP[x.to]; if(!q)return '';
    return '<span class="xl">🔗 <b>'+(q.t.id===t.id?'同課題':'跨課題 '+esc(q.t.title))+'</b> · <span class="jump" onclick="openPip(\''+q.p.id+'\',true)">'+esc(q.s.title)+' → '+esc(q.p.title)+'</span>'+(x.label?'<br><span style="color:#7a756a;font-size:13px">'+esc(x.label)+'</span>':'')+'</span>';
  }).join('');
  const st=pointStats(p.id);
  el.innerHTML=
    '<div class="piphead"><div class="pipgrip" title="按住可拖動，雙擊歸位">⋮⋮</div><div class="pipt">'
    +'<span class="pipk">'+esc(t.title)+' · '+esc(sec.title)+'</span>'
    +'<b>'+esc(p.title)+'</b>'
    +'<span class="pipp">'+(p.page?'📄 第 '+p.page+' 頁':'')+(st[1]?(p.page?' · ':'')+st[0]+'/'+st[1]+' 答對':'')+'</span>'
    +'</div><div class="pipbtns">'
    +'<button class="pipbtn" onclick="pipBack()">'+(PIP_HIST.length?'← 上一步':'✕ 關閉')+'</button>'
    +(PIP_HIST.length?'<button class="pipbtn" onclick="closePip()">✕ 關閉</button>':'')
    +'</div></div>'
    +'<div class="pipbody"><div class="md">'+mdLite(p.body,(p.exam&&p.exam.years&&p.exam.years.length)?(p.exam.keywords||[]):null)+'</div>'
    +((p.tags||[]).length?'<div class="tags">'+p.tags.map(g=>'<span class="tag">'+esc(g)+'</span>').join('')+'</div>':'')
    +examBadge(p)
    +(xs?'<div class="xlinks">'+xs+'</div>':'')
    +'</div>'
    +(pipQuizRunning()?'<div class="pipnote">測驗進度還留著，關掉這個小窗就能繼續作答。</div>':'')
    +'<div class="pipfoot">'
    +'<button class="pipbtn" onclick="pipQuiz(\''+p.id+'\')">測驗這個知識點</button>'
    +'<button class="pipbtn" onclick="pipFull(\''+p.id+'\')">展開完整頁面 →</button>'
    +'<button class="pipbtn" onclick="resetPipPos()" title="移回右下角">↺ 歸位</button>'
    +'</div>';
  keepPipInView();
}
function pipQuiz(pid){
  if(pipQuizRunning()&&!window.confirm('這會結束目前這一輪測驗，改測這個知識點。要繼續嗎？'))return;
  closePip(); startQuiz({mode:'point',id:pid});
}
function pipFull(pid){
  if(pipQuizRunning()&&!window.confirm('展開完整頁面會離開測驗，這一輪的作答要重來。要繼續嗎？'))return;
  closePip(); jumpPoint(pid);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&PIP_CUR)closePip();});
/* ---- 畫中畫可拖動（滑鼠 + 觸屏，統一走 Pointer Events）----
   抓 header 就能拖；拖過的位置記在 localStorage，下次打開還在原位。
   用 left/top 定位，沒拖過時仍由 CSS 的右下角決定。 */
const PIP_POS_KEY = 'f6note.pip.pos';
let PIP_DRAG = null;

function loadPipPos(){
  try{
    const p = JSON.parse(localStorage.getItem(PIP_POS_KEY) || 'null');
    if(p && typeof p.left === 'number' && typeof p.top === 'number') return p;
  }catch(e){}
  return null;
}
function savePipPos(p){
  try{ localStorage.setItem(PIP_POS_KEY, JSON.stringify({left:Math.round(p.left), top:Math.round(p.top)})); }catch(e){}
}
function clearPipPos(){ try{ localStorage.removeItem(PIP_POS_KEY); }catch(e){} }

/* 邊界限制：不讓視窗被拖出畫面外（手機留 8px 手指邊） */
function clampPip(left, top){
  const el = pipEl(); if(!el) return {left:left, top:top};
  const w = el.offsetWidth || 0, h = el.offsetHeight || 0;
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 8;
  const maxLeft = Math.max(pad, vw - w - pad);
  const maxTop  = Math.max(pad, vh - h - pad);
  return {
    left: Math.min(Math.max(pad, left), maxLeft),
    top:  Math.min(Math.max(pad, top), maxTop)
  };
}
function placePip(left, top, save){
  const el = pipEl(); if(!el) return;
  const p = clampPip(left, top);
  el.style.left = p.left + 'px';
  el.style.top = p.top + 'px';
  el.style.right = 'auto';
  el.style.bottom = 'auto';
  if(save) savePipPos(p);
}
/* 歸位：清掉座標，交還給 CSS 的右下角 */
function resetPipPos(){
  clearPipPos();
  const el = pipEl(); if(!el) return;
  el.style.left = ''; el.style.top = '';
  el.style.right = ''; el.style.bottom = '';
}
/* 視窗縮放／轉向後，把已拖動的浮窗拉回可視範圍 */
function keepPipInView(){
  const el = pipEl(); if(!el || !el.classList.contains('on')) return;
  if(!el.style.left) return;   // 還沒拖過，交給 CSS
  const l = parseFloat(el.style.left), t = parseFloat(el.style.top);
  if(isNaN(l) || isNaN(t)) return;
  placePip(l, t, false);
}

function pipDragStart(e){
  const el = pipEl(); if(!el || !el.classList.contains('on')) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const r = el.getBoundingClientRect();
  PIP_DRAG = {id:e.pointerId, dx:e.clientX - r.left, dy:e.clientY - r.top, moved:false};
  el.classList.add('dragging');
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  if(e.cancelable) e.preventDefault();
}
function pipDragMove(e){
  if(!PIP_DRAG || e.pointerId !== PIP_DRAG.id) return;
  PIP_DRAG.moved = true;
  placePip(e.clientX - PIP_DRAG.dx, e.clientY - PIP_DRAG.dy, false);
  if(e.cancelable) e.preventDefault();
}
function pipDragEnd(e){
  if(!PIP_DRAG || e.pointerId !== PIP_DRAG.id) return;
  const el = pipEl();
  const moved = PIP_DRAG.moved;
  const id = PIP_DRAG.id;
  PIP_DRAG = null;
  if(!el) return;
  el.classList.remove('dragging');
  try{ el.releasePointerCapture(id); }catch(_){}
  if(moved && el.style.left){
    savePipPos({left:parseFloat(el.style.left), top:parseFloat(el.style.top)});
  }
}
function bindPipDrag(){
  const el = pipEl(); if(!el || el.__dragBound) return;
  el.__dragBound = true;
  el.addEventListener('pointerdown', function(e){
    if(!e.target.closest('.piphead')) return;
    if(e.target.closest('button')) return;   // 按鈕照常點擊
    pipDragStart(e);
  });
  el.addEventListener('pointermove', pipDragMove);
  el.addEventListener('pointerup', pipDragEnd);
  el.addEventListener('pointercancel', pipDragEnd);
  /* 雙擊把手＝歸位 */
  el.addEventListener('dblclick', function(e){
    if(!e.target.closest('.piphead') || e.target.closest('button')) return;
    resetPipPos();
  });
  /* 老瀏覽器沒有 Pointer Events 時的觸屏保底 */
  if(!window.PointerEvent){
    el.addEventListener('touchstart', function(e){
      if(!e.target.closest('.piphead') || e.target.closest('button')) return;
      const t = e.touches[0]; if(!t) return;
      const r = el.getBoundingClientRect();
      PIP_DRAG = {id:'touch', dx:t.clientX - r.left, dy:t.clientY - r.top, moved:false};
      el.classList.add('dragging');
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchmove', function(e){
      if(!PIP_DRAG) return;
      const t = e.touches[0]; if(!t) return;
      PIP_DRAG.moved = true;
      placePip(t.clientX - PIP_DRAG.dx, t.clientY - PIP_DRAG.dy, false);
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchend', function(){
      if(!PIP_DRAG) return;
      const el2 = pipEl(); const moved = PIP_DRAG.moved;
      PIP_DRAG = null;
      if(!el2) return;
      el2.classList.remove('dragging');
      if(moved && el2.style.left) savePipPos({left:parseFloat(el2.style.left), top:parseFloat(el2.style.top)});
    });
  }
}
window.addEventListener('resize', keepPipInView);
window.addEventListener('orientationchange', function(){ setTimeout(keepPipInView, 200); });

let gSim=null;
let gFocus='';      // 目前聚焦的課題（空字串＝全部）
function viewGraph(focus){
  navOn('graph');
  if(needsContent())return;
  if(focus!==undefined)gFocus=focus;
  const isAll=!gFocus;

  // nodes：全部模式＝課題節點；聚焦模式＝本課題各章 + 有串連的其他課題
  let nodes=[],idx={};
  if(isAll){
    TOPICS.forEach(t=>{
      idx[t.id]=nodes.length;
      const np=(t.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);
      const nq=(QUIZ[t.id]||[]).length;
      nodes.push({key:t.id,label:t.title,topic:t,r:16+Math.min(20,np/5),sub:np+' 知識點 · '+(t.sections||[]).length+' 章 · '+nq+' 題',x:0,y:0,vx:0,vy:0});
    });
  }else{
    const T=TMAP[gFocus];
    // 先收集與本課題有串連的其他課題
    const peerT={};
    LINKS.forEach(l=>{
      const a=PMAP[l.from],b=PMAP[l.to];
      if(!a||!b)return;
      if(a.t.id===gFocus&&b.t.id!==gFocus)peerT[b.t.id]=1;
      if(b.t.id===gFocus&&a.t.id!==gFocus)peerT[a.t.id]=1;
    });
    (T.sections||[]).forEach(s=>{
      idx[s.id]=nodes.length;
      nodes.push({key:s.id,label:s.title,topic:T,r:9+Math.min(10,(s.points||[]).length),sub:(s.points||[]).length+' 個知識點',x:0,y:0,vx:0,vy:0});
    });
    // 牽連到的其他課題各作為一個節點（不是它們所有章節）
    Object.keys(peerT).forEach(tid=>{
      if(idx[tid]!==undefined)return;
      const PT=TMAP[tid];if(!PT)return;
      idx[tid]=nodes.length;
      const np=(PT.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);
      nodes.push({key:tid,label:PT.title,topic:PT,r:13+Math.min(12,np/12),sub:'其他課題 · '+np+' 知識點',isPeer:true,x:0,y:0,vx:0,vy:0});
    });
  }
  // 邊：全部模式＝課題之間的連結數；聚焦模式＝本課題章節 ↔ 其他課題（連線到該課題節點）
  const emap={};
  const keyOf=p=>isAll?p.t.id:p.s.id;
  LINKS.forEach(l=>{
    const a=PMAP[l.from],b=PMAP[l.to];
    if(!a||!b)return;
    const ka=keyOf(a),kb=keyOf(b);
    if(ka===kb)return;
    if(isAll){
      if(idx[ka]===undefined||idx[kb]===undefined)return;
    }else{
      // 聚焦模式：任一端屬於本課題；把對端映射到「課題節點」（若對端同課題則用章節）
      const key=p=>{
        if(p.t.id===gFocus)return p.s.id;      // 本課題 → 用章節節點
        if(idx[p.t.id]!==undefined)return p.t.id; // 其他課題 → 用課題節點
        return null;                            // 該課題沒被牽連到，忽略
      };
      let na=key(a),nb=key(b);
      if(!na||!nb)return;
      // 若兩端映射到同一節點（例如都映射到某課題），跳過
      if(na===nb)return;
      const key2=na,key3=nb;
      var ekey=[key2,key3].sort().join('|');
      if(!emap[ekey])emap[ekey]={a:key2,b:key3,n:0,labels:[]};
      emap[ekey].n++;
      if(l.label&&emap[ekey].labels.length<3)emap[ekey].labels.push(l.label);
      return;
    }
    const k=[ka,kb].sort().join('|');
    if(!emap[k])emap[k]={a:ka,b:kb,n:0,labels:[]};
    emap[k].n++;
    if(l.label&&emap[k].labels.length<3)emap[k].labels.push(l.label);
  });
  const edges=Object.values(emap).map(e=>({s:idx[e.a],t:idx[e.b],n:e.n,labels:e.labels,ka:e.a,kb:e.b}));
  // 課題色票：聚焦模式下被牽連到的其他課題
  const peerSet={};if(!isAll)edges.forEach(e=>{peerSet[e.ka]=1;peerSet[e.kb]=1;});
  const chips=TOPICS.map(t=>{
    const n=(t.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);
    const deg=edges.filter(e=>(isAll?e.ka===t.id:e.ka===t.id||e.kb===t.id)).length;
    const on=isAll?true:t.id===gFocus;
    return `<span class="chip ${on?'on':''}" onclick="viewGraph('${t.id}')" title="${deg} 條關聯"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colorOf(t.id)};margin-right:5px;vertical-align:-1px"></i>${esc(t.title)}<b style="opacity:.65;font-weight:400;margin-left:4px">${deg}</b></span>`;
  }).join('');
  // 知识图谱过滤状态（保存原始数据以便切换）
  GRAPH_THRESHOLD = isAll ? 20 : 30;   // 节点阈值：全部 20 / 聚焦 30
  GRAPH_MAX_NODES = GRAPH_THRESHOLD;
  GRAPH_ALL_NODES = nodes;
  GRAPH_ALL_EDGES = edges;
  GRAPH_IS_ALL = isAll;
  // 超过阈值默认开启过滤：只渲染核心节点（度最高者），不渲染全部
  GRAPH_FILTERED = nodes.length > GRAPH_THRESHOLD;

  app.innerHTML=`
  <div class="view">
    <div class="thead"><button class="back" onclick="go('#/home')">← 返回首頁</button>
      <h2>🕸️ ${isAll?'跨課題知識圖譜':esc(TMAP[gFocus].title)+' 的知識地圖'}</h2>
      ${isAll?'':'<button class="qbtn" style="margin-left:0" onclick="viewGraph(\'\')">看全部課題</button>'}
    </div>
    <div class="tmeta">${isAll
      ?'每個圓點是一個課題，大小代表知識點數量；線越粗＝兩課題之間的知識串連越多。點圓點展開該課題的章節地圖，滑鼠移上去看關聯原因。'
      :'每個圓點是這個課題的一章，連到有串連的其他課題與章節。點圓點跳到該章節，滑鼠移上去看串連原因。'}</div>
    <div class="chips">${chips}</div>
    ${GRAPH_FILTERED ? `<div class="gthreshold" id="gthreshold">圖譜有 <b>${nodes.length}</b> 個節點，預設只顯示核心 <b>${GRAPH_MAX_NODES}</b> 個（關聯最多者）。
      <button onclick="toggleGraphFilter()">顯示全部節點</button></div>` : ''}
    <div class="gwrap"><svg id="graphsvg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg><div class="gtip" id="gtip"></div>
      <div class="glegend">${TOPICS.filter(t=>isAll||t.id===gFocus||peerSet[t.id]).map(t=>`<span onclick="go('#/t/${t.id}')"><i style="background:${colorOf(t.id)}"></i>${esc(t.title)}</span>`).join('')}</div>
    </div>
  </div>`;
  const show = GRAPH_FILTERED
    ? filterCoreNodes(nodes,edges,GRAPH_MAX_NODES, isAll?null:nodes.filter(n=>!n.isPeer).map(n=>n.key))
    : {nodes:nodes,edges:edges};
  drawGraph(show.nodes,show.edges,isAll);
}
/* 图谱过滤：全局状态与工具（drawGraph / toggleGraphFilter 共用） */
let GRAPH_THRESHOLD=0, GRAPH_MAX_NODES=0, GRAPH_FILTERED=false,
    GRAPH_ALL_NODES=null, GRAPH_ALL_EDGES=null, GRAPH_IS_ALL=true;
function computeNodeDegrees(nodes,edges){
  const deg=new Array(nodes.length).fill(0);
  edges.forEach(e=>{deg[e.s]++;deg[e.t]++;});
  return deg;
}
/* 只保留度（关联数）最高的前 N 个节点，并重映射边的索引；
   mustKeep（可选）＝必須保留的節點 key（聚焦模式下保留本課題自己的章節，
   避免過濾把「這張圖的主角」濾掉） */
function filterCoreNodes(nodes,edges,maxNodes,mustKeep){
  if(nodes.length<=maxNodes) return {nodes:nodes,edges:edges};
  const deg=computeNodeDegrees(nodes,edges);
  const order=nodes.map((n,i)=>({i,deg:deg[i]})).sort((a,b)=>b.deg-a.deg);
  const keep=new Set();
  if(mustKeep&&mustKeep.length){
    const idxByKey={};
    nodes.forEach((n,i)=>{ if(n.key!==undefined) idxByKey[n.key]=i; });
    mustKeep.forEach(k=>{ const i=idxByKey[k]; if(i!==undefined&&keep.size<maxNodes) keep.add(i); });
  }
  order.forEach(x=>{ if(keep.size<maxNodes) keep.add(x.i); });
  const idxMap={};
  const newNodes=[];
  nodes.forEach((n,i)=>{ if(keep.has(i)){ idxMap[i]=newNodes.length; newNodes.push(n); } });
  const newEdges=edges.filter(e=>keep.has(e.s)&&keep.has(e.t)).map(e=>({
    s:idxMap[e.s],t:idxMap[e.t],n:e.n,labels:e.labels,ka:e.ka,kb:e.kb
  }));
  return {nodes:newNodes,edges:newEdges};
}
function drawGraph(nodes,edges,isAll){
  const svg=document.getElementById('graphsvg');
  const W=1000,H=620;
  const cx=W/2,cy=H/2;

  /* ===== 修改位置：圖表文字顏色改為讀取 CSS 變數，讓深色模式下自動提亮 ===== */
  const _cs=getComputedStyle(document.documentElement);
  const CV_INK=(_cs.getPropertyValue('--ink')||'').trim()||'#3a3833';
  const CV_MUTED=(_cs.getPropertyValue('--muted')||'').trim()||'#7a756a';
  const CV_BG=(_cs.getPropertyValue('--bg')||'').trim()||'#faf7f2';

  // 確定性佈局：11 個課題用均勻環形（固定位置，無物理模擬），
  // 聚焦模式把本課題章節排成內環、牽連到的鄰課題排成外環。
  // 不用力導向——節點少、標籤長，物理模擬只會把圖疊成一團。
  if(isAll){
    const N=nodes.length;
    nodes.forEach((n,i)=>{
      const a=(i/N)*Math.PI*2-Math.PI/2;
      const rr=242+n.r*1.4;
      n.x=cx+Math.cos(a)*rr;
      n.y=cy+Math.sin(a)*rr*0.86;
    });
  }else{
    const own=nodes.filter(x=>x.topic.id===gFocus);
    const peers=nodes.filter(x=>x.topic.id!==gFocus);
    // 內環：本課題各章（依章節數自動決定環數，多於 12 章排雙環避免標籤重疊）
    const n1=own.length;
    const rings=Math.ceil(n1/12);
    own.forEach((n,i)=>{
      const ring=Math.floor(i/12);
      const per=Math.min(12,n1-ring*12);
      const k=i-ring*12;
      const a=(k/Math.max(1,per))*Math.PI*2-Math.PI/2+ring*(Math.PI/per);
      const rr=112+ring*74+n.r*0.5;
      n.x=cx+Math.cos(a)*rr*1.18;
      n.y=cy+Math.sin(a)*rr;
    });
    // 外環：牽連到的其他課題
    const n2=peers.length;
    peers.forEach((n,i)=>{
      const a=(i/Math.max(1,n2))*Math.PI*2-Math.PI/2;
      n.x=cx+Math.cos(a)*352;
      n.y=cy+Math.sin(a)*272;
    });
  }
  const tip=document.getElementById('gtip');
  function render(){
    let s='';
    edges.forEach(e=>{
      const a=nodes[e.s],b=nodes[e.t];
      s+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="#c9c2b3" stroke-width="${Math.min(5,1+e.n*0.5).toFixed(1)}" opacity=".72"/>`;
    });
    nodes.forEach((n,i)=>{
      const label=n.label.length>12?n.label.slice(0,11)+'…':n.label;
      s+=`<g class="gn" data-i="${i}" style="cursor:pointer">
        <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r.toFixed(1)}" fill="${colorOf(n.topic.id)}" opacity=".93" stroke="#fff" stroke-width="2.5"/>
        <text x="${n.x.toFixed(1)}" y="${(n.y+n.r+15).toFixed(1)}" text-anchor="middle" font-size="${isAll?14:11.5}" font-weight="${isAll?700:400}" fill="${CV_INK}" stroke="${CV_BG}" stroke-width="3.5" paint-order="stroke">${esc(label)}</text>
        <text x="${n.x.toFixed(1)}" y="${(n.y-n.r-8).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${CV_MUTED}" stroke="${CV_BG}" stroke-width="3" paint-order="stroke">${esc(n.sub)}</text></g>`;
    });
    svg.innerHTML=s;
    svg.querySelectorAll('.gn').forEach(gEl=>{
      const ni=+gEl.dataset.i,n=nodes[ni];
      gEl.addEventListener('mousemove',ev=>{
        const rel=edges.filter(e=>e.s===ni||e.t===ni);
        const other=[...new Set(rel.map(e=>nodes[e.s]===n?nodes[e.t]:nodes[e.s]).map(o=>o.label))];
        tip.innerHTML='<b>'+esc(n.topic.title)+' · '+esc(n.label)+'</b><br>'+esc(n.sub)+
          '<br>關聯：'+(other.map(esc).join('<br>')||'（暫無串連）');
        const box=svg.getBoundingClientRect();
        tip.style.display='block';
        tip.style.left=Math.max(6,Math.min(box.width-336,ev.clientX-box.left+14))+'px';
        tip.style.top=Math.max(6,ev.clientY-box.top+14)+'px';
      });
      gEl.addEventListener('mouseleave',()=>tip.style.display='none');
      gEl.addEventListener('click',()=>{
        if(isAll){viewGraph(n.key);return;}
        if(n.isPeer){viewGraph(n.key);return;}   // 點其他課題＝切換聚焦
        go('#/t/'+n.topic.id);
        setTimeout(()=>jumpSec(n.key),160);
      });
    });
  }
  render();
  // 佈局已靜態收斂，不再動畫（避免每幀把節點重新拉回）
  if(gSim)cancelAnimationFrame(gSim);
  gSim=null;
}
function toggleGraphFilter(){
  GRAPH_FILTERED = !GRAPH_FILTERED;
  const btn = document.querySelector('#gthreshold button');
  // 目前在过滤态 → 按钮提供「显示全部」；已显示全部 → 按钮提供「回到核心」
  if(btn) btn.textContent = GRAPH_FILTERED ? '顯示全部節點' : '只顯示核心節點';
  const show = GRAPH_FILTERED
    ? filterCoreNodes(GRAPH_ALL_NODES||[], GRAPH_ALL_EDGES||[], GRAPH_MAX_NODES,
                      GRAPH_IS_ALL?null:(GRAPH_ALL_NODES||[]).filter(n=>!n.isPeer).map(n=>n.key))
    : {nodes:GRAPH_ALL_NODES||[], edges:GRAPH_ALL_EDGES||[]};
  drawGraph(show.nodes, show.edges, GRAPH_IS_ALL);
}

/* ---------------- quiz ---------------- */
let QZ=null; // active session
function startQuiz(scope){
  let pool=[];
  const W=wrongSet();
  if(scope.mode==='all')pool=allQuestions();
  else if(scope.mode==='topic')pool=(QUIZ[scope.id]||[]).map(q=>Object.assign({topic:scope.id},q));
  else if(scope.mode==='unit'){
    // 整個子分區（單元）：把單元內所有課題的題目合起來
    const u=UNITS.find(x=>x.id===scope.id);
    const ids=(u&&u.topics)||[];
    pool=ids.reduce((acc,tid)=>acc.concat((QUIZ[tid]||[]).map(q=>Object.assign({topic:tid},q))),[]);
  }
  else if(scope.mode==='point')pool=allQuestions().filter(q=>q.point===scope.id);
  else if(scope.mode==='wrong')pool=allQuestions().filter(q=>W.has(q.id));
  else if(scope.mode==='wrongtopic')pool=(QUIZ[scope.id]||[]).map(q=>Object.assign({topic:scope.id},q)).filter(q=>W.has(q.id));
  else if(scope.mode==='points'){
    const set=new Set(scope.ids||[]);
    pool=allQuestions().filter(q=>q.point&&set.has(q.point));
  }
  else if(scope.mode==='topics'){
    /* 自由組合測驗：勾選任意幾個課題，把它們的題目合起來考。
       科目本身是隔離的（QUIZ 只含當前科目），所以不會混到別科。
       scope.n 可選：指定抽 n 題；不給就全部。 */
    const ids=scope.ids||[];
    let src=ids.reduce((acc,tid)=>acc.concat((QUIZ[tid]||[]).map(q=>Object.assign({topic:tid},q))),[]);
    if(scope.onlyWrong) src=src.filter(q=>W.has(q.id));
    if(scope.n){
      const n=Math.max(1,Math.min(parseInt(scope.n,10)||10,src.length));
      src=shuffle(src).slice(0,n);
    }
    pool=src;
  }
  else if(scope.mode==='random'){
    // 隨機抽題：源池（全部／錯題／指定課題）先洗牌再截取 n 題
    let src;
    if(scope.from==='wrong')src=allQuestions().filter(q=>W.has(q.id));
    else if(scope.from&&scope.from!=='all')src=(QUIZ[scope.from]||[]).map(q=>Object.assign({topic:scope.from},q));
    else src=allQuestions();
    const n=Math.max(1,Math.min(parseInt(scope.n,10)||10,src.length));
    pool=shuffle(src).slice(0,n);
  }
  if(!pool.length){go('#/quiz');setTimeout(()=>{const el=document.getElementById('qempty');if(el)el.style.display='block';},80);return;}
  pool=shuffle(pool);
  QZ={pool,i:0,score:0,answered:false,log:[]};
  go('#/run');
  if((location.hash||'').indexOf('/run')>=0)renderQ();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function quizPickChanged(){

  let txt='已選 '+ids.length+' 個課題（'+brief+'）· 共 '+total+' 題';

function explain(ok,q,extra){
  const e=document.getElementById('expl');
  const correct=q.type==='mc'?q.options[q.answer]:q.type==='tf'?(q.answer?'正確':'錯誤'):(Array.isArray(q.answer)?q.answer[0]:q.answer);
  e.className='expl show '+(ok?'good':'bad');
  const nd=QZ.nextDue;
  const dueLine=nd?'<div style="margin-top:6px;font-size:13.5px;color:#7a756a">📅 這個知識點 '+fmtDue(nd.due)+' 再複習一次</div>':'';
  e.innerHTML=(ok?'<strong>✅ 答對了！</strong>':'<strong>❌ 不對喔。</strong> 正確答案：<code>'+esc(correct)+'</code>')+(extra?'<br>'+extra:'')+
    (q.explanation?'<div style="margin-top:6px">'+esc(q.explanation)+'</div>':'')+
    (q.point&&PMAP[q.point]?'<div style="margin-top:6px">📖 相關知識點：<button class="pipopen" onclick="openPip(\''+q.point+'\')">'+esc(PMAP[q.point].p.title)+'</button> <span style="font-size:12.5px;color:#7a756a">畫中畫開啟，測驗進度不會丟</span></div>':'')+
    dueLine;
  const nb=document.getElementById('nextbtn'); if(nb)nb.style.display='inline-block';
}
function finishOne(q,ok){
  QZ.score+=ok?1:0;
  QZ.log.push({id:q.id,ok:ok,q:q.q,point:q.point});
  QZ.nextDue=null;
  touchDay();
  if(q.point){
    bumpAttempt(q.point,ok);
    var r=scheduleReview(q.point,ok);
    QZ.nextDue={pid:q.point,due:r.due,box:r.box};
  }
  if(ok)markRight(q.id);else markWrong(q.id);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  QZ.answered=true;
  updateNavBadge();
}
function answerMc(idx){
  if(QZ.answered)return;
  const q=QZ.pool[QZ.i];
  const ans=q.type==='tf'?(q.answer?0:1):q.answer;
  const ok=idx===ans;
  document.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;
    if(i===ans)b.classList.add('right');
    else if(i===idx)b.classList.add('wrong');
  });
  finishOne(q,ok);
  explain(ok,q);
}
function norm(s){
  return String(s).toLowerCase().replace(/\s+/g,'').replace(/[（）()，,。.:：;；]/g,'')
    .replace(/[０-９ａ-ｚＡ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
function answerFill(){
  if(QZ.answered)return;
  const q=QZ.pool[QZ.i];
  const inp=document.getElementById('fillin');
  const val=inp.value;
  if(!val.trim()){inp.focus();return;}
  const alts=(Array.isArray(q.answer)?q.answer:[q.answer]).map(norm);
  const ok=alts.includes(norm(val));
  inp.disabled=true;
  finishOne(q,ok);
  explain(ok,q,ok?'':'你答：<code>'+esc(val)+'</code>');
}

function ppPick(btn, qid, key){
  const card=btn.closest('.ppq');
  const ans=card.dataset.ans;
  const ok=(key===ans);
  card.querySelectorAll('.ppo').forEach(el=>{
    el.classList.remove('right','wrong','dim');
    if(el.dataset.k===ans) el.classList.add('right');
    else if(el!==btn) el.classList.add('dim');
  });
  if(!ok) btn.classList.add('wrong');
  card.dataset.done='1';

  try{ if(ok) markRight(qid); else markWrong(qid); }catch(e){}

let ppLazyObs=null;
function ppLazyInit(){
  const imgs=document.querySelectorAll('#pp-bytopic img.pplazy[data-src]');
  if(!imgs.length)return;
  if(typeof IntersectionObserver==='undefined'){
    imgs.forEach(im=>{im.src=im.dataset.src;im.removeAttribute('data-src');});
    return;
  }
  if(ppLazyObs)ppLazyObs.disconnect();
  ppLazyObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting)return;
      const im=en.target;
      if(im.dataset.src){im.src=im.dataset.src;im.removeAttribute('data-src');}
      obs.unobserve(im);
    });
  },{rootMargin:'400px 0px'});
  imgs.forEach(im=>ppLazyObs.observe(im));
}

/* ---------------- 搜尋（Web Worker + 防抖）----------------
   全量匹配丢到后台 worker，主線程不凍結；輸入加 250ms 防抖，
   避免每敲一個字符立刻检索。匹配規則（化學式／標籤／標題）與舊版一致。
   資料只在換科目時傳一次給 worker（避免每次搜索都 clone 整份 payload）。 */
let SW=null, SW_SEEDED_SID=null, SW_DEBOUNCE=250, SW_LAST=null;
function ensureSearchWorker(){
  if(SW) return SW;
  const url = (typeof __SEARCH_WORKER_URL__!=='undefined') ? __SEARCH_WORKER_URL__ : null;
  if(!url) return null;
  try{ SW = new Worker(url); }
  catch(e){ SW=null; return null; }
  SW.onmessage = function(ev){
    const d=ev.data||{};
    if(d.q !== SW_LAST) return;   // 已有更新的搜索，丟掉過期結果
    renderSearch(d.q, d.hits, d.total);
  };
  SW.onerror = function(){
    // worker 壞了／被瀏覽器擋（部分瀏覽器 file:// 限制）→ 退回主線程，補跑當前搜索
    SW=null; SW_SEEDED_SID=null;
    if(SW_LAST){ const q=SW_LAST, r=searchLocal(q); renderSearch(q,r.hits,r.total); }
  };
  return SW;
}
/* 主線程回退（worker 不可用時照舊全量遍历，匹配規則相同） */
function searchLocal(q){
  const kw=q.toLowerCase();
  const hits=[];
  TOPICS.forEach(t=>(t.sections||[]).forEach(s=>(s.points||[]).forEach(p=>{
    const hay=((p.title||'')+'\n'+(p.body||'')+'\n'+((p.tags||[]).join(' '))).toLowerCase();
    if(hay.indexOf(kw)>=0){
      const inTitle=(p.title||'').toLowerCase().indexOf(kw)>=0;
      hits.push({t:t,s:s,p:p,score:inTitle?100:10,hay:hay});
    }
  })));
  Object.keys(QUIZ).forEach(tid=>(QUIZ[tid]||[]).forEach(qq=>{
    const hay=((qq.q||'')+'\n'+(qq.explanation||'')+'\n'+((qq.options||[]).join(' '))).toLowerCase();
    if(hay.indexOf(kw)>=0)hits.push({q:qq,topic:tid,score:(qq.q||'').toLowerCase().indexOf(kw)>=0?90:5,hay:hay});
  }));
  hits.sort((a,b)=>b.score-a.score);
  return {hits:hits.slice(0,60), total:hits.length};
}
function runSearch(q){
  const w = ensureSearchWorker();
  if(!w){ const r=searchLocal(q); renderSearch(q, r.hits, r.total); return; }
  SW_LAST = q;
  const sid = SUB ? SUB.id : '';
  // 換科目才重新送資料；同科只送關鍵字
  if(SW_SEEDED_SID !== sid){
    SW_SEEDED_SID = sid;
    w.postMessage({ q: q, kw: q.toLowerCase(), sid: sid, topics: TOPICS, quiz: QUIZ });
  }else{
    w.postMessage({ q: q, kw: q.toLowerCase(), sid: sid });
  }
}

function renderSearch(q,hits,total){
  navOn('');
  const esc2=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const kw=q.toLowerCase();
  const hl=s=>{
    const t=esc2(s);const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return t.replace(re,'<mark>$1</mark>');
  };
  const list=hits.map(h=>{
    if(h.p){
      const snip=(h.p.body||'').replace(/\n/g,' ').slice(0,140);
      return `<div class="sres" onclick="jumpPoint('${h.p.id}')"><b>${hl(h.p.title)}</b>
        <div class="smeta">📖 ${esc2(h.t.title)} · ${esc2(h.s.title)} · 第 ${h.p.page||'?'} 頁</div>
        <div style="font-size:14px;color:#57534a;margin-top:4px">${hl(snip)}…</div></div>`;
    }
    const t=TMAP[h.topic];
    return `<div class="sres" onclick="startQuiz({mode:'topic',id:'${h.topic}'})"><b>📝 ${hl(h.q.q)}</b>
      <div class="smeta">測驗題 · ${esc2(t?t.title:h.topic)}${h.q.point&&PMAP[h.q.point]?' · '+esc2(PMAP[h.q.point].p.title):''}</div></div>`;
  }).join('');
  app.innerHTML=`
  <div class="view">
    <div class="thead"><button class="back" onclick="go('#/home')">← 返回首頁</button><h2>🔍 搜尋「${esc2(q)}」</h2></div>
    <div class="tmeta">找到 ${total} 個結果${total>60?'（只顯示前 60 個）':''}</div>
    ${total?list:'<div class="empty">沒有找到相關內容，換個關鍵字試試？<br><span style="font-size:14px">可以試試化學式（如 H2SO4）、名詞（如 氧化還原）或反應類型</span></div>'}
  </div>`;
  const inp=document.getElementById('sq'); if(inp)inp.value=q;
}

/*__SEARCH_WORKER__*/   /* build.py 會把 search-worker.js 注入成 var __SEARCH_WORKER_URL__ = Blob URL 表達式 */
/* ---------------- 資料管理：匯出備份 / 匯入備份 / 刪除本機紀錄 ----------------
   本站全部進度都存在瀏覽器 localStorage（鍵名以 f6note. 或 f6chem 開頭）。
   匯出＝把這些鍵打包成一個 JSON 檔下載；匯入＝驗證後寫回並重新載入；
   刪除＝清掉這些鍵。注意：網頁碰不到瀏覽器歷史與書籤，只能清本站資料。 */
function siteDataKeys(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && (k.indexOf('f6note.')===0 || k.indexOf('f6chem')===0)) out.push(k);
    }
  }catch(e){}
  return out.sort();
}
function backupPayload(){
  const data={};
  siteDataKeys().forEach(k=>{ data[k]=localStorage.getItem(k); });
  return {app:SITE_NAME, version:SITE_VER, exportedAt:new Date().toISOString(), data:data};
}
/** 驗證備份文字：回傳 {keys,data}；不是本站有效備份則回傳 null。 */
function parseBackup(text){
  let p;
  try{ p=JSON.parse(text); }catch(e){ return null; }
  const data=(p&&typeof p.data==='object'&&!Array.isArray(p.data))?p.data
            :((p&&typeof p==='object'&&!Array.isArray(p))?p:null);
  if(!data) return null;
  const keys=Object.keys(data).filter(k=>typeof data[k]==='string'
    &&(k.indexOf('f6note.')===0||k.indexOf('f6chem')===0));
  return keys.length?{keys:keys,data:data}:null;
}
function bkMsg(text,kind){
  const el=document.getElementById('bkmsg'); if(!el)return;
  el.textContent=text;
  el.style.color=(kind==='err')?'#b91c1c':'#15803d';
}
function exportBackup(){
  try{
    const payload=backupPayload();
    const n=Object.keys(payload.data).length;
    if(!n){ bkMsg('目前沒有可匯出的紀錄','err'); return; }
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=SITE_NAME+'-備份-'+dkey()+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    bkMsg('已匯出 '+n+' 項紀錄 ✓（在瀏覽器的下載資料夾）','ok');
  }catch(e){ bkMsg('匯出失敗：'+((e&&e.message)||e),'err'); }
}
function pickBackup(){
  const el=document.getElementById('bkfile');
  if(el){ el.value=''; el.click(); }
}
/** 匯入核心：把驗證過的備份寫回 localStorage（不含 confirm / 重新載入）。 */
function applyBackup(parsed){
  if(!parsed||!parsed.keys) return 0;
  parsed.keys.forEach(function(k){
    try{ localStorage.setItem(k,parsed.data[k]); }catch(e){}
  });
  return parsed.keys.length;
}
function importBackup(inp){
  const f=inp.files&&inp.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    const parsed=parseBackup(String(r.result||''));
    if(!parsed){ bkMsg('匯入失敗：這不是有效的本站備份檔','err'); inp.value=''; return; }
    if(!window.confirm('匯入將覆蓋本機現有的學習紀錄（'+parsed.keys.length+' 項），確定嗎？')){
      inp.value=''; return;
    }
    const n=applyBackup(parsed);
    bkMsg('匯入成功（'+n+' 項），正在重新載入…','ok');
    setTimeout(function(){ location.reload(); },600);
  };
  r.onerror=function(){ bkMsg('讀取檔案失敗','err'); inp.value=''; };
  r.readAsText(f);
  inp.value='';
}
/** 刪除核心：清掉本站全部鍵（不含 confirm / 重新載入），回傳清除的鍵數。 */
function clearSiteDataCore(){
  const keys=siteDataKeys();
  keys.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  return keys.length;
}
function clearSiteData(){
  const keys=siteDataKeys();
  if(!keys.length){ bkMsg('本機沒有本站的紀錄','err'); return; }
  const warn='將刪除瀏覽器裡全部《'+SITE_NAME+'》紀錄（進度、錯題、複習排程，共 '+keys.length+' 項），且不可恢復。\n建議先匯出備份。要繼續嗎？';
  if(!window.confirm(warn)) return;
  clearSiteDataCore();
  setTimeout(function(){ location.reload(); },300);
}

/* ============ 内存与存储自动管控 ============
   1. 监测 localStorage 占用，接近上限时弹窗警告，引导导出备份
   2. 限制错题单条最大长度，避免题目数据膨胀撑爆存储
   3. 监测 JS 堆内存水位，接近阈值温和提示刷新释放内存
   4. 长时间使用建议刷新释放内存
   ============================================= */
setInterval(checkMemoryAndStorage, MEM_CHECK_INTERVAL);

/* ============ PWA：Service Worker 註冊與「加到主畫面」引導 ============
   為什麼要做這件事（不只是為了離線）：
   iOS Safari 的 ITP 會清掉「7 天沒有互動」的網站的 localStorage，學習進度會無聲消失。
   使用者把本站「加到主畫面」裝成 App 之後，iOS 會給它 durable storage，不再受這個限制。
   而 iOS 判斷可否安裝的前提之一，就是本站有註冊有效的 Service Worker。
   所以下面這段是「進度不會無故歸零」的技術前提。

   注意：用 file:// 直接打開本檔時瀏覽器不支援 Service Worker，此時靜默跳過，
   不影響離線單檔的使用方式。 */
var SW_REG = null;
var PWA_STANDALONE = false;
function isStandalone(){
  try{
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function isIOS(){
  var ua = navigator.userAgent || '';
  /* iPadOS 13+ 的 Safari 會把自己報成 Mac，用觸控點數補判 */
  return /iPad|iPhone|iPod/.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}
function registerSW(){
  PWA_STANDALONE = isStandalone();
  if(!('serviceWorker' in navigator)) return;
  /* file:// 或非安全來源不支援 SW，直接跳過 */
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').then(function(reg){
      SW_REG = reg;
      /* 發現有新版本在等待時，提示使用者重新載入（避免長期停在舊版） */
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            pwaNewVersionHint();
          }
        });
      });
      /* 主動檢查更新：只在 updatefound 時被動等待是不夠的——
         瀏覽器只在「SW 檔案本身」有變化時才自動檢查，若 HTML 更新了而 SW
         沒變，使用者會一直拿到舊快取。這裡在頁面重新可見時主動 update()。 */
      try{
        var checkUpd=function(){ try{ reg.update(); }catch(e){} };
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') checkUpd();
        });
        window.addEventListener('focus', checkUpd);
      }catch(e){}
    }).catch(function(){
      /* 註冊失敗（例如在 http 的內網 IP 上）不該影響主功能，靜默略過 */
    });
  });
}
function pwaNewVersionHint(){
  try{
    if(document.getElementById('pwaupd')) return;
    var d = document.createElement('div');
    d.id = 'pwaupd';
    d.className = 'memwarn';
    d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:99;'
      + 'max-width:92vw;display:flex;gap:10px;align-items:center;';
    d.innerHTML = '<span>🔄 有新版本，重新載入即可更新</span>'
      + '<button class="pipbtn" onclick="location.reload()">重新載入</button>'
      + '<button class="pipbtn" onclick="this.parentElement.remove()">稍後</button>';
    document.body.appendChild(d);
  }catch(e){}
}
/* 「加到主畫面」引導：只在「未安裝」且「值得提示」時出現，可永久關閉。
   放在設定頁由使用者主動看，另在首次進站後溫和提示一次。 */
var PWA_HINT_KEY = 'f6note.pwa.hint';
function pwaHintDismissed(){
  try{ return localStorage.getItem(PWA_HINT_KEY) === 'off'; }catch(e){ return false; }
}
function dismissPwaHint(){
  try{ localStorage.setItem(PWA_HINT_KEY, 'off'); }catch(e){}
  var el = document.getElementById('pwahint'); if(el) el.remove();
  var s = document.getElementById('pwa-set-hint'); if(s) s.remove();
}
function pwaHintHTML(){
  if(PWA_STANDALONE) return '';
  var ios = isIOS();
  var steps = ios
    ? 'Safari 底部「分享」按鈕 → 選「加入主畫面」→ 按「新增」'
    : '瀏覽器右上角選單 → 選「安裝應用程式」或「加到主畫面」';
  return '<div class="tmeta" style="margin-bottom:8px">'
    + '<b>⚠️ 建議先加到主畫面，這關係到你的進度會不會消失。</b><br>'
    + 'iOS 會清掉「7 天以上沒打開」的網站的學習紀錄（進度、錯題、複習排程都會歸零，'
    + '而且不會有提示）。把本站<b>加到主畫面裝成 App</b> 之後就不會再被清掉。'
    + '做法：' + esc(steps) + '。'
    + '</div>'
    + '<div class="quick" style="margin:0"><button onclick="dismissPwaHint()">我知道了</button></div>';
}
/* 首次進站且未安裝時，底部溫和提示一次（不擋操作） */
function maybeShowPwaHint(){
  if(PWA_STANDALONE || pwaHintDismissed() || !isIOS()) return;
  try{ if(sessionStorage.getItem('f6note.pwa.shown') === '1') return; sessionStorage.setItem('f6note.pwa.shown','1'); }catch(e){}
  setTimeout(function(){
    if(document.getElementById('pwahint') || PWA_STANDALONE) return;
    var d = document.createElement('div');
    d.id = 'pwahint';
    d.className = 'memwarn';
    d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:98;max-width:92vw;';
    d.innerHTML = '<div style="margin-bottom:6px">📲 加到主畫面可離線用，也能避免進度被清掉。</div>'
      + '<button class="pipbtn" onclick="go(\'#/settings\')">看怎麼做</button> '
      + '<button class="pipbtn" onclick="dismissPwaHint()">不用了</button>';
    document.body.appendChild(d);
  }, 4000);
}
registerSW();

/* ---------------- router ---------------- */
function route(){
  let h=location.hash||'#/home';
  window.scrollTo(0,0);
  closePip();
  /* 離開測驗頁時移除勾選浮動條，避免它跟著跑到別的頁面 */
  try{ var _pb=document.getElementById('pickbar'); if(_pb) _pb.remove(); }catch(e){}
  // 虚拟列表清理
  if(VIRT.contentEl){
    VIRT.contentEl.removeEventListener('scroll', virtOnScroll);
    VIRT.contentEl = null;
    VIRT.listEl = null;
    VIRT.items = [];
  }
  // 离开页面前把「已讀」佇列落盤，不然剛看過的知識點會掉
  flushSeen();

  // 科目總覽、設定是唯一不屬於任何科目的頁面
  if(h==='#/subjects'||h==='#/subjects/'){
    renderSubbar(); navOn('subjects'); viewSubjects();
    const rb=document.getElementById('rbadge'); if(rb)rb.classList.remove('on');
    return;
  }
  if(h==='#/settings'||h==='#/settings/'){
    renderSubbar(); navOn('settings'); viewSettings();
    const rb2=document.getElementById('rbadge'); if(rb2)rb2.classList.remove('on');
    return;
  }

  // 解析 #/<科目>/<頁面>；沒帶科目就補上目前這科
  let rest=h.slice(1);
  const m=rest.match(/^\/([^\/]+)(\/.*)?$/);
  if(m && SUBJECTS.some(s=>s.id===m[1])){
    if(!SUB||SUB.id!==m[1]) useSubject(m[1]);
    rest=m[2]||'/home';
  }else{
    if(!SUB&&!useSubject(currentSubjectId())){ viewSubjects(); return; }
  }
  renderSubbar();

  if(rest.startsWith('/t/')){
    const parts=rest.slice(3).split('@');
    viewTopic(parts[0],parts[1]?('pt-'+parts[1]):null);
  }
  else if(rest.indexOf('/unit/')===0){
    // 單元頁：#/<科目>/unit/<單元id>
    viewUnit(decodeURIComponent(rest.slice(6)));
  }
  else if(rest==='/graph')viewGraph();
  else if(rest==='/pastpaper')viewPastPaper();
  else if(rest==='/extras')viewExtras();
  else if(rest.indexOf('/extras/')===0){ var ex=rest.slice(8).split('@'); viewExtra(decodeURIComponent(ex[0]), ex[1]||''); }
  else if(rest==='/quiz')viewQuiz();
  else if(rest==='/wrong')viewWrong();
  else if(rest==='/review')viewReview();
  else if(rest.startsWith('/search'))viewSearch(decodeURIComponent(rest.slice(8)||''));
  else if(rest==='/run')renderQ();
  else viewHome();
  updateNavBadge();
  
  // 路由切换后检查内存/存储
  checkMemoryAndStorage();
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',flushSeen);
document.addEventListener('visibilitychange',function(){if(document.hidden)flushSeen();});
route();
maybeShowPwaHint();
</script>
