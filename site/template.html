<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*__SITE_NAME__*/ /*__SITE_VERSION__*/ · /*__SITE_SUBTITLE__*/</title>
<!-- PWA：讓 iOS／Android 能「加到主畫面」安裝成 App。
     裝成 App 之後，iOS 會給它 durable storage，不再套用「7 天沒開就清空 localStorage」
     的 ITP 規則——這是學習進度不會無聲消失的關鍵。
     路徑一律用相對路徑，因為本站可能部署在 /倉庫名/ 這種子路徑下。 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="化學、物理、生物三科離線筆記：知識圖譜、測驗、複習排程與歷屆試卷考點。">
<!-- iOS 加到主畫面後的外觀 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="/*__SITE_NAME__*/">
<!-- 圖示一律放在網站根目錄，不放子資料夾。
     原因：用 GitHub 網頁上傳時，拖曳「資料夾」很容易只傳到檔案、整個資料夾沒上去，
     而 <link rel="apple-touch-icon"> 一旦指向 404，iOS 不會回退到根目錄圖示，
     會直接用 theme-color 底色 + 標題首字生成一個佔位圖示（看起來完全不是你設計的那個）。
     平鋪在根目錄就沒這個問題：拖檔案不可能漏。 -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<style>
:root{
  --bg:#faf7f2; --paper:#ffffff; --ink:#2b2a26; --muted:#7a756a;
  --line:#e8e2d6; --accent:#0f766e; --accent-soft:#e6f3f1;
  --amber:#b45309; --amber-soft:#fdf1e3; --red:#b91c1c; --red-soft:#fdecec;
  --green:#15803d; --green-soft:#e9f7ee; --shadow:0 1px 3px rgba(43,42,38,.08),0 6px 20px rgba(43,42,38,.06);
  --radius:14px;
  /* 動畫時長：全部經 --anim-k（係數）換算，設定頁可調 0.5–2.0 */
  --anim-k:1;
  --dur-fast:calc(.12s * var(--anim-k));
  --dur-base:calc(.18s * var(--anim-k));
  --dur-slow:calc(.25s * var(--anim-k));

  /* ===== 修改位置：新增語意色變數（供黑夜模式切換時反向覆蓋）===== */
  --paper-soft:#fdfcf9;        /* 次級面板、輸入框、選項卡 */
  --paper-mute:#f7f3ea;        /* 三級底、hover 區 */
  --paper-alt:#f5f1e8;         /* 表頭 */
  --code-bg:#f1ede4;           /* inline code 底色 */
  --code-bg2:#f1efe8;          /* markdown code 底色 */
  --pre-bg:#f6f4ee;            /* 代碼塊背景 */
  --pre-fg:#3d3a33;            /* 代碼塊文字 */
  --panel:#efe9dd;             /* 進度條槽、nav hover */
  --hover:#f3efe6;             /* 側欄小徽章 hover */
  --hover2:#f3efe7;            /* 按鈕 hover */
  --text-soft:#57534a;         /* 次級正文 */
  --header-bg:rgba(250,247,242,.92);
  --tip-bg:#2a2d36;            /* 提示浮條底（.memwarn / .gtip）*/
  --tip-fg:#e8e5de;            /* 提示浮條文字 */
  --scroll-thumb:#d8d2c5;      /* 虛擬滾動條 thumb */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.75;font-size:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:#f1ede4;padding:1px 6px;border-radius:6px;font-size:.92em}
/* 下標／上標：inline() 會把 c_rms、N_A 這類寫法轉成 <sub>，
   這裡給一致的視覺（略小、貼基線、不影響行高）。
   注意 line-height 用 0 才不會把行距撐開。 */
sub,sup{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}
sub{bottom:-.28em}
sup{top:-.42em}
/* 公式等寬塊裡的下標再小一點，避免與斜線/根號黏在一起 */
.ff sub,.ff sup,.progcode sub,.progcode sup{font-size:.68em}
/* 行內代碼內的下標：不繼承代碼的背景/內距，否則 sub 會變成小方塊 */
code sub,code sup{background:none;padding:0;border:0;font-size:.72em}
button{font-family:inherit}
/* ============ 動畫模式（三檔）+ 降級 ============
   html[data-anim] 由 JS 依設定寫入：
     full   = 全部開啟（預設）
     simple = 簡約：只留必要回饋（按壓、PIP 開關、進度條），移除裝飾性動畫
     off    = 完全關閉：所有 animation/transition 即時完成
   另：偵測到動畫異常（iOS Safari 閃現）時，JS 會強制降到 off。 */
html[data-anim="simple"] .view{animation:none}
html[data-anim="simple"] .tcard:hover,
html[data-anim="simple"] .subcard:hover,
html[data-anim="simple"] .extracard:hover,
html[data-anim="simple"] .sres:hover{transform:none}
html[data-anim="simple"] .ptcell:hover,
html[data-anim="simple"] .ptcell.on{transform:none}
html[data-anim="simple"] .gearbtn:hover{transform:none}
html[data-anim="simple"] .expl.show{animation:none}
html[data-anim="simple"] .memwarn{transition:opacity var(--dur-base)}
html[data-anim="off"] *,
html[data-anim="off"] *::before,
html[data-anim="off"] *::after{
  animation-duration:0s!important;
  animation-delay:0s!important;
  transition-duration:0s!important;
  transition-delay:0s!important;
}
html[data-anim="off"] .view,
html[data-anim="off"] .expl.show,
html[data-anim="off"] .pip.on{animation:none!important}
/* 使用者系統層級的減少動態偏好：尊重它（等同簡約） */
@media (prefers-reduced-motion:reduce){
  .view{animation:none}
  .tcard:hover,.subcard:hover,.extracard:hover,.sres:hover{transform:none}
  .expl.show{animation:none}
}
/* ---------- 通用按壓回饋（滑鼠 + 觸屏；iOS 無 hover 靠 :active） ---------- */
button,.tcard,.subcard,.extracard,.sres,.hchip,.scope,.opt,.ptcell,.ptlegend span,.chip,.subbar button,.rrow .go{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button:active{transform:scale(.97);filter:brightness(.96)}
.tcard:active,.subcard:active,.extracard:active{transform:scale(.985);opacity:.94}
.sres:active{transform:scale(.99);border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.99);border-color:var(--accent);background:var(--accent-soft)}
.hchip:active,.scope:active{transform:scale(.97)}
.ptcell:active{transform:scale(.96)}
.ptlegend span:active{transform:scale(.96);opacity:.85}
.chip:active{transform:scale(.96)}
.rrow .go:active{transform:scale(.96);filter:brightness(.94)}
/* 進度條寬度動畫在「完全關閉」時不要殘留 transition */
.qbar i,.pbar i{transition:width calc(.45s * var(--anim-k)) ease}
/* ---------- header ---------- */
header{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(250,247,242,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 60px 10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.brand{font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .flask{font-size:22px}
.verbadge{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;letter-spacing:.3px;vertical-align:2px}
footer .fver{color:var(--accent);font-weight:600}
/* 頁尾的版權聲明與可展開的完整免責聲明 */
footer .ftop{line-height:1.8}
footer .fcopy{margin-top:10px;padding:9px 12px;background:var(--amber-soft);border:1px solid #f0d9bd;border-radius:10px;color:#7c4a10;font-weight:600;line-height:1.7;overflow-wrap:break-word}
footer .fnote{margin-top:10px}
footer .fnote>summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0;min-height:32px;display:list-item}
footer .fnote>summary:hover{text-decoration:underline}
footer .fnote ul{margin:8px 0 0;padding-left:20px;line-height:1.85}
footer .fnote li{margin:5px 0;overflow-wrap:break-word}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{border:none;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--muted);transition:var(--dur-base)}
nav button:hover{background:#efe9dd;color:var(--ink)}
nav button.on{background:var(--accent);color:#fff}
/* 右上角設定齒輪：絕對定位釘在 header 右上角（不參與 flex 換行，任何寬度都在角落） */
.gearbtn{position:absolute;right:12px;top:8px;border:1px solid var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:var(--dur-base);flex:0 0 auto;padding:0}
.gearbtn:hover{border-color:var(--accent);transform:rotate(35deg)}
.gearbtn.on{background:var(--accent);border-color:var(--accent)}
/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:26px 20px 80px}
.view{animation:fade var(--dur-slow) ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#0f766e 0%,#115e59 60%,#134e4a 100%);color:#fff;border-radius:22px;padding:38px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"⚗️";position:absolute;right:26px;bottom:-14px;font-size:120px;opacity:.16;transform:rotate(-12deg)}
.hero h1{margin:0 0 8px;font-size:30px;letter-spacing:.5px}
.hero p{margin:0;opacity:.92;max-width:640px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0 26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--accent);line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;cursor:pointer;transition:var(--dur-base);box-shadow:var(--shadow);position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(43,42,38,.13)}
.tcard .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.tcard h3{margin:0 0 4px;font-size:19px}
.tcard .meta{font-size:13px;color:var(--muted)}
.tcard .desc{font-size:14px;color:#57534a;margin:8px 0 10px;min-height:44px}
.tcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:12px;margin-right:6px}
.quick{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 24px}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;cursor:pointer;font-size:15px;box-shadow:var(--shadow);transition:var(--dur-base)}
.quick button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
/* ---------- topic ---------- */
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.thead h2{margin:0;font-size:26px}
.back{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.tmeta{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.tlayout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.rail{position:-webkit-sticky;position:sticky;top:70px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;max-height:78vh;max-height:78dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.rail .rsec{padding:7px 10px;border-radius:9px;font-size:14px;cursor:pointer;color:#57534a}
.rail .rsec:hover{background:#f3efe6}
.rail .rsec b{display:block;font-size:14.5px;color:var(--ink)}
.rail .rsec span{font-size:12px;color:var(--muted)}
section.sblock{margin-bottom:30px}
section.sblock>h3{font-size:20px;margin:0 0 4px;padding-left:12px;border-left:5px solid var(--accent)}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.pcard h4{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pcard h4 .pg{font-size:12px;font-weight:normal;color:var(--muted);background:#f3efe6;border-radius:6px;padding:1px 8px}
.pcard .md{font-size:15.5px}
.pcard .md p{margin:6px 0}
.pcard .md ul,.pcard .md ol{margin:6px 0;padding-left:22px}
.pcard .md li{margin:3px 0}
.pcard .md table{border-collapse:collapse;margin:8px 0;font-size:14.5px;width:100%}
.pcard .md th,.pcard .md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.pcard .md th{background:#f5f1e8}
/* ---------- 虚拟滚动：长章节只渲染视口+缓冲区 ----------
   .vcontent 是整课知识点的滚动容器；.vlist 用 translate 偏移，
   只保留可见区+上下缓冲的卡片，离开视口的销毁，内存不再爆炸。 */
.vcontent{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 200px)}
.vcontent::-webkit-scrollbar{width:8px}
.vcontent::-webkit-scrollbar-thumb{background:#d8d2c5;border-radius:8px}
.vlist{position:relative;width:100%}
.vitem{margin:0}
.vplaceholder{background:linear-gradient(90deg,#f3efe6 0%,#f7f3ea 50%,#f3efe6 100%);border-radius:12px}
/* 知识图谱：节点超阈值时的过滤提示 */
.gthreshold{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--amber-soft);border:1px solid #f3ddbe;border-radius:12px;font-size:13.5px;color:#7c4a12;margin-bottom:12px}
.gthreshold button{border:1px solid var(--amber);background:#fff;color:var(--amber);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
/* ---------- 内存/存储告警：接近上限时的温和提示 ---------- */
.memwarn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#2b2a26;color:#fff;border-radius:14px;padding:14px 20px;font-size:14px;z-index:300;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;font-family:inherit}
.memwarn.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.memwarn b{color:#fde68a}
/* 筆記原圖（build 以 data URI 注入 body） */
.mdfig{margin:10px 0;text-align:center}
.mdfig img{max-width:100%;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);background:#fff;display:block;margin:0 auto;height:auto;width:auto}
.mdfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
/* 代碼塊（``` 區塊）——流程圖／公式推導用，保留換行與空格 */
pre.mdcodewrap{position:relative;margin:10px 0;padding:10px 12px;background:#f6f4ee;border:1px solid var(--line);border-left:3px solid #0f766e;border-radius:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
pre.mdcodewrap code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.65;white-space:pre;color:#3d3a33;background:none;padding:0;border:0;overflow-wrap:normal}
pre.mdcodewrap[data-lang]::before{content:attr(data-lang);position:absolute;top:4px;right:8px;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
/* 行內代碼 */
.md code,.pipbody code{background:#f1efe8;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.94em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tags{margin-top:8px}
.tag{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:1px 10px;font-size:12px;margin:2px 6px 2px 0}
.xlinks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.xlinks .xl{display:block;padding:4px 0}
.xlinks .xl b{color:var(--amber);font-weight:600}
.jump{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.qbtn{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:3px 13px;font-size:13px;cursor:pointer;margin-left:auto}
.qbtn:hover{background:#0d9488}
/* ---------- 歷屆試卷考點標記 ---------- */
.exambar{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.examtag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;line-height:1.7}
.examtag.lv3{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.examtag.lv2{background:#ffedd5;color:#c2410c;border:1px solid #fdba74}
.examtag.lv1{background:var(--amber-soft);color:var(--amber);border:1px solid #fcd34d}
.examyrs{font-size:12px;color:var(--muted)}
.examdetail{margin-top:7px;border-left:3px solid #fca5a5;background:#fff7ed;border-radius:0 8px 8px 0;padding:7px 11px;font-size:13.5px;line-height:1.65}
.examdetail b{color:#b91c1c}
.examdetail .kh{display:block;margin-top:3px}
.kw{display:inline-block;background:#fef08a;color:#854d0e;border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;font-size:13px;font-weight:600;border:1px solid #fde047}
.kwlist{margin-top:5px}
.kwlist .kwtip{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
/* 正文得分字眼高亮（由 template 依 exam.keywords 比對點亮） */
.md mark.kwmark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px;font-weight:600;box-shadow:0 1px 0 #f59e0b}
/* 密度調高後按熱度分三檔配色：越熱越醒眼，一眼看出證據強弱 */
.pcard[data-exam="3"] .md mark.kwmark{background:#fca5a5;box-shadow:0 1px 0 #dc2626}
.pcard[data-exam="2"] .md mark.kwmark{background:#fdba74;box-shadow:0 1px 0 #ea580c}
.pcard[data-exam="1"] .md mark.kwmark{background:#fde68a;box-shadow:0 1px 0 #f59e0b}
.pcard[data-exam] mark.kwmark:hover{background:#fde047;cursor:help}
/* ---------- graph ---------- */
.gwrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
#graphsvg{display:block;width:100%;height:600px;cursor:grab}
.gtip{position:absolute;pointer-events:none;background:#2b2a26;color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;max-width:320px;display:none;z-index:5;line-height:1.55}
.glegend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.glegend span{display:flex;align-items:center;gap:6px;cursor:pointer;color:#57534a}
.glegend i{width:11px;height:11px;border-radius:50%;display:inline-block}
/* ---------- quiz ---------- */
.qpanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:780px;margin:0 auto}
.qpanel h2{margin-top:0}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fdfcf9;border-radius:11px;padding:11px 15px;margin:9px 0;cursor:pointer;font-size:15.5px;transition:var(--dur-fast)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}

   這裡把基礎樣式提到全域，.rrow .go 只保留局部差異。 */
.go{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:700;line-height:1.2;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:42px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(43,42,38,.16);transition:filter .14s,transform .14s}

/* ---------- 畫中畫：測驗中看知識點，不離開測驗 ----------
   Safari 修復要點：
   1. 不要用 display:none ↔ display:flex 切換（Safari 對 display 過渡支援差，
      會先閃出最終態再跳動）→ 改用 visibility + opacity + transform 過渡，
      元素常駐 DOM、pointer-events 控制互動。
   2. 拖拽時關掉 transition，否則每幀都在補間 = 抖動；放開再恢復。
   3. 關閉時走同一組過渡，穩定淡出後才 visibility:hidden。 */
.pip{
  position:fixed;right:18px;bottom:18px;z-index:200;
  width:min(430px,calc(100vw - 24px));max-height:min(66vh,620px);
  display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 40px rgba(43,42,38,.28);overflow:hidden;
  /* 常駐但不可見；開啟時才顯示 */
  visibility:hidden;opacity:0;pointer-events:none;
  transform:translateY(10px) scale(.985);
  transition:opacity calc(.2s * var(--anim-k)) ease,
             transform calc(.2s * var(--anim-k)) ease,
             visibility 0s linear calc(.2s * var(--anim-k));
  will-change:opacity,transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.pip.on{
  visibility:visible;opacity:1;pointer-events:auto;transform:none;
  transition:opacity calc(.2s * var(--anim-k)) ease,
             transform calc(.2s * var(--anim-k)) ease,
             visibility 0s linear 0s;
}
/* 拖拽中：關掉所有過渡（含位置），避免抖動；拖完放開才恢復 */
.pip.dragging{
  transition:none!important;
  box-shadow:0 20px 56px rgba(43,42,38,.36);
}
/* 完全關閉動畫：直接顯示/隱藏，不做過渡（避免 Safari 閃現錯亂） */
html[data-anim="off"] .pip,
html[data-anim="off"] .pip.on{transition:none!important;transform:none}

.pipgrip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:18px;padding-top:2px;color:#b0aa9e;font-size:15px;line-height:1;letter-spacing:-2px}

  #graphsvg{height:460px}
  /* iOS 橫向溢出防護：中文長句 + 化學式 + 表格在小螢幕會撐破視窗 */
  html,body{max-width:100%;overflow-x:hidden}
  main{padding:20px 14px 90px}
  .tcard,.pcard,.qpanel,.gwrap,.hero{max-width:100%;overflow-wrap:break-word;word-break:break-word}
  /* 化學式不該被斷行 */
  .md code,.md strong,code,strong{white-space:nowrap}
  /* 表格在小螢幕可橫向捲動，而不是撐破頁面 */
  .pcard .md{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pcard .md table{min-width:min(100%,420px);font-size:14px}
  .pcard .md td,.pcard .md th{padding:5px 8px}
  .pcard .md pre{overflow-x:auto;font-size:13px}
  .hero h1{font-size:24px}
  .tlayout>div{min-width:0}          /* 關鍵：讓子元素可縮，避免撐破 grid */
  .tmeta{font-size:13px}
  .sec-title{font-size:17px}
  section.sblock>h3{font-size:18px}
  .thead h2{font-size:21px}
  .xlinks .xl{font-size:13.5px}
  .gwrap{overflow:hidden}
  .glegend{font-size:12px;gap:6px;padding:10px 12px}
  .scopes{grid-template-columns:1fr 1fr}
  /* ---------- iOS 觸控優化 ---------- */
  /* 觸控目標最小 44px（Apple HIG），頂部導覽與卡片按鈕在 iPhone 上放大 */
  nav button{padding:10px 15px;font-size:16px}
  .gearbtn{width:44px;height:44px;font-size:22px;top:8px;right:10px}
  .opt{padding:13px 16px;font-size:16.5px}
  .qbtn{padding:9px 16px;font-size:14px;min-height:36px}
  /* 章節側欄是可橫向滑動的卡片，溢出視口屬預期（overflow-x:auto） */
  .rail .rsec{min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .back{padding:9px 16px;font-size:15px}
  .nextbtn{padding:13px 26px;font-size:16px}
  .scope{padding:15px 15px;font-size:16px}
  .chip{padding:9px 16px;font-size:15px}
  .quick button{padding:12px 19px;font-size:16px}
  .randrow select,.randrow input{font-size:16px;min-height:44px}
  .randgo{min-height:44px}
  .rail .rsec{padding:10px 11px;font-size:15px;min-width:170px;flex:0 0 auto}
  /* 入力框字體必須 ≥16px，否則 iOS 聚焦時會自動放大整頁 */
  .fillrow input{font-size:16px;padding:12px 14px}
  /* iOS 不支援 hover，補上 :active 觸覺回饋 */
  .tcard:active,.scope:active,.chip:active,.opt:active{transform:scale(.985);opacity:.92}
  .quick button:active,.back:active,.nextbtn:active,.qbtn:active{opacity:.75}
  /* 避免 iOS 長按選取時彈出放大鏡，影響題目閱讀 */
  .pcard,.qpanel,nav,.gwrap{-webkit-user-select:none;user-select:none}
  .fillrow input{-webkit-user-select:text;user-select:text}
  /* 修正點擊延遲（沒有 300ms 延遲的舊 iOS） */
  button,a,[onclick]{touch-action:manipulation}
  /* iPhone SE 等小螢幕再縮一點間距 */
  @media (max-width:380px){
    .stats{grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
    .grid{grid-template-columns:1fr}
    .hero{padding:26px 20px}
    .hero h1{font-size:23px}
  }
}

}

/* 每張公式卡用自己的課題色（--tc，由 colorOf(topicId) 注入），
   與首頁課題卡、知識圖譜、搜尋結果的配色一致。
   邊框用 35% 課題色（比之前的 22% 更清楚），左側 5px 實心色條做主要識別。 */
.fcard{position:relative;background:#fff;border:1px solid color-mix(in srgb,var(--tc,#ef8ba6) 35%,#fff);border-radius:18px;padding:15px 16px 13px 20px;box-shadow:0 3px 14px rgba(43,42,38,.07);min-width:0;transition:transform .18s,box-shadow .18s;overflow:hidden}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,#ef8ba6)}
.fcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(43,42,38,.13)}
.fcard .ff{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:14.5px;font-weight:700;line-height:1.7;color:#2f2a26;background:color-mix(in srgb,var(--tc,#ef8ba6) 8%,#fff);border:1px solid color-mix(in srgb,var(--tc,#ef8ba6) 32%,#fff);border-radius:12px;padding:9px 12px;margin:0 0 9px;overflow-wrap:break-word;word-break:break-word}
.fcard .fn{font-size:13.5px;color:#5c4a52;line-height:1.7;margin:0 0 8px;overflow-wrap:break-word}
.fcard .fsym{font-size:12.5px;color:#8a7280;line-height:1.8;margin:0 0 2px;padding:0;list-style:none}
.fcard .fsym li{overflow-wrap:break-word;padding-left:2px}
.fcard .fsym li::before{content:"·";color:var(--tc,#e9b6c6);margin-right:5px;font-weight:800}
.fcard .ffoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--tc,#ef8ba6) 20%,#fff);font-size:12px;color:#a08b95}
.fbadge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}

/* 課題標籤：淡底 + 課題色圓點，邊界靠底色與卡片白底拉開 */

/* =============================================================
   ===== 修改位置：iOS 風格主題切換開關（Light / Dark Toggle）=====
   位置：header 右上角、齒輪按鈕左側
   行為：純 CSS 依 html[data-theme] 切換 track 顏色、thumb 位置與圖標
   ============================================================= */
.themetoggle{
  position:absolute;right:58px;top:8px;
  width:52px;height:32px;border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel);
  cursor:pointer;padding:0;
  display:flex;align-items:center;
  box-shadow:var(--shadow);
  transition:background calc(.28s * var(--anim-k)) ease,
             border-color calc(.28s * var(--anim-k)) ease;
  flex:0 0 auto;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.themetoggle:hover{border-color:var(--accent)}
.themetoggle .thumb{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:var(--paper);
  box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;
  transition:transform calc(.28s * var(--anim-k)) cubic-bezier(.2,.8,.2,1),
             background calc(.28s * var(--anim-k)) ease;
  overflow:hidden;
}
.themetoggle .thumb .ic-sun{display:inline-block}
.themetoggle .thumb .ic-moon{display:none}
html[data-theme="dark"] .themetoggle{
  background:var(--accent);
  border-color:var(--accent);
}
html[data-theme="dark"] .themetoggle .thumb{
  transform:translate(20px,-50%);
  background:#0d1117;
}
html[data-theme="dark"] .themetoggle .thumb .ic-sun{display:none}
html[data-theme="dark"] .themetoggle .thumb .ic-moon{display:inline-block}
/* 無障礙：鍵盤 focus 時有清楚輪廓 */
.themetoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){
  /* 手機：與 gearbtn（44×44 right:10）左緣對齊留 8px 間隔 → right: 62 */
  .themetoggle{right:64px;top:10px;width:56px;height:36px}
  .themetoggle .thumb{width:30px;height:30px;font-size:15px}
  html[data-theme="dark"] .themetoggle .thumb{transform:translate(20px,-50%)}
}
@media (prefers-reduced-motion:reduce){
  .themetoggle,.themetoggle .thumb{transition:none}
}

/* =============================================================
   ===== 修改位置：黑夜模式（Dark Theme）覆蓋層 =====
   策略：light 模式 100% 保持原樣；dark 模式由這一段全部反轉。
   1) 先覆蓋核心 CSS 變數（body/card/border/文字自動跟隨）
   2) 再覆蓋硬編碼 #fff / #fdfcf9 / #efe9dd 等選擇器
   3) 最後處理元素專屬色（表格頭、代碼塊、圖表文字、警示條）
   ============================================================= */
html[data-theme="dark"]{
  --bg:#12141a;
  --paper:#1c1e25;
  --paper-soft:#22252c;
  --paper-mute:#262933;
  --paper-alt:#2b2e38;
  --code-bg:#2b2e38;
  --code-bg2:#2e313b;
  --pre-bg:#1a1c22;
  --pre-fg:#d6d3cc;
  --panel:#2a2d36;
  --hover:#282b33;
  --hover2:#2b2e38;
  --header-bg:rgba(18,20,26,.92);
  --ink:#e8e5de;
  --text-soft:#b8b3a8;
  --muted:#8a857a;
  --line:#31343e;
  --accent:#2dd4bf;
  --accent-soft:#0f3d38;
  --amber:#fbbf24;
  --amber-soft:#3a2e1a;
  --red:#f87171;
  --red-soft:#3a1a1a;
  --green:#4ade80;
  --green-soft:#173d24;
  --tip-bg:#2a2d36;
  --tip-fg:#e8e5de;
  --scroll-thumb:#3a3e49;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] header{background:var(--header-bg)}
html[data-theme="dark"] nav button:hover{background:var(--panel);color:var(--ink)}
html[data-theme="dark"] code{background:var(--code-bg);color:var(--ink)}
html[data-theme="dark"] .tcard .desc,
html[data-theme="dark"] .subcard .sdesc,
html[data-theme="dark"] .qpick-d,
html[data-theme="dark"] .rail .rsec,
html[data-theme="dark"] .subbar button,
html[data-theme="dark"] .legallist,
html[data-theme="dark"] .glegend span,
html[data-theme="dark"] .emptybox .how{color:var(--text-soft)}

<script>
/* iOS 舊版 Safari 的 vh 問題補償：真實可視高度寫進 CSS 變數 */
(function(){
  function setVh(){
    document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px');
  }
  setVh();window.addEventListener('resize',setVh);window.addEventListener('orientationchange',function(){setTimeout(setVh,120);});
})();
</script>
<script>
/* ===== 修改位置：主題（Light / Dark）初始化 =====
   必須在 <style> 之後、<body> 渲染之前執行，否則首屏會先閃一下白色。
   儲存鍵：f6note.theme（'light' | 'dark'）
   預設邏輯：若使用者手動選過 → 用該值；否則跟隨系統偏好；
            系統偏好淺色時用 light，其餘（偏好深色或無偏好）用 dark。 */
(function(){
  var THEME_KEY='f6note.theme';
  var m='';
  try{ m=localStorage.getItem(THEME_KEY)||''; }catch(e){}
  if(m!=='light' && m!=='dark'){
    try{
      if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) m='light';
      else m='dark';
    }catch(e){ m='dark'; }
  }
  document.documentElement.setAttribute('data-theme', m);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
})();
</script>
<script>
/* ============ 動畫設定：三檔模式 + 時長係數 + 降級偵測 ============
   必須在 CSS 之後、主腳本之前執行，否則首屏會用錯模式（先全開再切換 = 閃現）。
   儲存鍵：f6note.anim（'full' | 'simple' | 'off'）、f6note.animk（係數 0.5–2.0） */
var ANIM_KEY='f6note.anim', ANIMK_KEY='f6note.animk';
var ANIM_DEFAULT='full';
var ANIM_MODES=['full','simple','off'];

/* iOS Safari 動畫異常偵測：
   - 舊版 Safari（<15.4）對 CSS 變數在 calc() 中的 animation/transition 支援不完整
   - 偵測到就自動降級為 off，避免元素閃現錯亂
   回傳 true 表示「動畫不可靠」 */
function detectAnimBroken(){
  try{
    var ua=navigator.userAgent||'';
    var isIOS=/iP(hone|ad|od)/.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var isSafari=/Safari/.test(ua) && !/Chrome|CriOS|FxiOS|Edg|OPR/.test(ua);
    if(isIOS && isSafari){
      // 版本偵測：iOS < 15.4 的 Safari 對 visibility/transform 過渡有已知閃現
      var m=ua.match(/OS (\d+)[._](\d+)/);
      if(m){
        var major=parseInt(m[1],10), minor=parseInt(m[2],10);
        if(major<15 || (major===15 && minor<4)) return true;
      }
      // 沒有版本號（iPadOS 桌面模式）但支援度不明 → 保守降級
      if(!m && !window.CSS || (window.CSS && !CSS.supports('transition','opacity 1s'))){
        return true;
      }
    }
    // 一般偵測：不支援 transition 就別開動畫
    if(!window.CSS || !CSS.supports || !CSS.supports('transition','opacity 1s')) return true;
  }catch(e){ return false; }
  return false;
}
var ANIM_BROKEN=detectAnimBroken();

function animMode(){
  var v='';
  try{ v=localStorage.getItem(ANIM_KEY)||''; }catch(e){}
  if(ANIM_MODES.indexOf(v)<0) v=ANIM_DEFAULT;
  // 偵測到動畫異常時強制關閉（使用者仍可在設定頁手動覆寫，見 animForce）
  if(ANIM_BROKEN && !animForce()) return 'off';
  return v;
}
function animForce(){
  try{ return localStorage.getItem('f6note.animforce')==='1'; }catch(e){ return false; }
}
function animDisabled(){ return animMode()==='off'; }
function animK(){
  var v=parseFloat((function(){ try{ return localStorage.getItem(ANIMK_KEY)||''; }catch(e){ return ''; } })());
  if(isNaN(v)||v<=0) v=1;
  return Math.max(.5, Math.min(2, v));
}
/* 套用到 DOM：html[data-anim] + --anim-k */
function applyAnim(){
  var mode=animMode();
  document.documentElement.setAttribute('data-anim', mode);
  document.documentElement.style.setProperty('--anim-k', String(animK()));
  return mode;
}
/* 設定頁改動後呼叫：即時套用，不用重載 */
function setAnimMode(m){
  if(ANIM_MODES.indexOf(m)<0) return;
  try{ localStorage.setItem(ANIM_KEY, m); }catch(e){}
  if(ANIM_BROKEN) try{ localStorage.setItem('f6note.animforce','1'); }catch(e){}
  applyAnim();
}
function setAnimK(k){
  k=Math.max(.5, Math.min(2, parseFloat(k)||1));
  try{ localStorage.setItem(ANIMK_KEY, String(k)); }catch(e){}
  document.documentElement.style.setProperty('--anim-k', String(k));
  return k;
}
applyAnim();
</script>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
const SUBJECTS = DATA.subjects || [];
const SITE = DATA.site || {name:'神智核', version:'V0.1.0'};
const SITE_NAME = SITE.name || '神智核';
const SITE_VER = SITE.version || 'V0.1.0';
const SITE_TITLE = SITE_NAME + ' ' + SITE_VER;
const app = document.getElementById('app');

/* ===== 修改位置：主題切換（Light / Dark）=====
   toggleTheme()：讀當前 data-theme 並切到相反值
   setTheme(t)：套用並寫入 localStorage，同時更新 <meta theme-color>
   注意：初始值已在 <head> 內的 IIFE 設定，這裡只負責「切換」與「寫入」。 */
function setTheme(t){
  if(t!=='light' && t!=='dark') t='dark';
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('f6note.theme', t); }catch(e){}
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', t==='dark' ? '#12141a' : '#0f766e');
  var sw=document.getElementById('themetoggle');
  if(sw) sw.setAttribute('aria-checked', t==='dark' ? 'true' : 'false');
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
  setTheme(cur==='dark' ? 'light' : 'dark');
}

/* ============ 科目層 ============
   每個科目（化學／物理／生物）是一份完全獨立的資料：自己的課題、串連、測驗題，
   連學習進度都存在各自的 localStorage 鍵裡，互不干擾。
   頁面永遠在「某一個科目」的範圍內運作，切科目時重建下面這組快取。 */
let SUB=null, TOPICS=[], UNITS=[], LINKS=[], QUIZ={}, TMAP={}, PMAP={}, XMAP={}, COLORS={};
const CHEM_COLORS = {"1a":"#8b5cf6","1b":"#0ea5e9","1c":"#d97706","2a":"#0f766e","2b":"#dc2626","3a":"#db2777","3b":"#ea580c","3c":"#e11d48","4a":"#2563eb","4b":"#059669","6":"#7c3aed","8":"#0891b2"};
const PALETTE = ["#2563eb","#7c3aed","#db2777","#ea580c","#0891b2","#059669","#b45309","#dc2626","#0ea5e9","#8b5cf6","#15803d","#d97706"];
const SUBKEY = 'f6note.subject';

function colorOf(id){return COLORS[id]||(SUB?SUB.color:"#7a756a");}

function useSubject(sid){
  const s = SUBJECTS.find(x=>x.id===sid) || SUBJECTS[0];
  if(!s) return false;
  SUB = s;
  TOPICS = s.topics || [];
  UNITS  = s.units  || [];
  LINKS  = s.links  || [];
  QUIZ   = s.quiz   || {};
  TMAP = {}; TOPICS.forEach(t=>TMAP[t.id]=t);
  PMAP = {}; // pointId -> {p, s(章), t(課題)}
  TOPICS.forEach(t=>(t.sections||[]).forEach(sec=>(sec.points||[]).forEach(p=>{PMAP[p.id]={p,s:sec,t:t};})));
  XMAP = {}; // pointId -> [{to,label}]
  LINKS.forEach(l=>{
    (XMAP[l.from]=XMAP[l.from]||[]).push({to:l.to,label:l.label||''});
    (XMAP[l.to]=XMAP[l.to]||[]).push({to:l.from,label:l.label||''});
  });
  COLORS = {};
  if(s.id==='chem') Object.assign(COLORS, CHEM_COLORS);
  const pal = (s.colors && s.colors.length) ? s.colors : PALETTE;
  TOPICS.forEach((t,i)=>{ if(!COLORS[t.id]) COLORS[t.id]=pal[i%pal.length]; });
  try{ localStorage.setItem(SUBKEY, s.id); }catch(e){}
  /* 切科目時清空測驗勾選並移除浮動操作條，避免殘留別科的課題 id */
  try{ COMBO={ids:[]}; }catch(e){}
  try{ var _pb=document.getElementById('pickbar'); if(_pb) _pb.remove(); }catch(e){}
  migrateStore(s.id);
  return true;
}
function currentSubjectId(){
  let saved='';
  try{ saved = localStorage.getItem(SUBKEY)||''; }catch(e){}
  if(saved && SUBJECTS.some(x=>x.id===saved)) return saved;
  return (SUBJECTS[0]||{}).id||'';
}
function subjectById(sid){ return SUBJECTS.find(x=>x.id===sid); }
function storeKey(sid){
  sid = sid || (SUB&&SUB.id) || '';
  if(!sid) return 'f6note.v1';
  return sid==='chem' ? 'f6chem.v1' : ('f6note.'+sid+'.v1');
}
/* 不切換科目也能讀某科的統計（給科目總覽頁用） */
function subjectPoints(s){
  const out=[];
  (s.topics||[]).forEach(t=>(t.sections||[]).forEach(sec=>(sec.points||[]).forEach(p=>out.push(p))));
  return out;
}
function masteryFor(sid){
  const s=subjectById(sid);
  if(!s) return {m:0,pts:0,mastered:0};
  const at = STORE.get(sid).attempts || {};
  let tot=0,n=0,mc=0;
  subjectPoints(s).forEach(p=>{
    n++;
    const a=at[p.id]; let m=0;
    if(a&&a.n) m=Math.max(0,Math.min(1,(a.r/a.n)*Math.min(1,a.n/2)));
    tot+=m; if(m>=0.85) mc++;
  });
  return {m:n?tot/n:0,pts:n,mastered:mc};
}
function dueCountFor(sid){
  const s=subjectById(sid);
  if(!s) return 0;
  const st=STORE.get(sid), seen=st.seen||{}, rv=st.review||{}, at=st.attempts||{}, now=Date.now();
  const ids={}; subjectPoints(s).forEach(p=>{ids[p.id]=1;});
  // 只算有出題的知識點（跟複習頁 dueList() 同一套判準，數字才對得上）
  const qp={};
  Object.keys(s.quiz||{}).forEach(tid=>(s.quiz[tid]||[]).forEach(q=>{if(q&&q.point)qp[q.point]=1;}));
  let n=0;
  Object.keys(seen).forEach(pid=>{
    if(!ids[pid]||!qp[pid]) return;
    const r=rv[pid];
    if(r){ if(r.due<=now) n++; }
    else if(!(at[pid]&&at[pid].n)) n++;
  });
  return n;
}

/* ---------------- helpers ---------------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* 下標：資料裡大量用 c_rms、N_A、F_x、m_e 這種寫法，直接顯示會是字面下劃線
   （使用者反映「下角標變下劃線」）。這裡把「基底_下標」渲染成真正的 <sub>。
   規則設計（幾個坑都踩過）：
     1. 基底可帶多位（mAu_A、VsI_s、mcrms² 都要能吃）——但若整段是 snake_case
        （前後都有英數、或含多個下劃線），就不要動。
     2. 下標後面常接 ) 」、空格、+ 等符號，不能要求「詞尾」，故改用「不是英數」即可。
     3. 行內代碼（<code>）內的內容一律不動，保留原樣給人抄。
     4. __粗體__ 的雙下劃線不處理。 */
var SUB_RE=/([A-Za-zα-ωΑ-Ω][A-Za-z0-9α-ωΑ-Ω]*)_([A-Za-z0-9α-ωΑ-Ω]+)(?![A-Za-z0-9α-ωΑ-Ω_])/g;
function subify(html){
  // 先做一輪：處理標準「基底_下標」
  var out=html.replace(SUB_RE,function(m,base,sub){
    // snake_case 防呆：全小寫長單詞（如 snake_case_name）不轉
    var looksLikeCode=/^[a-z]+$/.test(base) && base.length>3;
    if(looksLikeCode && !/^[A-Z]/.test(sub)) return m;
    return base+'<sub>'+sub+'</sub>';
  });
  // 第二輪：處理「m_AuA」這種下標後面緊跟字母的連續記號
  // （物理慣例 m_Au_A 常被寫成 m_AuA，本意仍是 m_A·u_A）
  out=out.replace(/([A-Za-z])_([A-Za-z0-9])(?=[A-Za-z])/g,function(m,b,s){
    return b+'<sub>'+s+'</sub>';
  });
  return out;
}
function inline(s){
  var t=esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  /* 行內代碼（反引號）也要做下標轉換。
     原本刻意保留原樣「方便抄寫」，但實際資料裡大量公式就寫在反引號內
     （`V_s I_s = V_p I_p`、`s_y = u_y t`），保留字面下劃線反而讓使用者
     以為是排版壞了。複製時瀏覽器會帶上 <sub> 但貼到純文字處即恢復成
     原字元，不影響抄寫。 */
  return subify(t);
}
function mdLite(src,keywords){
  const lines = String(src||'').split(/\r?\n/);
  let html='', i=0;
  const isTableRow=l=>/^\s*\|.*\|\s*$/.test(l);
  // 圖片行：![說明](src)——src 為 build 注入的 data URI；連續圖片行併成一個 figure
  // 支援單圖 ![](a.webp) 與多圖 ![](a.webp, b.webp, c.webp)（逗號分隔任意張數）
  const IMG_LINE_RE=/^\s*!\[([^\]]*)\]\(([^)]*)\)\s*$/;
  const splitSrcs=s=>String(s).split(',').map(x=>x.trim()).filter(Boolean);
  while(i<lines.length){
    let line=lines[i];
    if(!line.trim()){i++;continue;}
    {
      const im=line.match(IMG_LINE_RE);
      if(im){
        // 收集連續的圖片行（含多圖行），全部併進同一個 figure
        const allSrcs=[]; let cap='';
        while(i<lines.length){
          const m2=lines[i].match(IMG_LINE_RE);
          if(!m2)break;
          if(!cap&&m2[1].trim())cap=m2[1].trim();
          for(const s of splitSrcs(m2[2]))allSrcs.push(s);
          i++;
        }
        if(allSrcs.length){
          html+='<figure class="mdfig">'+allSrcs.map(s=>
            '<img decoding="async" src="'+esc(s)+'" alt="'+esc(cap)+'" title="'+esc(cap)+'">'
          ).join('')+(cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure>';
        }
        continue;
      }
    }
    if(/^```/.test(line)){
      let code='';
      const lang=line.slice(3).trim();
      i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){
        code+=lines[i]+'\n';
        i++;
      }
      if(i<lines.length)i++;
      // 代碼塊內的公式同樣做下標轉換：這裡放的多是物理/化學推導（m_A u_A、F_AB），
      // 顯示成字面下劃線既難看又容易誤讀。縮排與換行靠 <pre> 的 white-space 保留，
      // 插入的 <sub> 不會破壞排版。
      html+='<pre class="mdcodewrap"'+(lang?' data-lang="'+esc(lang)+'"':'')+'><code>'+subify(esc(code))+'</code></pre>';
      continue;
    }
    if(isTableRow(line)){
      const rows=[];
      while(i<lines.length&&isTableRow(rows.length<1||true?lines[i]:lines[i])){ if(!isTableRow(lines[i]))break; rows.push(lines[i]); i++; }
      let out='<table>';
      rows.forEach((r,ri)=>{
        const cells=r.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
        if(ri===1&&cells.every(c=>/^:?-{2,}:?$/.test(c)))return;
        if(cells.length&&cells[cells.length-1]==='')cells.pop();
        const tag=ri===0?'th':'td';
        out+='<tr>'+cells.map(c=>'<'+tag+'>'+inline(c)+'</'+tag+'>').join('')+'</tr>';
      });
      html+=out+'</table>';continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      let items=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      html+='<ul>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      let items=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+[.)]\s+/,''));i++;}
      html+='<ol>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';continue;
    }
    if(/^\s*#{1,4}\s+/.test(line)){html+='<p><strong>'+inline(line.replace(/^\s*#{1,4}\s+/,''))+'</strong></p>';i++;continue;}
    if(/^\s*>\s?/.test(line)){html+='<p style="color:#7a756a">'+inline(line.replace(/^\s*>\s?/,''))+'</p>';i++;continue;}
    let para=[];
    while(i<lines.length&&lines[i].trim()&&!isTableRow(lines[i])&&!IMG_LINE_RE.test(lines[i])&&!/^```/.test(lines[i].trim())&&!/^\s*[-*]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^\s*#{1,4}\s+/.test(lines[i])&&!/^\s*>\s?/.test(lines[i])){para.push(lines[i]);i++;}
    html+='<p>'+para.map(inline).join('<br>')+'</p>';
  }
  return keywords ? markKeywords(html,keywords) : html;
}
/* ---------- 得分字眼高亮 ----------
   做法 Y：不改知識點正文，改成「比對正文裡出現的得分字眼並點亮」。
   規則：
     · 只在該知識點 exam.level>=3 時啟用，避免到處泛黃
     · 比對前先把關鍵字降冪、去掉空白與標點，容忍 OCR 常見的異體/標點差異
     · 比對後還原關鍵字邊界，再用 <mark> 包起來（長度 >=2 才標，避免單字亂命中）
   已標記的片段用屬性 data-kw 記錄，重複呼叫時不會二次套標。 */
function normalizeForKw(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[\s\u3000]+/g,'')          // 空白
    .replace(/[，。、；：？！「」『』（）()《》〈〉·…—～,.;:?!"'\[\]{}<>\/\\|`~@#$%^&*+=_]/g,''); // 標點
}
function markKeywords(htmlSrc, keywords){
  const src=String(htmlSrc);
  const live=[...new Set((keywords||[]).map(k=>String(k).trim()))]
    .filter(k=>k.length>=2 && src.includes(k))
    .sort((a,b)=>b.length-a.length);
  if(!live.length) return src;

  // ⚡ 效能關鍵（原本 2a 課題渲染要 11 秒，全卡在這裡）：
  //   舊寫法對每個關鍵字跑一次 `([^<>]*?)(kw)` 惰性前綴正則，
  //   惰性前綴在長段落上會退化成 O(N²)，再乘上 12 個關鍵字 → 卡到不能動。
  //   改法：(1) 先用一個正則把標籤/文字一次切開（每個文字片段都很短）；
  //        (2) 用「最長優先」的聯合正則單遍匹配，整體回到 O(N)。
  const re=new RegExp(live.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');

  const pieces=src.split(/(<[^>]*>)/);
  let skip=0;   // >0 表示正在 <code>/<a> 內，不高亮（避免染到程式碼與連結）
  for(let i=0;i<pieces.length;i++){
    const p=pieces[i];
    if(i%2===1){                       // 奇數索引是標籤本身
      if(/^<(code|a)\b/i.test(p)) skip++;
      else if(/^<\/(code|a)\s*>/i.test(p)) skip=Math.max(0,skip-1);
      continue;
    }
    if(skip||!p) continue;
    let n=0;
    pieces[i]=p.replace(re,(hit)=>{
      if(n>=20) return hit;
      n++;
      return '<mark class="kwmark" data-kw="'+esc(hit)+'">'+hit+'</mark>';
    });
  }
  return pieces.join('');
}
/* 依 p.exam 渲染考點標記 + 得分字眼清單 */
function examBadge(p){
  const e=p.exam;
  if(!e||!e.years||!e.years.length) return '';
  const lv=e.level||1;
  const label=lv>=3?'必考熱點':lv>=2?'常考':'考過';
  const icon=lv>=3?'🔥':lv>=2?'⭐':'·';
  let h=`<div class="exambar"><span class="examtag lv${lv}">${icon} ${label}</span>`
    +`<span class="examyrs">${e.years.join(' / ')} 考過（${e.hits}年）</span></div>`;
  if((e.keywords||[]).length){
    h+=`<div class="examdetail"><b>得分字眼（${e.keywords.length}）</b>`
      +`<span class="kwlist"><span class="kwtip">評卷參考常見的採分表述，答題時要寫出來</span>`
      +e.keywords.map(k=>`<span class="kw">${esc(k)}</span>`).join('')
      +`</span></div>`;
  } else if((e.samples||[]).length){
    h+=`<div class="examdetail"><b>題目實例</b>`
      +e.samples.slice(0,3).map(s=>`<span class="kh">· ${esc(s.y)} ${esc(s.ref)}：${esc(s.focus)}</span>`).join('')
      +`</div>`;
  }
  return h;
}
/* 所有頁面網址都帶科目代號（#/chem/home），這樣換科目不會互相蓋掉，
   也能直接把某一科的某個課題分享出去。go() 會自動把沒帶科目的舊式網址補上。 */
function normalizeHash(h){
  if(!h || h.charAt(0)!=='#') return h;
  const rest=h.slice(1);
  if(rest==='/subjects'||rest==='/subjects/') return '#/subjects';
  if(rest==='/settings'||rest==='/settings/') return '#/settings';
  const m=rest.match(/^\/([^\/]+)(\/.*)?$/);
  if(!m) return h;
  if(SUBJECTS.some(s=>s.id===m[1])) return h;
  const sid=(SUB&&SUB.id)||currentSubjectId();
  if(!sid) return h;
  return '#/'+sid+rest;
}
function go(h){location.hash=normalizeHash(h);}
function goBack(){ if(history.length>1) history.back(); else go('#/home'); }
function navOn(r){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  // 設定齒輪在 #nav 之外，單獨同步高亮
  const g=document.getElementById('gearbtn'); if(g) g.classList.toggle('on',r==='settings');
}

/* iOS Safari 在慣性捲動中會無聲忽略 scrollIntoView，故自製穩健捲動：
   先歸零 scrollTop 停掉慣性，再平滑捲動到目標；失敗時退回瞬間跳轉。
   動畫模式感知：simple/off 或系統減少動態時改為直接到位（不做平滑），
   但「跳到錨點並高亮」這個必要回饋一律保留。 */
function smoothScrollTo(top){
  top=Math.max(0, Math.round(top));
  var behavior = animDisabled() ? 'auto' : 'smooth';
  if(prefersReducedMotion()) behavior='auto';
  try{ window.scrollTo({top:top, behavior:behavior}); }
  catch(e){ window.scrollTo(0, top); }
  return behavior==='smooth';
}
function prefersReducedMotion(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
}
function scrollToEl(el,block){
  if(!el)return;
  var top=el.getBoundingClientRect().top+window.pageYOffset-(block==='center'?(window.innerHeight/2):72);
  var smooth=smoothScrollTo(top);
  if(!smooth) return;   // 已直接到位，不需保險
  // 保險：iOS 若忽略 smooth，捲動後強制到位（延時隨動畫係數走）
  var wait=Math.max(320, Math.round(420*animK()));
  setTimeout(function(){
    var cur=window.pageYOffset;
    if(Math.abs(cur-top)>40){try{window.scrollTo({top:top,behavior:'auto'});}catch(e2){window.scrollTo(0,top);}}
  },wait);
}
/* 跳到某個知識點並閃一下高亮（章節跳轉／搜尋跳轉共用） */

/* ---------------- quiz store ----------------
   進度依科目分開存：化學沿用舊鍵 f6chem.v1（不讓既有紀錄失效），
   物理／生物各用自己的鍵，三科互不汙染。 */
/* ============ 内存与存储自动管控 ============
   必须放在 STORE 之前定义（const/let 有 TDZ，STORE.set 会引用这些常量）。
   1. 监测 localStorage 占用，接近上限时提示导出备份
   2. 单条纪录过长时截断超长字串，避免撑爆存储
   3. 监测 JS 堆内存水位，接近阈值温和提示刷新释放内存
   4. 长时间使用建议刷新释放内存
   ============================================= */
var MEM_CHECK_INTERVAL = 30000;      // 30秒检查一次
var MEM_WARN_THRESHOLD = 0.85;       // JS 堆内存使用率 > 85% 警告
var STORAGE_WARN_THRESHOLD = 0.8;    // localStorage 使用率 > 80% 警告
var MAX_STORE_ITEM = 400000;         // 单条 store 序列化上限（字符）
var MAX_WRONG_ITEM_LENGTH = 50000;   // 错题单条最大字符数（约 50KB）
var memWarnShown = false, storageWarnShown = false, longSessionWarnShown = false;
var SESSION_START = Date.now();
var LONG_SESSION_MS = 30 * 60 * 1000; // 30分钟

function getStorageUsage(){
  var total = 0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && (k.indexOf('f6note.')===0 || k.indexOf('f6chem')===0)){
        total += (localStorage.getItem(k)||'').length + k.length;
      }
    }
  }catch(e){}
  return total;
}
function getStorageQuota(){ return 5 * 1024 * 1024; } // 多数浏览器约 5MB
function checkStorage(){
  var used = getStorageUsage(), quota = getStorageQuota(), ratio = used/quota;
  if(ratio >= STORAGE_WARN_THRESHOLD && !storageWarnShown){
    storageWarnShown = true;
    showMemWarn('⚠️ 本地存储已用 <b>'+Math.round(ratio*100)+'%</b>，接近上限。<br>请点「导出备份」保存进度，否则新纪录可能写不进去。', true);
  }else if(ratio < STORAGE_WARN_THRESHOLD*0.7){ storageWarnShown = false; }
}
function checkMemory(){
  if(!window.performance || !window.performance.memory) return; // 非 Chrome 无此 API
  var m = window.performance.memory, ratio = m.usedJSHeapSize/m.jsHeapSizeLimit;
  if(ratio >= MEM_WARN_THRESHOLD && !memWarnShown){
    memWarnShown = true;
    showMemWarn('🧠 内存占用已达 <b>'+Math.round(ratio*100)+'%</b>，建议刷新页面释放内存。<br><small>记得先导出备份！</small>', false);
  }else if(ratio < MEM_WARN_THRESHOLD*0.7){ memWarnShown = false; }
}
function checkLongSession(){
  if(Date.now()-SESSION_START > LONG_SESSION_MS && !longSessionWarnShown){
    longSessionWarnShown = true;
    showMemWarn('⏰ 已连续使用 <b>30 分钟</b>，建议刷新页面释放内存。<br><small>记得先导出备份！</small>', false);
  }
}
function showMemWarn(msg){
  var el = document.createElement('div');
  el.className = 'memwarn show';
  el.innerHTML = msg + ' <button class="pipbtn" style="margin-top:8px" onclick="exportBackup();this.parentElement.remove()">⬇️ 导出备份</button> <button class="pipbtn" style="margin-top:8px" onclick="this.parentElement.remove()">稍后</button>';
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentElement) el.classList.remove('show'); setTimeout(function(){ if(el.parentElement) el.remove(); },300); },10000);
}
function checkMemoryAndStorage(){ checkStorage(); checkMemory(); checkLongSession(); }
/* 递归截断：序列化超过上限时，把超长字串压到 1/4（保留可读摘要） */
function truncateDeep(o){
  if(typeof o === 'string') return o.length > 8000 ? o.slice(0,8000)+'…[已截断]' : o;
  if(Array.isArray(o)) return o.map(truncateDeep);
  if(o && typeof o === 'object'){
    var out = {};
    Object.keys(o).forEach(function(k){ out[k] = truncateDeep(o[k]); });
    return out;
  }
  return o;
}
/* 限制错题单条最大长度：题目对象序列化过长时截断长字段 */
function truncateWrongItem(q){
  if(!q) return q;
  if(JSON.stringify(q).length <= MAX_WRONG_ITEM_LENGTH) return q;
  var copy = Object.assign({}, q);
  ['q','explanation','body'].forEach(function(k){
    if(copy[k] && typeof copy[k]==='string' && copy[k].length > 20000) copy[k] = copy[k].slice(0,20000)+'…[已截断]';
  });
  return copy;
}

const STORE = {
  get(sid){try{return JSON.parse(localStorage.getItem(storeKey(sid))||'{}');}catch(e){return {};}},
  set(o,sid){
    try{
      // 寫入前做容量保護：序列化後若過大，先截斷超長字串欄位，
      // 避免單條資料膨脹把 localStorage 撐爆（QuotaExceededError）
      let str=JSON.stringify(o);
      if(str.length>MAX_STORE_ITEM){
        o=truncateDeep(o);
        str=JSON.stringify(o);
      }
      localStorage.setItem(storeKey(sid),str);
    }catch(e){
      // 配額滿：提示導出備份，不要靜默吞掉
      if(e&&(e.name==='QuotaExceededError'||e.code===22)){
        storageWarnShown=false;
        showMemWarn('⚠️ 本地存储空间不足，新紀錄写不进去了。<br>请立即「导出备份」，再删除部分本机纪录。',true);
      }
    }
    checkStorage();
  }
};
/* 學習紀錄版本。
   v1 的 bug：只要打開課題頁，那一課整頁的知識點都會被標記成「已看過」，
   於是沒做過測驗的知識點全部湧進「今日待複習」——光是翻一課就會多出幾十個。
   v2 起「已看過」只在使用者真的點開某個知識點時才記錄，並做一次性清理：
   沒有實際學習紀錄（做過測驗或有複習排程）的 seen 一律清掉，因為它們
   極可能只是「整頁被渲染過」而不是真的看過。 */
const STORE_VER = 2;
function migrateStore(sid){
  const s = STORE.get(sid);
  if((s.ver || 1) >= STORE_VER) return;
  const keep = {};
  Object.keys(s.seen || {}).forEach(pid=>{
    const a = (s.attempts || {})[pid];
    if((a && a.n) || (s.review || {})[pid]) keep[pid] = s.seen[pid];
  });
  s.seen = keep;
  s.ver = STORE_VER;
  STORE.set(s, sid);
}
function wrongSet(){const s=STORE.get();return new Set(s.wrong||[]);}
/* 錯題本三層狀態：
   wrong      答錯過的題（不再因答對而自動刪除）
   rightLater 答錯之後又答對的題（可以標記「已整理」歸檔）
   fixed      已整理（從清單收起，仍保留筆記）
   wnotes     使用者自己寫的錯題筆記 {qid: text} */
function rightLaterSet(){const s=STORE.get();return new Set(s.rightLater||[]);}
function fixedSet(){const s=STORE.get();return new Set(s.fixed||[]);}
function wrongNotes(){const s=STORE.get();return s.wnotes||{};}
function markWrong(qid){
  const s=STORE.get();s.wrong=s.wrong||[];
  if(!s.wrong.includes(qid))s.wrong.push(qid);
  s.rightLater=(s.rightLater||[]).filter(x=>x!==qid);
  s.fixed=(s.fixed||[]).filter(x=>x!==qid);
  STORE.set(s);
}
function markRight(qid){
  const s=STORE.get();
  if((s.wrong||[]).includes(qid)){
    s.rightLater=s.rightLater||[];
    if(!s.rightLater.includes(qid))s.rightLater.push(qid);
  }
  STORE.set(s);
}
function setWrongNote(qid, txt){
  const s=STORE.get();s.wnotes=s.wnotes||{};
  if(txt && txt.trim()) s.wnotes[qid]=txt; else delete s.wnotes[qid];
  STORE.set(s);
}
function toggleFixed(qid){
  const s=STORE.get();s.fixed=s.fixed||[];
  const i=s.fixed.indexOf(qid);
  if(i>=0) s.fixed.splice(i,1); else s.fixed.push(qid);
  STORE.set(s);
  viewWrong();
}
function allQuestions(){
  const out=[];
  Object.keys(QUIZ).forEach(tid=>(QUIZ[tid]||[]).forEach(q=>out.push(Object.assign({topic:tid},q))));
  return out;
}
function qIndex(){const m={};allQuestions().forEach(q=>m[q.id]=q);return m;}
function pointStats(pid){ // returns [right,total] attempts
  const s=STORE.get();const a=(s.attempts||{})[pid];return a?[a.r,a.n]:[0,0];
}
function bumpAttempt(pid,ok){
  const s=STORE.get();s.attempts=s.attempts||{};
  const a=s.attempts[pid]||{r:0,n:0};a.n++;if(ok)a.r++;s.attempts[pid]=a;STORE.set(s);

/* ---------------- 學習進度 · 間隔複習 ---------------- */
const DAYMS=86400000, MAXBOX=5, INTERVALS=[0,1,3,7,16,35];
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchDay(){const s=STORE.get();s.days=s.days||{};s.days[dkey()]=1;STORE.set(s);}
function streak(){
  const ds=STORE.get().days||{};let n=0,d=new Date();
  if(!ds[dkey(d)])d=new Date(Date.now()-DAYMS);
  while(ds[dkey(d)]){n++;d=new Date(d.getTime()-DAYMS);}
  return n;
}
function dayCount(){return Object.keys(STORE.get().days||{}).length;}
/* 「已看過」的寫入改成批次的：
   一個知識點真的被讀到（見 observePointReads）才進來，並集中一次落盤，
   避免一頁滾下來寫幾十次 localStorage。 */
let seenQ=[], seenT=null;
function queueSeen(pid){ if(seenQ.indexOf(pid)<0)seenQ.push(pid); }
function flushSeen(){
  if(seenT){clearTimeout(seenT);seenT=null;}
  if(!seenQ.length)return;
  const ids=seenQ.slice(); seenQ.length=0;
  touchDay();
  const s=STORE.get(); s.seen=s.seen||{};
  const now=Date.now(); let ch=false;
  ids.forEach(pid=>{ if(!s.seen[pid]){ s.seen[pid]=now; ch=true; } });
  if(ch)STORE.set(s);
}
function markSeenSoon(pid){ queueSeen(pid); if(!seenT)seenT=setTimeout(flushSeen,800); }
function markSeen(pid){ queueSeen(pid); flushSeen(); }

/* 知識點要停留在畫面上一下下才算「讀過」；只是被渲染出來不算。
   舊版是在 ptCard() 裡直接 markSeen()，等於打開一課就把整課幾十個知識點
   全標成已看過——複習數字就是這樣爆掉的。 */
const READ_DWELL_MS=1200;
let readObs=null, readTimers={};
function observePointReads(){
  const cards=document.querySelectorAll('#app .pcard');
  if(readObs){readObs.disconnect();readObs=null;}
  Object.keys(readTimers).forEach(k=>{clearTimeout(readTimers[k]);});
  readTimers={};
  if(!cards.length)return;
  // 沒有 IntersectionObserver 的舊瀏覽器：寧可少記，也不要再記錯
  if(typeof IntersectionObserver==='undefined')return;
  const obs=new IntersectionObserver(entries=>{
    // 換頁後舊觀察器可能還會回呼一次，這裡擋掉
    if(obs!==readObs)return;
    entries.forEach(en=>{
      const el=en.target, pid=el.getAttribute('data-pid');
      if(!pid)return;
      if(en.isIntersecting){
        if(readTimers[pid]||obs.seen[pid])return;
        readTimers[pid]=setTimeout(()=>{
          delete readTimers[pid];
          if(obs!==readObs)return;
          obs.seen[pid]=1;
          markSeenSoon(pid);
        },READ_DWELL_MS);
      }else if(readTimers[pid]){
        clearTimeout(readTimers[pid]); delete readTimers[pid];
      }
    });
  },{threshold:0.55});
  obs.seen={};
  readObs=obs;
  cards.forEach(c=>obs.observe(c));
}
function scheduleReview(pid,ok){
  const s=STORE.get();s.review=s.review||{};
  const cur=s.review[pid]||{box:0};
  const box=ok?Math.min(MAXBOX,(cur.box||0)+1):0;
  const r={box:box,due:Date.now()+INTERVALS[box]*DAYMS,last:Date.now()};
  s.review[pid]=r;STORE.set(s);
  return r;
}
function pointMastery(pid){
  const a=(STORE.get().attempts||{})[pid];
  if(!a||!a.n)return 0;
  return Math.max(0,Math.min(1,(a.r/a.n)*Math.min(1,a.n/2)));
}
function pointsOf(t){return (t.sections||[]).reduce((x,s)=>x.concat(s.points||[]),[]);}
function allPoints(){return TOPICS.reduce((x,t)=>x.concat(pointsOf(t)),[]);}
function topicMastery(t){const ps=pointsOf(t);if(!ps.length)return 0;return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;}
function overallMastery(){const ps=allPoints();if(!ps.length)return 0;return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;}
function masteredCount(){return allPoints().filter(p=>pointMastery(p.id)>=0.85).length;}
/* ---------- 子分區（單元）----------
   一個科目底下可再分「熱學／力學／波動學」等單元，避免課題一多就平鋪成長串。
   單元只做分組：課題 id、知識點 id 完全不動，既有學習進度不受影響。
   沒宣告 units 的科目（如化學）維持原本平鋪顯示。 */
function hasUnits(){return UNITS.length>0;}
function topicsOfUnit(u){return (u.topics||[]).map(id=>TMAP[id]).filter(Boolean);}
function unitOfTopic(tid){return UNITS.find(u=>(u.topics||[]).indexOf(tid)>=0)||null;}
function unitMastery(u){
  const ps=topicsOfUnit(u).reduce((x,t)=>x.concat(pointsOf(t)),[]);
  if(!ps.length)return 0;
  return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;
}
function unitMasteredCount(u){
  return topicsOfUnit(u).reduce((x,t)=>x.concat(pointsOf(t)),[])
    .filter(p=>pointMastery(p.id)>=0.85).length;
}
function masteryLabel(m){return m>=0.85?'熟練':m>=0.6?'不錯':m>=0.3?'起步':'待開始';}
function masteryColor(m){return m>=0.85?'#15803d':m>=0.6?'#0f766e':m>=0.3?'#b45309':'#b0aa9e';}
function fmtDue(ts){
  const d=ts-Date.now();
  if(d<=60000)return '現在';
  const days=d/DAYMS;
  if(days<1)return '今天稍後';
  if(days<1.6)return '明天';
  if(days<30)return Math.round(days)+' 天後';
  return Math.round(days/30)+' 個月後';
}
/* 「該複習了」＝真的有事可做的項目：有測驗題、而且到期（或學過還沒測）。
   沒有出題的知識點排不了複習，永遠清不掉，所以不能混進這個數字裡——
   它們是「學過、還沒出題」，另外用 readOnlyList() 列出來，只讓你看筆記。 */
function dueList(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{},now=Date.now(),out=[];
  const qp=quizPoints();
  Object.keys(seen).forEach(pid=>{
    const o=PMAP[pid];if(!o)return;
    if(!qp[pid])return;
    const r=rv[pid];
    if(r){if(r.due<=now)out.push({pid:pid,o:o,due:r.due,box:r.box,over:now-r.due,fresh:false});}
    else if(!(at[pid]&&at[pid].n))out.push({pid:pid,o:o,due:seen[pid],box:0,over:now-seen[pid],fresh:true});
  });
  out.sort((a,b)=>((a.fresh?1:0)-(b.fresh?1:0))||(b.over-a.over));
  return out;
}
/* 學過、但站上還沒有對應題目的知識點：只能看筆記，不該假裝是待複習任務。 */
function readOnlyList(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{};
  const qp=quizPoints();
  return Object.keys(seen).filter(pid=>PMAP[pid]&&!qp[pid]&&!(at[pid]&&at[pid].n));
}
function newPointCount(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{},qp=quizPoints();
  return Object.keys(seen).filter(pid=>PMAP[pid]&&qp[pid]&&!rv[pid]&&!(at[pid]&&at[pid].n)).length;

function quizPoints(){const m={};allQuestions().forEach(q=>{if(q.point)m[q.point]=1;});return m;}

/* ---------------- 科目切換 ---------------- */

function switchSubject(sid){
  if(!useSubject(sid))return;
  renderSubbar();
  const h=location.hash||'#/home';
  /* 修 bug：hash 裡帶了舊科目的 id（例如 #/phys/quiz）時，若只改 SUB 而不同步 hash，
     route() 會依 hash 再把科目切回去，造成「點科目沒反應」。
     所以這裡要把 hash 的科目段換成新科目：
       #/phys/quiz  → #/chem/quiz
       #/phys/home  → #/chem/home
     課題頁／單元頁／答題中的頁面在新科目不一定存在，直接回首頁最安全。 */
  const m=h.match(/^#\/([^\/]+)(\/.*)?$/);
  const looksSubject = m && SUBJECTS.some(s=>s.id===m[1]);
  if(looksSubject){
    const rest=m[2]||'/home';
    // 新科目沒有同一個課題／單元，回首頁；其餘（測驗、複習、圖譜…）沿用同頁面。
    // hash 一律帶上科目 id，讓網址與目前科目完全一致（重新整理也不會跑掉）。
    if(rest.startsWith('/t/')||rest.indexOf('/unit/')===0||rest==='/run'){ go('#/'+sid+'/home'); return; }
    go('#/'+sid+rest);
    return;
  }
  // hash 沒帶科目（#/home、#/settings 等）：以新科目的首頁為準，確保狀態與網址同步
  if(h.startsWith('#/settings')){ route(); return; }
  go('#/'+sid+'/home');
}
function viewSubjects(){

/* ===== 修改位置：跟隨系統主題 =====
   清掉 localStorage 的手動選擇，改依系統偏好即時決定。 */
function followSystemTheme(){
  try{ localStorage.removeItem('f6note.theme'); }catch(e){}
  var m='dark';
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) m='light';
  }catch(e){}
  document.documentElement.setAttribute('data-theme', m);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
  var sw=document.getElementById('themetoggle');
  if(sw) sw.setAttribute('aria-checked', m==='dark' ? 'true' : 'false');
}
/* 若使用者尚未手動選擇，系統切換時即時跟隨 */
(function(){
  try{
    if(!window.matchMedia) return;
    var mql=window.matchMedia('(prefers-color-scheme: dark)');
    var handler=function(){
      var saved='';
      try{ saved=localStorage.getItem('f6note.theme')||''; }catch(e){}
      if(saved==='light'||saved==='dark') return;   // 使用者手動選過，不跟隨
      var m=mql.matches?'dark':'light';
      document.documentElement.setAttribute('data-theme', m);
      var mt=document.querySelector('meta[name="theme-color"]');
      if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
      var sw=document.getElementById('themetoggle');
      if(sw) sw.setAttribute('aria-checked', m==='dark' ? 'true' : 'false');
    };
    if(mql.addEventListener) mql.addEventListener('change', handler);
    else if(mql.addListener) mql.addListener(handler);
  }catch(e){}
})();

/* ---- 動畫設定 UI 同步與互動 ---- */
function syncAnimUI(){
  const mode=animMode();
  document.querySelectorAll('#animseg button').forEach(b=>{
    b.classList.toggle('on', b.dataset.m===mode);
  });
  const r=document.getElementById('animk');
  if(r) r.value=String(animK());
  const kv=document.getElementById('animkv');
  if(kv) kv.textContent=animK().toFixed(1)+'×';
  const note=document.getElementById('animnote');
  if(note){

    if(ANIM_BROKEN){
      t='⚠️ 偵測到這個瀏覽器的動畫表現不穩定（舊版 iOS Safari），已自動降級為「完全關閉」以避免元素閃現。'
        +'你仍可在上面手動選擇其他模式。';
    }else if(prefersReducedMotion()){
      t='ℹ️ 你的系統設定了「減少動態效果」，平滑捲動與裝飾動畫會自動省略（這是系統偏好，網站會尊重它）。';

/* 課題標籤代碼 → 顯示文字。
   資料裡 topic.tags 目前只有 'E1'（生物選修一：體內平衡相關章節）。

var TAG_LABELS = {"E1":"選修一","E2":"選修二","E3":"選修三","E4":"選修四"};
function tsub(g){
  if(g===undefined || g===null) return "";
  var k=String(g);
  return TAG_LABELS[k] || k;
}

   - 离开视口的卡片销毁，用占位 div（spacer）保持滚动高度
   - 卡片高度不一（含笔记原图），因此逐张实测高度并修正占位，
     不用固定行高估算，避免卡片互相重叠
   - 滚动时 rAF 节流重算可见范围
   阈值：50 个知识点（可依设备性能调整） */
const VIRT_THRESHOLD = 50;
const VIRT_BUFFER = 6;         // 上下各额外渲染几张卡片
const VIRT_EST = 320;          // 未测量卡片的初始预估高度

let VIRT = {items:[], heights:[], est:VIRT_EST, listEl:null, contentEl:null, renderT:null};
function virtReset(){
  VIRT.items = [];
  VIRT.heights = [];
  VIRT.listEl = null;
  VIRT.contentEl = null;
  if(VIRT.renderT){ cancelAnimationFrame(VIRT.renderT); VIRT.renderT = null; }
}
function virtBuildItems(t){
  // 扁平化：把所有章节的知识点按顺序压成一维数组
  const items = [];
  (t.sections||[]).forEach(function(s){
    (s.points||[]).forEach(function(p){
      items.push({p:p, sec:s, t:t});
    });
  });
  return items;
}
/* 前缀和：未测量的用当前平均预估值 */
function virtOffsets(){
  const n=VIRT.items.length, off=new Array(n+1);
  off[0]=0;
  for(let i=0;i<n;i++){
    const h=VIRT.heights[i];
    off[i+1]=off[i]+((h==null||h<=0)?VIRT.est:h);
  }
  return off;
}
function virtRender(){
  const C=VIRT.contentEl, L=VIRT.listEl;
  if(!C||!L||!VIRT.items.length) return;
  const n=VIRT.items.length;
  const off=virtOffsets();
  const st=C.scrollTop, vh=C.clientHeight||window.innerHeight;
  // 可见范围（线性扫描即可，几百个点开销可忽略）
  let first=0;
  while(first<n && off[first+1]<=st) first++;
  first=Math.max(0, first-VIRT_BUFFER);
  let last=first;
  while(last<n-1 && off[last+1]<st+vh) last++;
  last=Math.min(n-1, last+VIRT_BUFFER);
  // 平滑跳轉中：目標索引強制納入渲染範圍（否則到位前目標卡片不存在）
  if(VIRT.pinIdx!=null){
    first=Math.min(first, VIRT.pinIdx);
    last=Math.max(last, VIRT.pinIdx);
  }
  // ---------- 增量更新：不整體替換 DOM，避免圖片加載被中斷閃爍 ----------
  const needed = new Set();
  for(let i=first; i<=last; i++) needed.add(i);
  // 移除不再需要的卡片
  const curItems = L.querySelectorAll('.vitem');
  for(let i=curItems.length-1; i>=0; i--){
    const idx = +curItems[i].dataset.idx;
    if(!needed.has(idx)){
      curItems[i].remove();
    }
  }
  // 已存在的索引
  const existing = new Set();
  L.querySelectorAll('.vitem').forEach(el => existing.add(+el.dataset.idx));
  // 插入需要的新卡片，保持顺序
  for(let i=first; i<=last; i++){
    if(existing.has(i)) continue;
    const card = document.createElement('div');
    card.className = 'vitem';
    card.dataset.idx = i;
    card.innerHTML = ptCard(VIRT.items[i].p, VIRT.items[i].t);
    // 找到插入位置：第一個索引大於 i 的現有元素之前
    let refEl = null;
    const allItems = L.querySelectorAll('.vitem');
    for(let j=0; j<allItems.length; j++){
      if(+allItems[j].dataset.idx > i){
        refEl = allItems[j];
        break;
      }
    }
    if(refEl){
      refEl.parentNode.insertBefore(card, refEl);
    } else {
      L.appendChild(card);
    }
  }
  // ---------- 占位 div ----------
  // 移除舊占位
  L.querySelectorAll('[data-sp]').forEach(sp=>sp.remove());
  let html='';
  if(first>0) html+='<div class="vplaceholder" data-sp="top" style="height:'+Math.round(off[first])+'px"></div>';
  if(last<n-1) html+='<div class="vplaceholder" data-sp="bot" style="height:'+Math.round(off[n]-off[last+1])+'px"></div>';
  if(html){
    const temp = document.createElement('div');
    temp.innerHTML = html;
    // 占位要放在最前和最後
    const topSp = temp.querySelector('[data-sp="top"]');
    const botSp = temp.querySelector('[data-sp="bot"]');
    if(topSp) L.insertBefore(topSp, L.firstChild);
    if(botSp) L.appendChild(botSp);
  }
  // 实测渲染出来的卡片高度并修正（只在有变化时更新占位，避免跳动）
  let changed=false, sum=0, cnt=0;
  L.querySelectorAll('.vitem').forEach(function(el){
    const i=+el.dataset.idx;
    const h=el.offsetHeight;
    if(h>10){
      if(VIRT.heights[i]==null || Math.abs(VIRT.heights[i]-h)>1){ VIRT.heights[i]=h; changed=true; }
      sum+=VIRT.heights[i]; cnt++;
    }
  });
  if(cnt) VIRT.est=Math.max(80, Math.round(sum/cnt));
  if(changed){
    const off2=virtOffsets();
    const topSp=L.querySelector('[data-sp="top"]'), botSp=L.querySelector('[data-sp="bot"]');
    if(topSp) topSp.style.height=Math.round(off2[first])+'px';
    if(botSp) botSp.style.height=Math.round(off2[n]-off2[last+1])+'px';
  }
  observePointReads(); // 新渲染的卡片要重新纳入「停留才算已读」观察
}
function virtOnScroll(){
  if(VIRT.renderT) return;
  VIRT.renderT=requestAnimationFrame(function(){
    VIRT.renderT=null;
    virtRender();
  });
}
/* 跳到指定知识点／章节（虚拟列表里元素不是一直存在，靠计算滚动位置）
   simple/full 用平滑滚动，off 直接到位；高亮回饋一律保留。
   平滑模式下 scrollTop 是漸變的，virtRender 依當前位置算可見範圍會漏掉目標，
   因此先把目標索引記進 VIRT.pinIdx，virtRender 會把它一併渲染出來。 */
function virtJump(idx,center){
  if(idx<0||idx>=VIRT.items.length||!VIRT.contentEl) return false;
  const off=virtOffsets();
  const C=VIRT.contentEl;
  let top = center ? (off[idx] - (C.clientHeight - (VIRT.heights[idx]||VIRT.est))/2) : (off[idx]-56);
  top=Math.max(0, Math.min(top, C.scrollHeight - C.clientHeight));
  const smooth = !animDisabled() && !prefersReducedMotion();
  VIRT.pinIdx = idx;                 // 無論平滑與否，都保證目標被渲染
  if(smooth){
    try{ C.scrollTo({top:top, behavior:'smooth'}); }
    catch(e){ C.scrollTop=top; }
    virtRender();
    // 保險：Safari 忽略 smooth 時強制到位
    const target=top;
    setTimeout(function(){
      if(Math.abs(C.scrollTop-target)>40){ C.scrollTop=target; }
      VIRT.pinIdx=null;
      virtRender();
    }, Math.max(320, Math.round(420*animK())));
  }else{
    C.scrollTop = top;
    VIRT.pinIdx=null;
    virtRender();
  }
  return true;
}
function virtJumpPoint(pid){
  const i=VIRT.items.findIndex(x=>x.p.id===pid);
  if(i<0) return false;
  if(!virtJump(i,true)) return false;
  // 平滑捲動要等卡片渲染出來再高亮
  const delay = (!animDisabled() && !prefersReducedMotion()) ? Math.max(160, Math.round(260*animK())) : 0;
  if(delay){
    setTimeout(function(){ flashAnchor(document.getElementById('pt-'+pid)); }, delay);
  }else{
    flashAnchor(document.getElementById('pt-'+pid));
  }
  return true;
}
function virtJumpSection(sid){
  const i=VIRT.items.findIndex(x=>x.sec.id===sid);
  return i>=0 ? virtJump(i,false) : false;
}
function virtInit(contentEl,listEl,items){
  VIRT.items=items;
  VIRT.heights=new Array(items.length).fill(null);
  VIRT.est=VIRT_EST;
  VIRT.contentEl=contentEl;
  VIRT.listEl=listEl;
  contentEl.addEventListener('scroll',virtOnScroll);
  virtRender();
}

function viewTopic(tid,anchor){

  if(needsContent())return;
  const t=TMAP[tid]; if(!t){go('#/home');return;}

  const totalPts = countPts(t);
  const useVirt = totalPts > VIRT_THRESHOLD;
  let blocks;
  if(useVirt){
    // 虚拟滚动模式
    virtReset();
    const items = virtBuildItems(t);
    blocks = `<div class="vcontent" id="vcontent"><div class="vlist" id="vlist"></div></div>`;
    app.innerHTML=`
    <div class="view">
      <div class="thead">
        <button class="back" onclick="goBack()">← 上一步</button>
        <button class="back" onclick="go('#/home')">← 返回首頁</button>
