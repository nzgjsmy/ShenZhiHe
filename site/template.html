<!-- PWA：讓 iOS／Android 能「加到主畫面」安裝成 App。
     裝成 App 之後，iOS 會給它 durable storage，不再套用「7 天沒開就清空 localStorage」
     的 ITP 規則——這是學習進度不會無聲消失的關鍵。
     路徑一律用相對路徑，因為本站可能部署在 /倉庫名/ 這種子路徑下。 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="化學、物理、生物三科離線筆記：知識圖譜、測驗、複習排程與歷屆試卷考點。">
<!-- iOS 加到主畫面後的外觀 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="/*__SITE_NAME__*/">
<!-- 圖示一律放在網站根目錄，不放子資料夾。
     原因：用 GitHub 網頁上傳時，拖曳「資料夾」很容易只傳到檔案、整個資料夾沒上去，
     而 <link rel="apple-touch-icon"> 一旦指向 404，iOS 不會回退到根目錄圖示，
     會直接用 theme-color 底色 + 標題首字生成一個佔位圖示（看起來完全不是你設計的那個）。
     平鋪在根目錄就沒這個問題：拖檔案不可能漏。 -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<style>
/* ===== 龙藏体（Long Cang）· 只用于大标题 =====
   来源：Google Fonts，OFL 授权（可免费商用）。
   子集化：原版 4.91MB → 315KB（只保留 1266 个标题用字）。
   ⚠️ 实测限制（见 scratch/_proto/font_longcang.html）：
      · 48px 大标题 → 文艺感强，可用
      · 34px 卡片标题 → 勉强，笔画开始变细
      · 15px 正文 → 偏细偏潦草
      · 14px 正文 → 明显发虚
      · 12px 小字 → 糊成一团
      · 数字 → 笔画太细没分量
   → 所以只给 .hero h1 / .thead h2 用，正文与数字保持系统字体。 */
@font-face{
  font-family:"Long Cang";
  src:url("fonts/LongCang-Title.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --bg:#efe9da; --paper:#ffffff; --ink:#2b2a26; --muted:#6e6960;
  --line:#e8e2d6; --accent:#0f766e; --accent-soft:#e6f3f1;
  --amber:#b45309; --amber-soft:#fdf1e3; --red:#b91c1c; --red-soft:#fdecec;
  --green:#15803d; --green-soft:#e9f7ee; --shadow:0 1px 3px rgba(43,42,38,.08),0 6px 20px rgba(43,42,38,.06);
  --radius:14px;
  /* 動畫時長：全部經 --anim-k（係數）換算，設定頁可調 0.5–2.0 */
  --anim-k:1;
  --dur-fast:calc(.12s * var(--anim-k));
  --dur-base:calc(.18s * var(--anim-k));
  --dur-slow:calc(.25s * var(--anim-k));

  /* ===== 修改位置：新增語意色變數（供黑夜模式切換時反向覆蓋）===== */
  --paper-soft:#fdfcf9;        /* 次級面板、輸入框、選項卡 */
  --paper-mute:#f7f3ea;        /* 三級底、hover 區 */
  --paper-alt:#f5f1e8;         /* 表頭 */
  --code-bg:#f1ede4;           /* inline code 底色 */
  --code-bg2:#f1efe8;          /* markdown code 底色 */
  --pre-bg:#f6f4ee;            /* 代碼塊背景 */
  --pre-fg:#3d3a33;            /* 代碼塊文字 */
  --panel:#efe9dd;             /* 進度條槽、nav hover */
  --hover:#f3efe6;             /* 側欄小徽章 hover */
  --hover2:#f3efe7;            /* 按鈕 hover */
  --text-soft:#57534a;         /* 次級正文 */
  --header-bg:rgba(246,242,228,.92);   /* 跟纸张同步；原来是不透明感很强的亮白 */
  --tip-bg:#2a2d36;            /* 提示浮條底（.memwarn / .gtip）*/
  --tip-fg:#e8e5de;            /* 提示浮條文字 */
  --scroll-thumb:#d8d2c5;      /* 虛擬滾動條 thumb */

  /* 主色背景上的文字色：淺色主題配白字，深色主題必須配深字
     （深色主題的 --accent 是亮青色 #2dd4bf，白字對比只有 1.86:1） */
  --on-accent:#ffffff;
  /* 主色的極淡底與邊線：用於標籤、提示框 */
  --accent-tint:#f0fdfa;
  /* 搜尋高亮底：原本硬編碼 #fff3bf（亮黃），深色模式會刺眼且與文字衝突。
     單獨給一個變數，兩邊各自有合適的亮度。 */
  --mark-bg:#fff3bf;
  --accent-line:#99f6e4;
  --green-tint:#ecfdf5;
  /* iOS 經典彈性曲線：起步快、收尾極緩，用於載入屏淡出與卡片進場 */
  --ease-ios:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}

/* ===== 全局過渡緩動：所有互動過渡默認走 iOS 彈性曲線 =====
   需求：--ease-ios = cubic-bezier(.32,.72,0,1)，起步快、收尾極緩。
   為何要 * + !important：大量 transition 用了簡寫
   （如 `transition:opacity var(--dur-base)`），簡寫會把 timing-function
   重置為瀏覽器默認 ease；普通選擇器優先級壓不住，只能 !important。
   html[data-anim="off"] 是靠 transition-duration:0s!important 歸零的，
   與本規則不衝突（時長為 0 時緩動無意義）。
   若某元素確需 linear（如無限循環動畫），在它自己的規則裡再寫
   transition-timing-function:linear!important 覆蓋即可。 */
*,*::before,*::after{transition-timing-function:var(--ease-ios)!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.75;font-size:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--code-bg);padding:1px 6px;border-radius:6px;font-size:.92em}
/* 下標／上標：inline() 會把 c_rms、N_A 這類寫法轉成 <sub>，
   這裡給一致的視覺（略小、貼基線、不影響行高）。
   注意 line-height 用 0 才不會把行距撐開。 */
sub,sup{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}
sub{bottom:-.28em}
sup{top:-.42em}
/* 公式等寬塊裡的下標再小一點，避免與斜線/根號黏在一起 */
.ff sub,.ff sup,.progcode sub,.progcode sup{font-size:.68em}
/* 行內代碼內的下標：不繼承代碼的背景/內距，否則 sub 會變成小方塊 */
code sub,code sup{background:none;padding:0;border:0;font-size:.72em}
button{font-family:inherit}
/* ============ 動畫模式（三檔）+ 降級 ============
   html[data-anim] 由 JS 依設定寫入：
     full   = 全部開啟（預設）
     simple = 簡約：只留必要回饋（按壓、PIP 開關、進度條），移除裝飾性動畫
     off    = 完全關閉：所有 animation/transition 即時完成
   另：偵測到動畫異常（iOS Safari 閃現）時，JS 會強制降到 off。 */
html[data-anim="simple"] .view{animation:none}
html[data-anim="simple"] .tcard:hover,
html[data-anim="simple"] .subcard:hover,
html[data-anim="simple"] .extracard:hover,
html[data-anim="simple"] .sres:hover{transform:none}
html[data-anim="simple"] .ptcell:hover,
html[data-anim="simple"] .ptcell.on{transform:none}
html[data-anim="simple"] .gearbtn:hover{transform:none}
html[data-anim="simple"] .expl.show{animation:none}
html[data-anim="simple"] .lkpair[open] .lklist{animation:none}
html[data-anim="simple"] .memwarn{transition:opacity var(--dur-base)}
html[data-anim="off"] *,
html[data-anim="off"] *::before,
html[data-anim="off"] *::after{
  animation-duration:0s!important;
  animation-delay:0s!important;
  transition-duration:0s!important;
  transition-delay:0s!important;
}
html[data-anim="off"] .view,
html[data-anim="off"] .expl.show,
html[data-anim="off"] .pip.on{animation:none!important}
/* 使用者系統層級的減少動態偏好：尊重它（等同簡約） */
@media (prefers-reduced-motion:reduce){
  .view{animation:none}
  .tcard:hover,.subcard:hover,.extracard:hover,.sres:hover{transform:none}
  .expl.show{animation:none}
  /* 展開／收起直接切換，不要中間態（減少動態偏好） */
  .ppans,.ppans.open{transition:none}
  .lkpair[open] .lklist{animation:none}
}
/* ---------- 通用按壓回饋（滑鼠 + 觸屏；iOS 無 hover 靠 :active） ---------- */
button,.tcard,.subcard,.extracard,.sres,.hchip,.scope,.opt,.ptcell,.ptlegend span,.chip,.subbar button,.rrow .go{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button:active{transform:scale(.97);filter:brightness(.96)}
.tcard:active,.subcard:active,.extracard:active{transform:scale(.985);opacity:.94}
.sres:active{transform:scale(.99);border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.99);border-color:var(--accent);background:var(--accent-soft)}
.hchip:active,.scope:active{transform:scale(.97)}
.ptcell:active{transform:scale(.96)}
.ptlegend span:active{transform:scale(.96);opacity:.85}
.chip:active{transform:scale(.96)}
.rrow .go:active{transform:scale(.96);filter:brightness(.94)}
/* iOS 手感：壓下必須「立即」響應，鬆手才走各元素原本的長曲線（回彈）。
   這裡只覆蓋時長與曲線，不改各元素自己的 transition 簡寫，避免動到 hover 效果。
   沒有自訂 transition 的按鈕由下方 button 規則補上基態曲線。 */
button{transition:transform calc(.3s * var(--anim-k)) var(--ease-ios),
       filter var(--dur-fast),background-color var(--dur-base),
       color var(--dur-base),border-color var(--dur-base)}
button:active:not([disabled]),
.tcard:active,.subcard:active,.extracard:active,.sres:active,.qpick:active,
.opt:active:not([disabled]),.hchip:active,.scope:active,.ptcell:active,
.ptlegend span:active,.chip:active,.subbar button:active,.rrow .go:active{
  transition-duration:calc(.09s * var(--anim-k));
  transition-timing-function:var(--ease-ios);
}
/* 進度條寬度動畫在「完全關閉」時不要殘留 transition */
.qbar i,.pbar i{transition:width calc(.45s * var(--anim-k)) var(--ease-ios)}
/* ---------- header ---------- */
header{position:-webkit-sticky;position:sticky;top:0;z-index:50;background:rgba(250,247,242,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 60px 10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.brand{font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .flask{font-size:22px}
.verbadge{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;letter-spacing:.3px;vertical-align:2px}
footer .fver{color:var(--accent);font-weight:600}
/* 頁尾的版權聲明與可展開的完整免責聲明 */
footer .ftop{line-height:1.8}
footer .fcopy{margin-top:10px;padding:9px 12px;background:var(--amber-soft);border:1px solid #f0d9bd;border-radius:10px;color:#7c4a10;font-weight:600;line-height:1.7;overflow-wrap:break-word}
footer .fnote{margin-top:10px}
footer .fnote>summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0;min-height:32px;display:list-item}
footer .fnote>summary:hover{text-decoration:underline}
footer .fnote ul{margin:8px 0 0;padding-left:20px;line-height:1.85}
footer .fnote li{margin:5px 0;overflow-wrap:break-word}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{border:none;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--muted);transition:var(--dur-base)}
nav button:hover{background:var(--panel);color:var(--ink)}
nav button.on{background:var(--accent);color:#fff}
/* 右上角設定齒輪：絕對定位釘在 header 右上角（不參與 flex 換行，任何寬度都在角落） */
.gearbtn{position:absolute;right:12px;top:8px;border:1px solid var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:var(--dur-base);flex:0 0 auto;padding:0}
.gearbtn:hover{border-color:var(--accent);transform:rotate(35deg)}
.gearbtn.on{background:var(--accent);border-color:var(--accent)}
/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:26px 20px 80px}

/* ============================================================
   手帳紙張（桌面端 >860px） 2026-10-30
   ------------------------------------------------------------
   設計來源：scratch/_proto/handbook_pc.html
   核心意象：整站是「一張攤在深色桌上的方格紙」，四邊貼膠帶，
   導航做成紙緣露出的書籤。手機不套紙（會擠），維持整屏 + 底部 Tab。

   导航复用现有 nav#nav —— 只是换了形态（横条 → 纸边书签）。
   data-r 属性不变，navOn() 高亮逻辑零改动。
   ============================================================ */
@media (min-width:861px){
  :root{--desk:#2e2b26;--grid:rgba(110,140,160,.09)}

  /* ---------- 深色桌面 ---------- */
  body{
    background:
      radial-gradient(ellipse 900px 620px at 50% 0%,rgba(255,240,210,.055),transparent 70%),
      radial-gradient(circle at 18% 82%,rgba(0,0,0,.30),transparent 62%),
      radial-gradient(circle at 84% 18%,rgba(0,0,0,.22),transparent 58%),
      var(--desk);
    padding:30px 46px 70px;
    min-height:100vh;
  }

  /* ---------- 紙張 ---------- */
  .sheet{
    position:relative;max-width:1180px;margin:0 auto;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 24px),
      repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 24px);
    border-radius:3px;
    padding:10px 46px 34px;
    box-shadow:0 20px 54px rgba(0,0,0,.44),0 3px 10px rgba(0,0,0,.30);
  }
  /* 右下角微微卷起 */
  .sheet::after{
    content:"";position:absolute;right:0;bottom:0;width:54px;height:54px;
    background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.07) 50%,
      rgba(255,255,255,.38) 52%,#f0ebdd 72%);
    border-radius:0 0 3px 0;pointer-events:none;z-index:3;
  }

  /* ---------- 膠帶 ---------- */
  .tape{
    position:absolute;z-index:9;pointer-events:none;
    background:rgba(226,206,150,.62);
    box-shadow:0 1px 3px rgba(90,80,50,.22);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5px,#000 calc(100% - 5px),transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 5px,#000 calc(100% - 5px),transparent 100%);
  }
  .tape.t1{width:96px;height:26px;left:-16px;top:30px;transform:rotate(-38deg)}
  .tape.t2{width:86px;height:24px;right:-12px;top:22px;transform:rotate(41deg)}
  .tape.t3{width:112px;height:26px;left:47%;top:-13px;transform:rotate(-1.5deg)}

  /* ---------- header 融入紙面 ---------- */
  /* 必須 static：nav 是 absolute，要靠 .sheet 當包含塊才貼得住紙緣 */
  header{
    position:static;background:transparent;
    -webkit-backdrop-filter:none;backdrop-filter:none;
    border-bottom:none;
  }
  header .hwrap{max-width:none;padding:16px 0 6px;gap:14px}
  .subbar{max-width:none;padding:0 0 12px}

  main{max-width:none;padding:10px 0 44px}
  footer{max-width:none;padding:16px 0 0;border-top:1px solid var(--line)}

  /* ---------- 導航 → 紙緣書籤 ---------- */
  /* ⚠️ absolute 的包含块是 .sheet 的 **padding box**，不是 border box。
     .sheet 有 padding-right:46px，所以 right:-27px 只会让书签停在纸内。
     要让书签「露出纸缘」，得补偿 padding：right = -(46 + 27) = -73px。 */
  nav#nav{
    position:absolute;right:-73px;top:104px;
    flex-direction:column;flex-wrap:nowrap;
    gap:9px;margin:0;padding:0;width:27px;
    background:transparent;border:none;z-index:10;
  }
  nav#nav button{
    width:27px;height:68px;flex:0 0 auto;
    border-radius:0 4px 4px 0;border:none;
    background:#d8cfb9;color:#6b6455;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:11px;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1.35;white-space:nowrap;
    box-shadow:1px 1px 4px rgba(0,0,0,.16);
    transition:background var(--dur-base),color var(--dur-base),width var(--dur-base);
  }
  nav#nav button::before{content:none}   /* 不要先前那套 emoji 图标 */
  nav#nav button:hover{background:#e6dfcb;color:#4a4438}
  nav#nav button.on{
    background:var(--accent);color:#f7f3ea;font-weight:400;width:31px;
  }
  /* 複習的紅點在豎排書籤裡要擠在角上，否則會把字擠歪 */
  nav#nav .navdot{
    position:absolute;top:5px;right:5px;margin:0;
    width:5px;height:5px;
  }
  nav#nav button{position:relative}
}

/* ---------- 手帳頁頭裝飾（桌面紙張內）----------
   仿手寫筆記的開頭：一行小字日期 + 一行手寫體碎念。
   字體沿用專案既有的龍藏體（site/fonts/LongCang-Title.woff2），
   ⚠️ 龍藏體只在 ≥24px 才清晰（實測 14px 以下發虛），所以碎念用 20px。 */
.hn-date{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--hn-muted);margin-bottom:6px;font-weight:600;
}
.hn-date .hn-sub{letter-spacing:.24em;opacity:.85}
.hn-hand{
  display:block;margin-top:10px;
  font-family:"Long Cang","Noto Serif TC",serif;
  font-size:20px;line-height:1.6;
  /* ⚠️ 原本是 rgba(255,255,255,.82) —— 那是給深綠 hero 的白字，
     頁頭改成紙面後就成了「白字寫在米黃紙上」，肉眼幾乎看不見。改走語意變數。 */
  color:var(--hn-hand);
  transform:rotate(-1.2deg);transform-origin:left center;
}
@media (max-width:860px){
  .hn-hand{font-size:18px}
  .hn-date{font-size:11px;letter-spacing:.12em}
}

/* ---------- 深色模式下的纸张 ----------
   ⚠️ 必须单独覆盖：.sheet 用的是 var(--paper)，深色下是 #1c1e25，
   而桌面 --desk 若仍用浅色模式的 #2e2b26，桌面反而比纸亮，对比就反了。
   深色下正确关系是「桌面更暗、纸稍亮」，像夜里开一盏台灯看本子。 */
@media (min-width:861px){
  html[data-theme="dark"]{--desk:#131110;--grid:rgba(150,185,205,.10)}
  html[data-theme="dark"] body{
    background:
      radial-gradient(ellipse 900px 620px at 50% 0%,rgba(255,236,200,.045),transparent 70%),
      radial-gradient(circle at 18% 82%,rgba(0,0,0,.42),transparent 62%),
      radial-gradient(circle at 84% 18%,rgba(0,0,0,.32),transparent 58%),
      var(--desk);
  }
  html[data-theme="dark"] .sheet{
    background-color:#1c1e25;
    box-shadow:0 20px 54px rgba(0,0,0,.62),0 3px 10px rgba(0,0,0,.45);
  }
  /* 深色下胶带要压暗，否则会像贴了两块发光条 */
  html[data-theme="dark"] .tape{
    background:rgba(168,152,110,.34);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  /* 纸签在深色下用深木色，选中的用亮青 */
  html[data-theme="dark"] nav#nav button{
    background:#3a3730;color:#b8b1a2;
    box-shadow:1px 1px 4px rgba(0,0,0,.5);
  }
  html[data-theme="dark"] nav#nav button:hover{background:#46423a;color:#e0d9c8}
  html[data-theme="dark"] nav#nav button.on{
    background:var(--accent);color:var(--on-accent);font-weight:400;
  }
  /* 右下角卷起在深色下会显得发白，压一压 */
  html[data-theme="dark"] .sheet::after{
    background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.35) 50%,
      rgba(255,255,255,.10) 52%,#23262d 72%);
  }
}
.view{animation:fade var(--dur-slow) ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 分頁切換轉場（View Transitions API，2026-10-29）=====
   用瀏覽器原生轉場：舊頁淡出上移 + 新頁淡入升起，手感接近 iOS 的層級切換。
   不用自己保留舊 DOM，瀏覽器會自動快照，所以 route() 完全不用改。
   不支援的瀏覽器（舊 iOS/Firefox）由 JS 判斷後直接跳轉，無動畫也不報錯。
   simple 檔用變數把位移/縮放歸零，只留淡入淡出；off 檔由 JS 直接不走轉場。 */
html{--vt-y:26px;--vt-scale:.955}
html[data-anim="simple"]{--vt-y:0px;--vt-scale:1}
::view-transition-old(root){animation:vt-out calc(.32s * var(--anim-k)) var(--ease-ios) both}
::view-transition-new(root){animation:vt-in calc(.32s * var(--anim-k)) var(--ease-ios) both}
/* group 是瀏覽器內建的容器動畫，默認 250ms；不把它拉齊到 320ms，
   320ms 的進出場會被提前截斷（實測組動畫 0.25s）。 */
::view-transition-group(root){animation-duration:calc(.32s * var(--anim-k));animation-timing-function:var(--ease-ios)}
/* 頂欄與底部 Tab Bar 固定不動（iOS 的做法：導航常駐，只有內容區轉場）。
   給它們獨立的 view-transition-name 就會從 root 快照裡「挖掉」單獨處理，
   否則會跟著內容一起淡入淡出，實測中間幀導航文字會疊成兩層重影。 */
header{view-transition-name:appheader}
nav#nav{view-transition-name:apptabbar}
::view-transition-old(appheader),::view-transition-new(appheader),
::view-transition-old(apptabbar),::view-transition-new(apptabbar){animation:none}
@keyframes vt-out{to{opacity:0;transform:translateY(calc(var(--vt-y) * -1)) scale(var(--vt-scale))}}
@keyframes vt-in{from{opacity:0;transform:translateY(var(--vt-y)) scale(var(--vt-scale))}}
/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#0f766e 0%,#115e59 60%,#134e4a 100%);color:#fff;border-radius:22px;padding:38px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"⚗️";position:absolute;right:26px;bottom:-14px;font-size:120px;opacity:.16;transform:rotate(-12deg)}
.hero h1{margin:0 0 8px;font-size:32px;letter-spacing:.01em;font-weight:400;
  font-family:"Long Cang","Noto Serif TC",serif}
.hero p{margin:0;opacity:.92;max-width:640px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0 26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--accent);line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform var(--dur-base) var(--ease-ios),box-shadow var(--dur-base) var(--ease-ios),border-color var(--dur-base) var(--ease-ios)}
.tcard:hover{transform:translateY(-3px) rotate(var(--tilt,0deg));box-shadow:0 8px 26px rgba(43,42,38,.13)}
/* 手账感：卡片轻微随机倾斜（--tilt 由 tiltCards() 注入，刷新一次重新随机）。
   用 CSS 变量而不是直接写 transform，这样 :hover 的位移不会把倾斜覆盖掉。 */
.tcard{transform:rotate(var(--tilt,0deg))}
.tcard .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.tcard h3{margin:0 0 4px;font-size:19px}
.tcard .meta{font-size:13px;color:var(--muted)}
/* 描述只留兩行：原本固定 min-height:44px 會讓每張卡多佔一行高度，
   但內容其實很少看完（多數是章節名堆疊）。用行數截斷保留資訊又不佔版面。
   顏色用 --text-soft，讓 light/dark 兩個主題共用同一個語意變數。 */
.tcard .desc{font-size:13.5px;color:var(--text-soft);margin:6px 0 10px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.tcard .foot{display:flex;justify-content:flex-start;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.foot .pill{margin-right:0}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:12px;margin-right:6px}
.quick{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 24px}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;cursor:pointer;font-size:15px;box-shadow:var(--shadow);transition:var(--dur-base)}
.quick button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
/* 目前選中的那一個（用於設定頁的「外觀模式」三顆按鈕） */
.quick button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
html[data-theme="dark"] .quick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ---------- topic ---------- */
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.thead h2{margin:0;font-size:30px;font-weight:400;
  font-family:"Long Cang","Noto Serif TC",serif}
.back{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.tmeta{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.tlayout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.rail{position:-webkit-sticky;position:sticky;top:70px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;max-height:78vh;max-height:78dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.rail .rsec{padding:7px 10px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--text-soft)}
.rail .rsec:hover{background:var(--hover)}
.rail .rsec b{display:block;font-size:14.5px;color:var(--ink)}
.rail .rsec span{font-size:12px;color:var(--muted)}
section.sblock{margin-bottom:30px}
section.sblock>h3{font-size:20px;margin:0 0 4px;padding-left:12px;border-left:5px solid var(--accent)}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.pcard h4{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pcard h4 .pg{font-size:12px;font-weight:normal;color:var(--muted);background:var(--hover);border-radius:6px;padding:1px 8px}
.pcard .md{font-size:15.5px}
.pcard .md p{margin:6px 0}
.pcard .md ul,.pcard .md ol{margin:6px 0;padding-left:22px}
.pcard .md li{margin:3px 0}
.pcard .md table{border-collapse:collapse;margin:8px 0;font-size:14.5px;width:100%}
.pcard .md th,.pcard .md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.pcard .md th{background:var(--paper-alt)}
/* ---------- 虚拟滚动：长章节只渲染视口+缓冲区 ----------
   .vcontent 是整课知识点的滚动容器；.vlist 用 translate 偏移，
   只保留可见区+上下缓冲的卡片，离开视口的销毁，内存不再爆炸。 */
.vcontent{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 200px)}
.vcontent::-webkit-scrollbar{width:8px}
.vcontent::-webkit-scrollbar-thumb{background:#d8d2c5;border-radius:8px}
.vlist{position:relative;width:100%}
.vitem{margin:0}
.vplaceholder{background:linear-gradient(90deg,#f3efe6 0%,#f7f3ea 50%,#f3efe6 100%);border-radius:12px}
/* 知识图谱：节点超阈值时的过滤提示 */
.gthreshold{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--amber-soft);border:1px solid #f3ddbe;border-radius:12px;font-size:13.5px;color:#7c4a12;margin-bottom:12px}
.gthreshold button{border:1px solid var(--amber);background:var(--paper);color:var(--amber);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
/* ---------- 内存/存储告警：接近上限时的温和提示 ---------- */
.memwarn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#2b2a26;color:#fff;border-radius:14px;padding:14px 20px;font-size:14px;z-index:300;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;font-family:inherit}
.memwarn.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.memwarn b{color:#fde68a}
/* 筆記原圖（build 以 data URI 注入 body） */
.mdfig{margin:10px 0;text-align:center}
.mdfig img{max-width:100%;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);background:var(--paper);display:block;margin:0 auto;height:auto;width:auto}
.mdfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
/* 代碼塊（``` 區塊）——流程圖／公式推導用，保留換行與空格 */
pre.mdcodewrap{position:relative;margin:10px 0;padding:10px 12px;background:#f6f4ee;border:1px solid var(--line);border-left:3px solid #0f766e;border-radius:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
pre.mdcodewrap code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.65;white-space:pre;color:#3d3a33;background:none;padding:0;border:0;overflow-wrap:normal}
pre.mdcodewrap[data-lang]::before{content:attr(data-lang);position:absolute;top:4px;right:8px;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
/* ---------- 通用的 markdown 樣式 ----------
   以前只有 .pcard .md（知識點卡）與 .pipbody .md（畫中畫）有表格／列表樣式，
   真題頁的題解（.ppexpl .md）沒有 → 268 條含表格的題解渲染成「無框裸表格」，
   深色主題下更是沒有底色。這裡補一套通用規則，三種容器共用；
   下方更具體的規則（如 .pcard .md table）仍可再覆蓋。 */
.md table{border-collapse:collapse;margin:10px 0;font-size:14px;width:100%;background:var(--paper-soft)}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.md th{background:var(--paper-alt);font-weight:700}
.md tr:nth-child(even) td{background:var(--paper)}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:4px 0}
.md p{margin:8px 0}
.md blockquote.mdquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--line);background:var(--paper-soft);border-radius:0 8px 8px 0}
.md blockquote.mdquote table{margin:6px 0;background:var(--paper)}
.md blockquote.mdquote th{background:var(--paper-alt)}
/* 行內代碼 */
.md code,.pipbody code{background:#f1efe8;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.94em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tags{margin-top:8px}
.tag{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:1px 10px;font-size:12px;margin:2px 6px 2px 0}
.xlinks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.xlinks .xl{display:block;padding:4px 0}
.xlinks .xl b{color:var(--amber);font-weight:600}
.jump{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.qbtn{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:3px 13px;font-size:13px;cursor:pointer;margin-left:auto}
.qbtn:hover{background:#0d9488}
/* ---------- 歷屆試卷考點標記 ---------- */
.exambar{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.examtag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;line-height:1.7}
.examtag.lv3{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.examtag.lv2{background:#ffedd5;color:#c2410c;border:1px solid #fdba74}
.examtag.lv1{background:var(--amber-soft);color:var(--amber);border:1px solid #fcd34d}
.examyrs{font-size:12px;color:var(--muted)}
.examdetail{margin-top:7px;border-left:3px solid #fca5a5;background:var(--amber-soft);border-radius:0 8px 8px 0;padding:7px 11px;font-size:13.5px;line-height:1.65}
.examdetail b{color:#b91c1c}
.examdetail .kh{display:block;margin-top:3px}
.kw{display:inline-block;background:#fef08a;color:#854d0e;border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;font-size:13px;font-weight:600;border:1px solid #fde047}
.kwlist{margin-top:5px}
.kwlist .kwtip{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
/* 正文得分字眼高亮（由 template 依 exam.keywords 比對點亮） */
.md mark.kwmark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px;font-weight:600;box-shadow:0 1px 0 #f59e0b}
/* 密度調高後按熱度分三檔配色：越熱越醒眼，一眼看出證據強弱 */
.pcard[data-exam="3"] .md mark.kwmark{background:#fca5a5;box-shadow:0 1px 0 #dc2626}
.pcard[data-exam="2"] .md mark.kwmark{background:#fdba74;box-shadow:0 1px 0 #ea580c}
.pcard[data-exam="1"] .md mark.kwmark{background:#fde68a;box-shadow:0 1px 0 #f59e0b}
.pcard[data-exam] mark.kwmark:hover{background:#fde047;cursor:help}
/* ---------- graph ---------- */
.gwrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
#graphsvg{display:block;width:100%;height:600px;cursor:grab}
.gtip{position:absolute;pointer-events:none;background:#2b2a26;color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;max-width:320px;display:none;z-index:5;line-height:1.55}
.glegend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.glegend span{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-soft)}
.glegend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ---------- 關聯地圖（2026-10-28 重做）---------- */
.lkcdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.chip b{font-weight:400;opacity:.6;margin-left:5px}
.lk-h{margin:22px 0 6px;font-size:17px}
.lk-h span{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.lkrank{margin:0}
.lkpair{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:10px;overflow:hidden}
.lkpair>summary{cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font-size:15px;list-style:none;flex-wrap:wrap}
.lkpair>summary::-webkit-details-marker{display:none}
.lkpair>summary::before{content:'\25B8';color:var(--muted);font-size:12px;transition:transform var(--dur-base) var(--ease-ios)}
.lkpair[open]>summary::before{transform:rotate(90deg)}
/* <details> 的原生展開是「瞬間」的，無法用 CSS 過渡高度；
   這裡至少讓內容淡入＋微微下滑，避免硬跳。收起仍是瞬間（原生限制）。 */
.lkpair[open] .lklist{animation:lkIn calc(.3s * var(--anim-k)) var(--ease-ios)}
@keyframes lkIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.lkdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.lkn{margin-left:auto;font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.lklist{margin:0;padding:2px 16px 12px 34px;font-size:13.5px;line-height:1.95;color:var(--text-soft)}
.lklist li{margin:0}
.lk-go{border:none;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.lk-go:hover{color:var(--ink)}
.lk-arrow{color:var(--muted);margin:0 5px}
.lk-why{color:var(--muted);font-size:12.5px;margin-left:6px}
.lkstar{background:var(--paper-soft);border:1px solid var(--line);border-radius:var(--radius);padding:4px;margin:14px 0 12px}
.lkstar svg{display:block;width:100%;height:auto}
.lkstar text{fill:var(--ink);font-size:12px;font-family:inherit}
.lkstar text.sub{fill:var(--muted);font-size:11px}
.lkstar text.lkctr{fill:var(--ink);font-size:14px;font-weight:700}
.lkstar line{stroke:var(--accent);opacity:.32}
.lkstar circle.lkpeer{cursor:pointer;transition:opacity var(--dur-base)}
.lkstar circle.lkpeer:hover{opacity:.75}
@media (max-width:640px){
  .lkstar text{font-size:10.5px}
  .lkstar text.sub{font-size:9.5px}
  .lkstar text.lkctr{font-size:12px}
  .lklist{padding-left:22px}
}
/* ---------- quiz ---------- */
.qpanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:780px;margin:0 auto}
.qpanel h2{margin-top:0}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper-soft);border-radius:11px;padding:11px 15px;margin:9px 0;cursor:pointer;font-size:15.5px;transition:var(--dur-fast)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default;opacity:.95}
.qnum{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.qtext{font-size:18px;font-weight:700;margin:2px 0 14px}
.qtype{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--amber-soft);color:var(--amber);margin-right:8px;vertical-align:2px}
.expl{border-radius:11px;padding:12px 15px;margin-top:12px;font-size:14.5px;display:none}
.expl.show{display:block;animation:fade calc(.32s * var(--anim-k)) var(--ease-ios)}
.expl.good{background:var(--green-soft);border:1px solid #bbe5c8}
.expl.bad{background:var(--red-soft);border:1px solid #f3c2c2}
.fillrow{display:flex;gap:10px;margin:10px 0}
.fillrow input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;font-size:16px;font-family:inherit;background:var(--paper-soft);-webkit-appearance:none;appearance:none}
.fillrow input:focus{outline:none;border-color:var(--accent)}
.fillrow button{border:none;background:var(--accent);color:#fff;border-radius:11px;padding:0 22px;font-size:15px;cursor:pointer}
.qbar{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#0f766e,#14b8a6);transition:.3s}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}

   這裡把基礎樣式提到全域，.rrow .go 只保留局部差異。 */
.go{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:700;line-height:1.2;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:42px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(43,42,38,.16);transition:filter .14s,transform .14s}
.go:hover{filter:brightness(1.08)}

/* ---------- 畫中畫：測驗中看知識點，不離開測驗 ----------
   Safari 修復要點：
   1. 不要用 display:none ↔ display:flex 切換（Safari 對 display 過渡支援差，
      會先閃出最終態再跳動）→ 改用 visibility + opacity + transform 過渡，
      元素常駐 DOM、pointer-events 控制互動。
   2. 拖拽時關掉 transition，否則每幀都在補間 = 抖動；放開再恢復。
   3. 關閉時走同一組過渡，穩定淡出後才 visibility:hidden。 */
.pip{
  position:fixed;right:18px;bottom:18px;z-index:200;
  width:min(430px,calc(100vw - 24px));max-height:min(66vh,620px);
  display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 40px rgba(43,42,38,.28);overflow:hidden;
  /* 常駐但不可見；開啟時才顯示 */
  visibility:hidden;opacity:0;pointer-events:none;
  transform:translateY(10px) scale(.985);
  transition:opacity calc(.24s * var(--anim-k)) var(--ease-ios),
             transform calc(.24s * var(--anim-k)) var(--ease-ios),
             visibility 0s linear calc(.2s * var(--anim-k));
  will-change:opacity,transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.pip.on{
  visibility:visible;opacity:1;pointer-events:auto;transform:none;
  transition:opacity calc(.24s * var(--anim-k)) var(--ease-ios),
             transform calc(.24s * var(--anim-k)) var(--ease-ios),
             visibility 0s linear 0s;
}
/* 拖拽中：關掉所有過渡（含位置），避免抖動；拖完放開才恢復 */
.pip.dragging{
  transition:none!important;
  box-shadow:0 20px 56px rgba(43,42,38,.36);
}
/* 完全關閉動畫：直接顯示/隱藏，不做過渡（避免 Safari 閃現錯亂） */
html[data-anim="off"] .pip,
html[data-anim="off"] .pip.on{transition:none!important;transform:none}

  nav button{padding:10px 15px;font-size:16px}

  .opt{padding:13px 16px;font-size:16.5px}

  /* ===== 移動端頂欄收斂（2026-10-29）=====
     實測 390×844：原本頂欄佔約 400px（5 行），內容要滑半屏才看到。
     改為「品牌+搜尋一行 → 科目橫向捲動一行 → 主導航移到底部 Tab Bar」，
     頂欄降到約 100px，省出約 290px。桌面端不受影響（全在 860px 內）。 */
  .hwrap{flex-wrap:nowrap;padding:8px 54px 8px 14px;gap:8px}
  .brand{flex:0 0 auto;font-size:16px;gap:6px}
  .brand .verbadge{display:none}          /* 窄屏隱藏版本號，把寬度讓給搜尋框 */
  .sbox{flex:1 1 auto;min-width:0;max-width:none;padding:5px 12px}
  .sbox input{font-size:15px;min-width:0}

  /* 科目膠囊：單行橫向捲動，不再換行成 2 行 */
  .subbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
          padding:0 14px 8px;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .subbar>*{flex:0 0 auto}

  /* 主導航 → 底部 Tab Bar（拇指可達，符合 iOS 習慣）
     ⚠️ header 原本有 backdrop-filter:blur(8px)，它會建立包含塊，
        讓後代的 position:fixed 相對 header 而非視口定位
        （實測 nav 卡在 header 底部 y=42 而不是視窗底部）。
        故移動端必須關掉它，同時換成不透明底色避免內容透出。 */
  header{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
  nav#nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:60;
          display:grid;grid-template-columns:repeat(7,1fr);gap:0;
          background:var(--header-bg,var(--paper));
          border-top:1px solid var(--line);
          padding:4px 2px calc(4px + env(safe-area-inset-bottom));
          box-shadow:0 -2px 10px rgba(43,42,38,.06)}
  nav#nav button{padding:7px 1px;font-size:10.5px;min-height:44px;
                 border:none;background:transparent;border-radius:8px;
                 line-height:1.25;white-space:nowrap}
  nav#nav button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}

  /* 內容與頁尾讓出 Tab Bar 的高度 */
  main{padding-bottom:calc(96px + 52px + env(safe-area-inset-bottom))}
  footer{padding-bottom:calc(40px + 52px + env(safe-area-inset-bottom))}

  /* 既有底部浮層往上避讓，否則會被 Tab Bar 蓋住 */
  .pickbar{bottom:calc(64px + env(safe-area-inset-bottom)) !important}
  #pwaupd,#pwahint{bottom:calc(64px + env(safe-area-inset-bottom)) !important}
  .memwarn{bottom:calc(64px + env(safe-area-inset-bottom)) !important}
  .qbtn{padding:9px 16px;font-size:14px;min-height:36px}
  /* 章節側欄是可橫向滑動的卡片，溢出視口屬預期（overflow-x:auto） */
  .rail .rsec{min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .back{padding:9px 16px;font-size:15px}
  .nextbtn{padding:13px 26px;font-size:16px}
  .scope{padding:15px 15px;font-size:16px}
  .chip{padding:9px 16px;font-size:15px}
  .quick button{padding:12px 19px;font-size:16px}
  .randrow select,.randrow input{font-size:16px;min-height:44px}
  .randgo{min-height:44px}
  .rail .rsec{padding:10px 11px;font-size:15px;min-width:170px;flex:0 0 auto}
  /* 入力框字體必須 ≥16px，否則 iOS 聚焦時會自動放大整頁 */
  .fillrow input{font-size:16px;padding:12px 14px}
  /* iOS 不支援 hover，補上 :active 觸覺回饋 */
  .tcard:active,.scope:active,.chip:active,.opt:active{transform:scale(.985);opacity:.92}
  .quick button:active,.back:active,.nextbtn:active,.qbtn:active{opacity:.75}
  /* 避免 iOS 長按選取時彈出放大鏡，影響題目閱讀 */
  .pcard,.qpanel,nav,.gwrap{-webkit-user-select:none;user-select:none}
  .fillrow input{-webkit-user-select:text;user-select:text}
  /* 修正點擊延遲（沒有 300ms 延遲的舊 iOS） */
  button,a,[onclick]{touch-action:manipulation}
  /* iPhone SE 等小螢幕再縮一點間距 */
  @media (max-width:380px){
    .stats{grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
    .grid{grid-template-columns:1fr}
    .hero{padding:26px 20px}
    .hero h1{font-size:23px}
  }
}

/* 每張公式卡用自己的課題色（--tc，由 colorOf(topicId) 注入），

.pplist{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.ppq{
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--paper);
  /* ⚠️ 这两行是「切页卡一下」的解药，别删。
     真题页有 79 道题、7381 个节点、页面高 29803px，而视口只有 900px
     —— 97% 的题目根本看不见，却在建页时全部完成布局与绘制。
     实测切到真题页卡 305ms（设定页只要 7ms），卡完动画才启动，
     观感就是「点了没反应，然后啪一下翻完」。
     加在单题卡上而不是外层分组：分组高度在 334–1533px 之间波动太大，
     按一个固定值占位会让总高度偏差 20% 以上、滚动条明显跳；
     单题卡实测 229–812px、平均 317px，粒度细得多，总高更接近真实。
     auto 关键字会记住该卡渲染过的真实高度，滚过一次就准了。 */
  content-visibility:auto;
  contain-intrinsic-size:auto 317px;
}

/* 答案與題解：用 grid-template-rows 0fr↔1fr 做高度過渡。
   為什麼不用 display:none 或 hidden 屬性——那會讓整頁高度「啪」地突變，視線直接丟失。
   grid 方案純 CSS、不需 JS 量高度、走合成層，能穩在 60fps。
   收起時 visibility:hidden，避免讀屏念出還沒展開的答案。 */
.ppans{display:grid;grid-template-rows:0fr;margin-top:0;padding-top:0;
  border-top:1px dashed transparent;opacity:0;visibility:hidden;
  transition:grid-template-rows calc(.34s * var(--anim-k)) var(--ease-ios),
             margin-top calc(.34s * var(--anim-k)) var(--ease-ios),
             padding-top calc(.34s * var(--anim-k)) var(--ease-ios),
             border-color calc(.34s * var(--anim-k)) var(--ease-ios),
             opacity calc(.26s * var(--anim-k)) var(--ease-ios),
             visibility 0s linear calc(.34s * var(--anim-k))}
.ppans.open{grid-template-rows:1fr;margin-top:10px;padding-top:10px;
  border-top-color:#d1d5db;opacity:1;visibility:visible;
  transition:grid-template-rows calc(.34s * var(--anim-k)) var(--ease-ios),
             margin-top calc(.34s * var(--anim-k)) var(--ease-ios),
             padding-top calc(.34s * var(--anim-k)) var(--ease-ios),
             border-color calc(.34s * var(--anim-k)) var(--ease-ios),
             opacity calc(.26s * var(--anim-k)) var(--ease-ios),
             visibility 0s}

/* =============================================================
   主題切換開關（Light / Dark Toggle）已於 2026-10-28 從 header 移除。
   原因：它是 position:absolute right:58px、寬 52px，而 .hwrap 右側只
   預留 60px 給齒輪按鈕，於是它會壓住 nav 最後一項「額外資訊」。
   現在深淺色只在「設定頁 → 🌗 外觀模式」切換（白天／黑夜／跟隨系統三顆按鈕），
   功能沒有少，只是換了位置。
   若日後想把開關放回 header：先把 .hwrap 的 padding-right 加到 118px 以上，
   再恢復下面這段 CSS 與 header 裡的 button。
   ============================================================= */
.themetoggle{
  position:absolute;right:58px;top:8px;
  width:52px;height:32px;border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel);
  cursor:pointer;padding:0;
  display:flex;align-items:center;
  box-shadow:var(--shadow);
  transition:background calc(.28s * var(--anim-k)) var(--ease-ios),
             border-color calc(.28s * var(--anim-k)) var(--ease-ios);
  flex:0 0 auto;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.themetoggle:hover{border-color:var(--accent)}
.themetoggle .thumb{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:var(--paper);
  box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;
  transition:transform calc(.28s * var(--anim-k)) cubic-bezier(.2,.8,.2,1),
             background calc(.28s * var(--anim-k)) ease;
  overflow:hidden;
}
.themetoggle .thumb .ic-sun{display:inline-block}
.themetoggle .thumb .ic-moon{display:none}
html[data-theme="dark"] .themetoggle{
  background:var(--accent);
  border-color:var(--accent);
}
html[data-theme="dark"] .themetoggle .thumb{
  transform:translate(20px,-50%);
  background:#0d1117;
}
html[data-theme="dark"] .themetoggle .thumb .ic-sun{display:none}
html[data-theme="dark"] .themetoggle .thumb .ic-moon{display:inline-block}
/* 無障礙：鍵盤 focus 時有清楚輪廓 */
.themetoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){
  /* 手機：與 gearbtn（44×44 right:10）左緣對齊留 8px 間隔 → right: 62 */
  .themetoggle{right:64px;top:10px;width:56px;height:36px}
  .themetoggle .thumb{width:30px;height:30px;font-size:15px}
  html[data-theme="dark"] .themetoggle .thumb{transform:translate(20px,-50%)}
}
@media (prefers-reduced-motion:reduce){
  .themetoggle,.themetoggle .thumb{transition:none}
}

/* =============================================================
   ===== 修改位置：黑夜模式（Dark Theme）覆蓋層 =====
   策略：light 模式 100% 保持原樣；dark 模式由這一段全部反轉。
   1) 先覆蓋核心 CSS 變數（body/card/border/文字自動跟隨）
   2) 再覆蓋硬編碼 #fff / #fdfcf9 / #efe9dd 等選擇器
   3) 最後處理元素專屬色（表格頭、代碼塊、圖表文字、警示條）
   ============================================================= */
html[data-theme="dark"]{
  --bg:#12141a;
  --paper:#1c1e25;
  --paper-soft:#22252c;
  --paper-mute:#262933;
  --paper-alt:#2b2e38;
  --code-bg:#2b2e38;
  --code-bg2:#2e313b;
  --pre-bg:#1a1c22;
  --pre-fg:#d6d3cc;
  --panel:#2a2d36;
  --hover:#282b33;
  --hover2:#2b2e38;
  --header-bg:rgba(18,20,26,.92);
  --ink:#e8e5de;
  --text-soft:#b8b3a8;
  /* 原本 #8a857a 在 --paper-alt(#2b2e38) 上对比只有 3.3–4.4，达不到 4.5，故调亮 */
  --muted:#a29c8f;
  --on-accent:#0d1117;
  --accent-tint:#12312d;
  --accent-line:#1f5a52;
  --green-tint:#12291c;
  --line:#31343e;
  --accent:#2dd4bf;
  --accent-soft:#0f3d38;
  --amber:#fbbf24;
  --amber-soft:#3a2e1a;
  --mark-bg:#6b5312;
  --red:#f87171;
  --red-soft:#3a1a1a;
  --green:#4ade80;
  --green-soft:#173d24;
  --tip-bg:#2a2d36;
  --tip-fg:#e8e5de;
  --scroll-thumb:#3a3e49;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] header{background:var(--header-bg)}
html[data-theme="dark"] nav button:hover{background:var(--panel);color:var(--ink)}
html[data-theme="dark"] code{background:var(--code-bg);color:var(--ink)}

html[data-theme="dark"] .qpick-d,
html[data-theme="dark"] .rail .rsec,
html[data-theme="dark"] .subbar button:not(.on),
html[data-theme="dark"] .legallist,
html[data-theme="dark"] .glegend span,
html[data-theme="dark"] .emptybox .how{color:var(--text-soft)}
html[data-theme="dark"] .rail .rsec:hover{background:var(--hover)}

html[data-theme="dark"] .qgall{background:var(--paper-alt);color:var(--muted)}
html[data-theme="dark"] .qgall:hover{background:var(--paper-mute)}
html[data-theme="dark"] .pcard .md th,
html[data-theme="dark"] .pipbody .md th{background:var(--paper-alt)}
html[data-theme="dark"] .vcontent::-webkit-scrollbar-thumb{background:var(--scroll-thumb)}
html[data-theme="dark"] .vplaceholder{background:linear-gradient(90deg,#1c1e25 0%,#22252c 50%,#1c1e25 100%)}

html[data-theme="dark"] .ptsearch input{background:var(--paper-soft);color:var(--ink)}
html[data-theme="dark"] .qbar,
html[data-theme="dark"] .qpick-pbar,

html[data-theme="dark"] .nextbtn{background:var(--accent);color:#0d1117}
html[data-theme="dark"] .nextbtn:hover{background:#5eead4}

html[data-theme="dark"] .pipbody code{background:var(--code-bg2);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .expl.good{border-color:#2a5a3a}

/* =============================================================
   深色模式对比度修正（2026-10-28）
   問題：深色主題的 --accent 是亮青色 #2dd4bf，但凡用 var(--accent) 當背景、
        又寫死 color:#fff 的按鈕，白字對比只有 1.86:1（AA 需要 4.5:1），
        實測「測驗本課題」「開始」「看筆記」「⚙️」「科目膠囊」全都看不清。
   解法：這些元素在深色下改用 --on-accent（=#0d1117）深字。
   ============================================================= */
html[data-theme="dark"] nav button.on,
html[data-theme="dark"] .subbar button.on,
html[data-theme="dark"] .subbar button.on:hover,
html[data-theme="dark"] .subbar button.on .cnt,
html[data-theme="dark"] .qbtn,
html[data-theme="dark"] .qbtn:hover,
html[data-theme="dark"] .go,
html[data-theme="dark"] .chip.on,
html[data-theme="dark"] .fillrow button,
html[data-theme="dark"] .quick button.on,
html[data-theme="dark"] .gearbtn.on,
html[data-theme="dark"] .navdot,
html[data-theme="dark"] .randgo{color:var(--on-accent)}

/* 主色膠囊裡的次要文字（如「653 知識點」）原本 opacity:.75，
   深色下會糊成一片，改成略降不透明度但保留可讀性 */

html[data-theme="dark"] .chip{background:var(--paper-soft);color:var(--ink)}
html[data-theme="dark"] .chip.on{background:var(--accent);color:#0d1117}
html[data-theme="dark"] .qpickwrap{background:var(--paper-soft);border-color:var(--line)}
html[data-theme="dark"] .qgt{color:var(--text-soft)}
html[data-theme="dark"] .qpick-go{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
html[data-theme="dark"] .qpick:hover{border-color:var(--accent)}
html[data-theme="dark"] .legalcopy,
html[data-theme="dark"] .fcopy{background:#3a2e1a;border-color:#7c5a1e;color:#fbbf24}
html[data-theme="dark"] .note{background:var(--amber-soft);border-color:#7c5a1e;color:var(--amber)}
html[data-theme="dark"] .scope.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
html[data-theme="dark"] .randbox{background:var(--accent-soft);border-color:var(--accent)}
html[data-theme="dark"] .randrow select,
html[data-theme="dark"] .randrow input{background:var(--paper-soft);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .databox code,
html[data-theme="dark"] .emptybox code{background:var(--code-bg);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .subcard .soon{background:var(--paper-alt);color:var(--muted)}
html[data-theme="dark"] .tcard .meta{color:var(--muted)}
html[data-theme="dark"] .stat b{color:var(--accent)}
/* 關聯地圖的 SVG 文字色直接用 CSS 變數（.lkstar text），不需 JS 讀色 */

/* ===== 手账风：答题页（2026-10-30）=====
   只覆盖视觉，不动布局与交互逻辑。
   回退：cp scratch/_bak/template-before-handbook-20261030.html site/template.html */
.qpanel{
  background-color:var(--paper-soft);
  background-image:
    repeating-linear-gradient(to right,rgba(110,140,160,.075) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(to bottom,rgba(110,140,160,.075) 0 1px,transparent 1px 22px);
  border:none;border-radius:3px;
  box-shadow:0 1px 2px rgba(70,60,40,.10),0 10px 28px rgba(70,60,40,.09);
  padding:26px 28px;
}
.qtext{font-family:"Noto Serif TC",serif;font-size:19px;line-height:1.85;
  letter-spacing:-.2px;color:var(--ink)}
/* 题型标签 → 手账小纸签 */
.qtype{background:var(--paper);border:1px solid var(--line);border-radius:2px;
  box-shadow:0 1px 2px rgba(70,60,40,.08);color:var(--muted);
  padding:2px 9px;font-size:10.5px;letter-spacing:.06em}
/* 选项 → 手写方框感 */
.opt{
  border:1px solid var(--line);background:var(--paper);border-radius:3px;
  box-shadow:0 1px 2px rgba(70,60,40,.07);
  transition:transform .22s var(--ease-ios),border-color .22s var(--ease-ios),
             background .22s var(--ease-ios),box-shadow .22s var(--ease-ios);
}
.opt:hover{border-color:var(--line);transform:translateX(2px);
  box-shadow:0 2px 5px rgba(70,60,40,.10)}
.opt.right{border-color:#8fb8a8;background:var(--green-tint)}
.opt.wrong{border-color:#e3b5ac;background:var(--red-soft)}
/* 解析 → 红笔批改的边注感 */
.expl{
  background:var(--paper);border-left:3px solid var(--accent);
  border-radius:0 3px 3px 0;box-shadow:0 1px 2px rgba(70,60,40,.06);
}
/* 题目卡：去掉硬阴影，改成纸片感 */
.pcard{
  background:var(--paper);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 1px 2px rgba(70,60,40,.08),0 6px 18px rgba(70,60,40,.06);
}

/* ===== 手账风 · 全站视觉（2026-10-30）=====
   只覆盖视觉变量与少量组件，不改任何结构/交互。
   回退：cp scratch/_bak/template-before-handbook-20261030.html site/template.html */
:root{
  --paper:#f6f2e4;      /* 暖白纸（原 #ffffff） */
  --paper-soft:#f1ebdb;
  --paper-mute:#ebe3d1;
  --paper-alt:#e4dbc6;
  --line:#dbd1bb;       /* 浅米边框（原 #e8e2d6） */
  --radius:3px;         /* 纸片直角感（原 14px） */
  --shadow:0 1px 2px rgba(70,60,40,.07),0 6px 18px rgba(70,60,40,.06);
}
/* 方格纸底 */
body{
  background-color:var(--paper-soft);
  background-image:
    repeating-linear-gradient(to right,rgba(110,140,160,.05) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,rgba(110,140,160,.05) 0 1px,transparent 1px 24px);
}
/* 深色模式：暖深色 + 极淡方格 */
html[data-theme="dark"]{
  --paper:#22201c;
  --paper-soft:#262420;
  --paper-mute:#2a2823;
  --paper-alt:#2e2b26;
  --line:#3a3730;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
}
html[data-theme="dark"] body{
  background-color:#1c1a17;
  background-image:
    repeating-linear-gradient(to right,rgba(255,255,255,.022) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 24px);
}
/* 卡片统一纸片感 */
.tcard,.subcard,.extracard,.sres,.pcard,.gwrap,.qpanel,.stats,.databox,.emptybox{
  border-radius:3px;
}
/* 标签 → 手账小标签（白底细框，保留语义色文字） */
.pill,.badge{
  border-radius:2px;
  border:1px solid var(--line);
  background:var(--paper);
  letter-spacing:.04em;
}
/* 主按钮 → 略方的纸标签感 */
.qbtn,.nextbtn,.back,.randgo,.qpick-go{
  border-radius:3px;
}
/* Hero 渐变 → 哑光深青 */
.hero{
  background:linear-gradient(135deg,#35635b 0%,#2d554e 60%,#274a44 100%);
  border-radius:3px;
}
/* DSE 真题大卡（生物科目页顶部）——把原来混在按钮排里的「DSE 真題」提出来，
   解决「朋友一直没发现有这个部分」的问题 */
.dse-hero{
  display:flex;align-items:center;gap:16px;
  background:#eaf3ef;border:1px solid rgba(61,107,98,.18);
  border-radius:3px;padding:20px 22px;margin:14px 0;cursor:pointer;
  transition:transform .25s var(--ease-ios),box-shadow .25s var(--ease-ios);
}
.dse-hero:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(53,99,91,.14)}
.dse-hero:active{transform:scale(.99)}
.dse-hero .ic{font-size:26px;flex:0 0 auto}
.dse-hero .tx{flex:1;min-width:0}
/* ⚠️ 手写体（Long Cang）的 ascent/descent 比常规字体大，line-height:1.3 会让
   标题溢出并与下方副标题重叠（实测）。这里必须给足 1.55 + 下边距。 */
.dse-hero .tx b{display:block;font-family:"Long Cang","Noto Serif TC",serif;
  font-size:24px;color:#2d554e;letter-spacing:.01em;
  line-height:1.55;margin-bottom:2px}
.dse-hero .tx span{display:block;font-size:12px;color:#3d6b62;opacity:.82;
  letter-spacing:.02em;line-height:1.6}
.dse-hero .go{font-size:12px;color:#3d6b62;font-weight:700;flex:0 0 auto;
  background:none;border:none;padding:0}
html[data-theme="dark"] .dse-hero{background:#25332f;border-color:#33473f}
html[data-theme="dark"] .dse-hero .tx b{color:#a8d5c8}
html[data-theme="dark"] .dse-hero .tx span,
html[data-theme="dark"] .dse-hero .go{color:#8fb8a8}

/* ---- DSE 卷一 / 卷二 並列卡 ----
   用戶要求 MC 與 LQ「分開存放、不然會很亂」，所以首頁就分成兩張卡，
   用色相區分：卷一青綠（現有），卷二暖褐（新增），一眼可辨不是同一套。 */
.dse-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.dse-duo .dse-hero{margin:0}
@media (max-width:760px){.dse-duo{grid-template-columns:1fr}}

.dse-lq{
  background:#f6f0e4;border-color:rgba(140,110,60,.22);
}
.dse-lq:hover{box-shadow:0 4px 14px rgba(120,95,50,.16)}
.dse-lq .tx b{color:#5d4726}
.dse-lq .tx span,.dse-lq .go{color:#7a6240;opacity:.88}
html[data-theme="dark"] .dse-lq{
  background:#332c22;border-color:#4a3f30;
}
html[data-theme="dark"] .dse-lq .tx b{color:#d9c49b}
html[data-theme="dark"] .dse-lq .tx span,
html[data-theme="dark"] .dse-lq .go{color:#b19c78}

/* ---- 卷二 LQ 題卡 ----
   與 mc 的 .ppq 刻意長得不一樣：LQ 是「一道大題 + 多級子題」的結構，
   所以用左側豎線表示層級，而不是 MCQ 那種一排選項按鈕。 */
.lqlist{display:flex;flex-direction:column;gap:14px}
.lq-card{
  background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:16px 18px;box-shadow:var(--shadow);
}
.lq-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lq-qid{
  font-family:var(--font-mono,monospace);font-size:15px;font-weight:700;
  color:var(--on-accent);background:var(--accent);
  padding:2px 9px;border-radius:3px;letter-spacing:.02em;
}
.lq-part{font-size:12px;color:var(--muted)}
.lq-total{
  font-size:12px;color:var(--amber);background:var(--amber-soft);
  border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
  padding:1px 7px;border-radius:999px;
}
.lq-pg{font-size:11px;color:var(--muted);opacity:.8;margin-left:auto}
.lq-flag{
  font-size:11px;padding:1px 6px;border-radius:3px;
  background:var(--paper-alt,var(--paper-soft));color:var(--muted);
  border:1px solid var(--line);
}
.lq-flag-warn{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}

.lq-stem{font-size:14px;line-height:1.75;color:var(--ink);margin-bottom:12px}
.lq-figs{
  font-size:11.5px;color:var(--muted);background:var(--accent-soft);
  border-left:3px solid var(--accent);padding:6px 10px;border-radius:2px;
  margin-bottom:12px;
}
.lq-figs-note{display:block;opacity:.75;margin-top:2px}

.lq-subs{display:flex;flex-direction:column;gap:10px}
.lq-sub{
  display:flex;align-items:flex-start;gap:8px;
  padding-left:10px;border-left:2px solid var(--line);
}
.lq-sub2{padding-left:26px;border-left-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.lq-no{
  font-family:var(--font-mono,monospace);font-size:12px;font-weight:700;
  color:var(--accent);flex:0 0 auto;min-width:34px;padding-top:2px;
}
.lq-q{flex:1;min-width:0;font-size:13.5px;line-height:1.72;color:var(--ink)}
.lq-mk{
  flex:0 0 auto;font-size:11px;color:var(--muted);
  background:var(--paper-soft,var(--paper-alt));border:1px solid var(--line);
  padding:1px 6px;border-radius:999px;white-space:nowrap;margin-top:2px;
}
.lq-inf{
  flex:0 0 auto;font-size:10px;color:var(--amber);background:var(--amber-soft);
  padding:1px 5px;border-radius:3px;margin-top:3px;white-space:nowrap;
}

.lq-tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lq-btn{
  font-size:12.5px;padding:6px 14px;border-radius:3px;cursor:pointer;
  background:var(--paper-soft,var(--paper-alt));color:var(--muted);
  border:1px solid var(--line);transition:var(--dur-fast);
}
.lq-btn:hover{border-color:var(--accent);color:var(--accent)}
.lq-btn.open{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lq-note-btn:hover{border-color:var(--amber);color:var(--amber)}
.lq-prac-btn:hover{border-color:var(--green);color:var(--green)}
.lq-prac-btn.open{background:var(--green);color:#fff;border-color:var(--green)}

.lq-panel{
  max-height:0;overflow:hidden;
  transition:max-height var(--dur-slow) var(--ease-ios,ease);
}
.lq-panel.open{max-height:1200px}
.lq-panel-in{
  margin-top:12px;padding:12px 14px;border-radius:3px;
  background:var(--amber-soft);border-left:3px solid var(--amber);
}
.lq-todo{font-size:12.5px;line-height:1.7;color:var(--amber)}

.lq-notebox{margin-top:10px}
.lq-note{min-height:72px}

/* ---- 練習作答（離線自評）---- */
.lq-prac{margin-top:12px;display:none;border-top:1px solid var(--line);padding-top:6px}
.lq-prac.on{display:block}
.lq-prac-lead{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 8px}
.lq-prac-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.lq-prac-item:last-child{border-bottom:0}
.lq-prac-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:12.5px;color:var(--muted)}
.lq-prac-hd b{color:var(--ink);font-weight:500}
.lq-prac-hd .lq-prac-mk{color:var(--accent)}
.lq-ans{width:100%;min-height:66px;font-size:13px;line-height:1.7}
.lq-prac-btns{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.lq-fb{margin-top:9px;font-size:12.5px;line-height:1.78;border-radius:10px;padding:10px 12px;
  background:var(--paper-soft);border:1px solid var(--line);color:var(--text-soft);display:none}
.lq-fb.on{display:block}
.lq-fb.good{background:var(--green-tint);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.lq-fb.mid{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.lq-fb.low{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 28%,transparent)}
.lq-fb .lq-fb-t{font-weight:500;color:var(--ink)}
.lq-fb .lq-fb-n{margin-top:5px;font-size:12px}
.lq-fb .lq-fb-h{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--amber)}
.lq-prac-none{font-size:12px;color:var(--muted);padding:8px 0}
html[data-theme="dark"] .lq-fb{background:var(--panel)}

html[data-theme="dark"] .lq-card{background:var(--paper);border-color:var(--line)}
html[data-theme="dark"] .lq-btn{background:var(--paper-alt);color:var(--text-soft)}
html[data-theme="dark"] .lq-mk{background:var(--paper-alt);border-color:var(--line);color:var(--text-soft)}

/* ===== 首页仪表盘（2026-10-30）=====
   回答「打开后今天该做什么」，而不是「有哪些科目」。 */
.dash{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.dash-top{display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:16px}
.dash-top .kick{font-size:10px;color:var(--muted);letter-spacing:.16em}
.dash-top .dt{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.dash-main{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:18px}
.dash-num b{display:block;font-size:44px;font-weight:300;color:var(--accent);
  line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.dash-num span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;
  display:block;margin-top:5px}
.dash-cta{flex:0 0 auto;min-width:230px;background:#35635b;color:#f7f3ea;border:none;border-radius:3px;
  padding:15px 26px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.03em;
  transition:transform .12s var(--ease-ios),background .2s var(--ease-ios)}
.dash-cta:hover{background:#2d554e}
.dash-cta:active{transform:scale(.985)}
.dash-metrics{display:flex;border-top:1px dashed var(--line);padding-top:14px}
.dash-metrics div{flex:1;border-left:2px solid var(--accent-soft);padding-left:12px}
.dash-metrics div:first-child{border-left-color:var(--accent)}
.dash-metrics b{display:block;font-size:21px;font-weight:300;color:var(--accent);
  letter-spacing:-.6px;line-height:1.15;font-variant-numeric:tabular-nums}
.dash-metrics span{font-size:9.5px;color:var(--muted);letter-spacing:.05em}
html[data-theme="dark"] .dash-cta{background:#3d6b62}
html[data-theme="dark"] .dash-cta:hover{background:#47796f}

/* ============================================================
   手帳全套（2026-10-30 第二階段）
   ------------------------------------------------------------
   設計來源：scratch/_proto/handbook_pc.html
   把「紙面頁頭 / 便利貼 / 手帳卡 / 圖釘 / 膠帶 / 貼紙」全部落地。
   配色走語意變數，深色模式整套反向覆蓋（見檔尾 dark 段）。
   ============================================================ */
:root{
  --hn-paper:#fbf8ee;          /* 卡片紙（比 paper 更暖更亮） */
  --hn-note-y:#f4ead0;         /* 黃便利貼 */
  --hn-note-p:#e0ece8;         /* 青便利貼（卷一） */
  --hn-edge:#d3c8b0;           /* 虛線、膠帶邊 */
  --hn-tape:rgba(226,206,150,.62);
  --hn-red:#c25b3f;            /* 朱紅數字 */
  --hn-hand:#b08a5a;           /* 手寫字色 */
  --hn-muted:#8a9aa8;
  --hn-accent:#3d6b62;
  --hn-title:#2f2a22;
  --hn-serif:"Noto Serif TC","Songti TC","Long Cang",serif;
  --hn-track:#ddd3bd;
}

/* ---------- ① 頁頭：從深綠大卡改成紙面印刷 ---------- */
.hero.hn-head{
  background:none;border:none;border-radius:0;box-shadow:none;
  padding:0 0 24px;margin:0 0 28px;
  color:var(--ink);
  border-bottom:1px dashed var(--hn-edge);
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:32px;overflow:visible;
}
.hero.hn-head:after{content:none}       /* 撤掉原本右下角那個大水印 emoji */
html[data-theme="dark"] .hero.hn-head{background:none}

.hn-l{position:relative;flex:1;min-width:0}
.hero.hn-head .hn-date{
  font-size:10.5px;color:var(--hn-muted);letter-spacing:.24em;
  text-transform:uppercase;margin-bottom:9px;font-weight:600;
  opacity:1;
}
.hero.hn-head h1{
  margin:0;font-family:var(--hn-serif);
  font-size:46px;font-weight:400;letter-spacing:-1.4px;line-height:1.1;
  color:var(--hn-title);
}
.hero.hn-head .hn-desc{
  margin:10px 0 0;font-size:13.5px;line-height:1.85;
  color:var(--text-soft);max-width:620px;opacity:1;
}
.hero.hn-head .hn-hand{
  display:block;margin-top:11px;font-family:var(--hn-serif);
  font-size:20px;line-height:1.5;color:var(--hn-hand);
  transform:rotate(-.8deg);transform-origin:left center;
}
/* 掌握度進度：紙面上用細槽，不用半透明白 */
.hn-prog{margin-top:20px;max-width:520px}
.hn-prog .pbar{height:7px;border-radius:999px;background:var(--hn-track);overflow:hidden}
.hn-prog .pbar i{display:block;height:100%;border-radius:999px}
.hn-prog .pmeta{
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:11px;color:var(--hn-muted);margin-top:8px;letter-spacing:.04em;
}

/* 右側按鈕：原型是描邊圓角膠囊 */
.hn-r{display:flex;gap:10px;align-items:center;flex:0 0 auto;padding-top:8px}
.hn-btn{
  background:var(--hn-accent);border:1.5px solid var(--hn-accent);
  color:#f7f3ea;border-radius:999px;padding:11px 22px;
  font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.03em;
  font-family:inherit;
  transition:transform var(--dur-base) var(--ease-ios),box-shadow var(--dur-base) var(--ease-ios);
}
.hn-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(61,107,98,.24)}
.hn-btn:active{transform:scale(.985)}
.hn-btn.ghost{background:transparent;border-color:var(--hn-edge);color:var(--text-soft);font-weight:500}
.hn-btn.ghost:hover{border-color:var(--hn-accent);color:var(--hn-accent);box-shadow:none}
/* ⚠️ 只給「實心」按鈕配深字（深色主題的 --hn-accent 是亮青，白字對比不足）。
   不能無差別寫 .hn-btn —— 幽靈按鈕是透明底，染成 #0d1a18 就等於深底黑字，幾乎隱形。 */
html[data-theme="dark"] .hn-btn:not(.ghost){color:#0d1a18}
html[data-theme="dark"] .hn-btn.ghost{color:var(--text-soft);border-color:var(--hn-edge)}
html[data-theme="dark"] .hn-btn.ghost:hover{color:var(--hn-accent);border-color:var(--hn-accent)}

/* ---------- ② 圖釘 / 貼紙 / 膠帶（通用裝飾） ---------- */
.hn-pin{
  position:absolute;width:17px;height:17px;z-index:8;pointer-events:none;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#f07167,#c0392b 62%,#8e2820);
  box-shadow:0 3px 5px rgba(60,20,15,.42),inset -1px -1px 2px rgba(0,0,0,.25);
}
.hn-pin.blue{background:radial-gradient(circle at 32% 28%,#7fb3d5,#2e6da4 62%,#1c4468);
  box-shadow:0 3px 5px rgba(15,35,60,.42),inset -1px -1px 2px rgba(0,0,0,.25)}
.hn-pin.green{background:radial-gradient(circle at 32% 28%,#8fd6a8,#3d9970 62%,#276749);
  box-shadow:0 3px 5px rgba(15,50,30,.36),inset -1px -1px 2px rgba(0,0,0,.22)}

/* ---------- ③ 儀表盤 → 黃色便利貼 ---------- */
.dash{
  background:var(--hn-note-y);border:none;border-radius:3px;
  padding:24px 26px;margin:0 0 30px;
  box-shadow:0 2px 5px rgba(70,60,40,.13),0 10px 26px rgba(70,60,40,.10);
  transform:rotate(var(--tilt,-.9deg));position:relative;
}
.dash::before{
  content:"";position:absolute;left:30px;top:-9px;width:17px;height:17px;
  border-radius:50%;z-index:8;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#f07167,#c0392b 62%,#8e2820);
  box-shadow:0 3px 5px rgba(60,20,15,.42),inset -1px -1px 2px rgba(0,0,0,.25);
}
.dash-top .kick{letter-spacing:.2em;color:var(--hn-muted)}
.dash-num b{color:var(--hn-red);font-family:var(--hn-serif)}
.dash-metrics{border-top:1px dashed var(--hn-edge)}
.dash-metrics div{border-left:2px solid rgba(120,110,90,.22)}
.dash-metrics div:first-child{border-left-color:var(--hn-accent)}
.dash-metrics b{color:var(--hn-accent)}

/* ---------- ④ DSE 兩張卡 → 便利貼 ---------- */
.dse-duo{gap:22px;margin:0 0 30px}
.dse-duo .dse-hero{
  border:none;border-radius:3px;margin:0;position:relative;
  padding:22px 24px;
  box-shadow:0 2px 5px rgba(70,60,40,.13),0 10px 26px rgba(70,60,40,.10);
}
.dse-mc{background:var(--hn-note-p);transform:rotate(var(--tilt,-.7deg))}
.dse-lq{background:var(--hn-note-y);transform:rotate(var(--tilt,.8deg))}
.dse-duo .dse-hero:hover{transform:translateY(-3px) rotate(0deg) !important;
  box-shadow:0 6px 12px rgba(70,60,40,.14),0 20px 42px rgba(70,60,40,.14)}
.dse-duo .dse-hero::before{
  content:"";position:absolute;left:26px;top:-8px;width:16px;height:16px;
  border-radius:50%;z-index:8;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#8fd6a8,#3d9970 62%,#276749);
  box-shadow:0 3px 5px rgba(15,50,30,.36),inset -1px -1px 2px rgba(0,0,0,.22);
}
.dse-lq::before{
  background:radial-gradient(circle at 32% 28%,#7fb3d5,#2e6da4 62%,#1c4468) !important;
  box-shadow:0 3px 5px rgba(15,35,60,.42),inset -1px -1px 2px rgba(0,0,0,.25) !important;
}
html[data-theme="dark"] .dse-mc{background:#1f2b28}
html[data-theme="dark"] .dse-lq{background:#2e2a1f}

/* ---------- ⑤ 課題卡 → 手帳卡（膠帶 + 固定傾斜） ---------- */
.grid{gap:20px}
.tcard{
  background:var(--hn-paper);border:none;border-radius:4px;
  padding:20px 20px 16px;overflow:visible;
  box-shadow:0 2px 4px rgba(70,60,40,.10),0 12px 28px rgba(70,60,40,.08);
  transition:transform .32s var(--ease-ios),box-shadow .32s var(--ease-ios);
}
.tcard:hover{
  transform:translateY(-4px) rotate(0deg);
  box-shadow:0 6px 12px rgba(70,60,40,.13),0 22px 46px rgba(70,60,40,.13);
}
/* 頂部膠帶 */
.tcard::before{
  content:"";position:absolute;left:50%;top:-9px;
  width:58px;height:16px;transform:translateX(-50%) rotate(-2deg);
  background:var(--hn-tape);pointer-events:none;z-index:5;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3px,#000 calc(100% - 3px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 3px,#000 calc(100% - 3px),transparent);
}
.tcard .bar{width:5px;border-radius:4px 0 0 4px}
.tcard h3{font-family:var(--hn-serif);font-size:18.5px;font-weight:500;
  letter-spacing:-.2px;color:var(--hn-title)}
.tcard .foot{border-top:1px dashed var(--hn-edge)}

/* 傾斜走隨機：由 tiltCards() 每次渲染時用 Math.random() 注入 --tilt，
   刷新一次就重新搖一次，像真的手貼上去的。
   用 CSS 變數而不是直接寫 transform，才不會把 :hover 的位移蓋掉。
   範圍 ±2.2°：再大就會妨礙閱讀，再小看不出手貼感。 */

/* ---------- ⑥ 深色模式：整套反向覆蓋 ---------- */
html[data-theme="dark"]{
  --hn-paper:#22252b;
  --hn-note-y:#2e2a1f;
  --hn-note-p:#1f2b28;
  --hn-edge:#3a3d45;
  --hn-tape:rgba(180,160,110,.34);
  --hn-red:#e0896e;
  --hn-hand:#c8a878;
  --hn-muted:#8b95a3;
  --hn-accent:#4d8a7f;
  --hn-title:#e8e5de;
  --hn-track:#343842;
}
html[data-theme="dark"] .tcard,
html[data-theme="dark"] .dash,
html[data-theme="dark"] .dse-duo .dse-hero{
  box-shadow:0 2px 4px rgba(0,0,0,.34),0 12px 28px rgba(0,0,0,.30);
}

/* ---------- ⑦ 響應式 ---------- */
@media (max-width:860px){
  .hero.hn-head{flex-direction:column;gap:14px;padding-bottom:20px}
  .hero.hn-head h1{font-size:30px;letter-spacing:-.8px}
  .hero.hn-head .hn-hand{font-size:18px}
  .hn-r{width:100%;padding-top:0}
  .hn-btn{flex:1;text-align:center;padding:10px 16px}
  .dash{transform:none;padding:20px 20px}
  .dse-mc,.dse-lq{transform:none}
  .dse-duo{gap:12px}
  .tcard:nth-child(n){--tilt:0deg}   /* 手機不傾斜：卡片窄，一傾斜就參差 */
}

/* ---------- ⑧ 底部「手記 + 今日待辦」兩欄（原型 .bottom） ---------- */
.hn-bottom{
  display:grid;grid-template-columns:1.55fr 1fr;gap:34px;
  padding-top:26px;margin:0 0 32px;
  border-top:1px dashed var(--hn-edge);
}
.hn-lbl{
  font-size:9.5px;color:var(--hn-muted);letter-spacing:.2em;
  margin-bottom:12px;font-weight:600;
}
.hn-mtxt{
  font-family:var(--hn-serif);font-size:14.5px;line-height:1.95;
  color:var(--text-soft);
}
.hn-mtxt b{color:var(--hn-title);font-weight:600;background:linear-gradient(transparent 62%,rgba(240,214,120,.55) 62%)}
.hn-mtxt .hl{background:linear-gradient(transparent 62%,rgba(240,214,120,.55) 62%)}
.hn-bottom .hn-hand{margin-top:14px;font-size:17px}
.hn-todo{
  background:var(--hn-paper);border-radius:4px;padding:6px 18px;
  box-shadow:0 2px 4px rgba(70,60,40,.09),0 10px 24px rgba(70,60,40,.07);
}
.hn-tline{
  display:flex;align-items:center;gap:11px;padding:12px 0;
  font-size:12.5px;color:var(--text-soft);
  border-bottom:1px dashed var(--hn-edge);
}
.hn-tline:last-child{border-bottom:none}
.hn-cb{
  width:14px;height:14px;border:1.4px solid var(--hn-edge);border-radius:2px;
  flex:0 0 auto;position:relative;
}
.hn-cb.on{background:var(--hn-accent);border-color:var(--hn-accent)}
.hn-cb.on::after{
  content:"✓";color:#fff;font-size:9.5px;position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.hn-tline .n{
  margin-left:auto;font-size:11.5px;color:var(--hn-muted);
  font-variant-numeric:tabular-nums;
}
html[data-theme="dark"] .hn-todo{
  box-shadow:0 2px 4px rgba(0,0,0,.30),0 10px 24px rgba(0,0,0,.26);
}
@media (max-width:860px){
  .hn-bottom{grid-template-columns:1fr;gap:22px;padding-top:20px}
}
/* 描述只留一行：本科描述往往把 10 個分區全列出來，兩行會把頁頭撐得很重 */
.hero.hn-head .hn-desc{
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:1;line-clamp:1;overflow:hidden;
}

/* ---------- ⑨ 三科選擇頁的科目卡 → 手帳卡 ---------- */
.subgrid{gap:22px}
.subcard{
  background:var(--hn-paper);border:none;border-radius:4px;
  padding:24px 20px 16px;overflow:visible;
  box-shadow:0 2px 4px rgba(70,60,40,.10),0 12px 28px rgba(70,60,40,.08);
  transform:rotate(var(--tilt,0deg));
  transition:transform .32s var(--ease-ios),box-shadow .32s var(--ease-ios);
}
.subcard:hover{
  transform:translateY(-4px) rotate(0deg);
  box-shadow:0 6px 12px rgba(70,60,40,.13),0 22px 46px rgba(70,60,40,.13);
}
.subcard::before{
  content:"";position:absolute;left:50%;top:-9px;
  width:58px;height:16px;transform:translateX(-50%) rotate(-2deg);
  background:var(--hn-tape);pointer-events:none;z-index:5;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3px,#000 calc(100% - 3px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 3px,#000 calc(100% - 3px),transparent);
}
.subcard .stripe{width:5px;border-radius:4px 0 0 4px}
.subcard h3{font-family:var(--hn-serif);font-weight:500;color:var(--hn-title)}
.subcard .sfoot{border-top:1px dashed var(--hn-edge)}
html[data-theme="dark"] .subcard{
  box-shadow:0 2px 4px rgba(0,0,0,.34),0 12px 28px rgba(0,0,0,.30);
}

/* ---------- ⑩ 卡片装饰：图钉 / 贴纸（2026-10-30） ----------
   默认是顶部胶带（.tcard::before / .subcard::before）。
   轮到图钉时把胶带关掉（display:none），改用 ::after 画一颗钉头；
   贴纸是真实元素 .deco-sticker，位置在右下角外侧。
   三者由 tiltCards() 按卡片索引轮换分配，每张卡长得都不一样。 */
.tcard[data-deco="pin"]::before,
.subcard[data-deco="pin"]::before{display:none}

.tcard[data-deco="pin"]::after,
.subcard[data-deco="pin"]::after{
  content:"";position:absolute;z-index:8;pointer-events:none;
  width:18px;height:18px;border-radius:50%;left:18px;top:-9px;
  background:radial-gradient(circle at 32% 28%,#f07167,#c0392b 62%,#8e2820);
  box-shadow:0 3px 5px rgba(60,20,15,.42),inset -1px -1px 2px rgba(0,0,0,.25);
}
/* 蓝图钉：钉在右上角 */
.tcard[data-pin="b"]::after,
.subcard[data-pin="b"]::after{
  left:auto;right:18px;
  background:radial-gradient(circle at 32% 28%,#7fb3d5,#2e6da4 62%,#1c4468);
  box-shadow:0 3px 5px rgba(15,35,60,.42),inset -1px -1px 2px rgba(0,0,0,.25);
}
/* 绿图钉：钉在左上角偏中 */
.tcard[data-pin="g"]::after,
.subcard[data-pin="g"]::after{
  left:26px;
  background:radial-gradient(circle at 32% 28%,#8fd6a8,#3d9970 62%,#276749);
  box-shadow:0 3px 5px rgba(15,50,30,.36),inset -1px -1px 2px rgba(0,0,0,.22);
}
/* 角落 emoji 贴纸 */
.deco-sticker{
  /* ⚠️ 必须放在卡片「内」的右下角，不能外溢：
     卡片之间按 DOM 顺序堆叠，贴纸的 z-index 只在本卡片内有效，
     一旦溢出到 gap 里就会被后一张卡盖掉半颗（实测过一次）。 */
  position:absolute;right:9px;bottom:7px;z-index:7;
  font-size:23px;line-height:1;pointer-events:none;
  transform:rotate(-9deg);
  filter:drop-shadow(0 2px 3px rgba(70,60,40,.26));
}
@media (max-width:860px){
  .deco-sticker{display:none}   /* 手机上卡片窄，贴纸会压到文字 */
}

/* ---------- ⑪ 标题旁的科目 emoji ----------
   原来用 absolute 定位到 .hn-l 的 right:10px —— 但 .hn-l 是 flex:1 的整行宽块，
   科目名只有三四个字，贴纸就被甩到半空，跟标题毫无关系（实测像掉在那儿）。
   改成跟着标题文字走：h1 收成 inline-block，贴纸作为行内元素紧跟其后。 */
.hero.hn-head h1.hn-title{
  display:inline-block;      /* 宽度贴合文字，贴纸才会紧跟着 */
  max-width:100%;
}
.hn-title-sticker{
  display:inline-block;margin-left:12px;
  font-size:26px;line-height:1;
  vertical-align:6px;        /* 手写体基线偏低，往上抬一点才不会吊着 */
  transform:rotate(-8deg);
  filter:drop-shadow(0 3px 4px rgba(70,60,40,.22));
}
@media (max-width:860px){
  .hn-title-sticker{font-size:20px;margin-left:8px;vertical-align:4px}
}

/* ---------- ⑫ 课题标题前的色标（2026-10-30） ----------
   原先是 30px 的「●」字符 + 高饱和课题色（如 #2563eb 纯蓝），
   在米黄纸上既大又跳，像一颗孤零零的圆点掉在标题左边。
   改成 11px 圆角小色块：用 font-size:0 把字符收掉，background 取 currentColor。 */
.thead h2 .tdot{
  display:inline-block;width:11px;height:11px;border-radius:3px;
  background:currentColor;font-size:0;line-height:0;
  vertical-align:middle;margin-right:9px;
  transform:translateY(-1px);
}

/* ---------- ⑬ 今日小知識（2026-10-30） ----------
   科目首頁的一格「每日科普」。資料來自 data/<科目>/_daily.json，
   沒有檔案或 items 為空時整塊不渲染（不佔位、不留空殼）。
   視覺上刻意跟黃色便利貼（今日任務）區分：淡青紙 + 左側實邊，像夾在筆記裡的便條。 */
.hn-daily{
  position:relative;
  background:var(--accent-soft);
  border-left:4px solid var(--accent);
  border-radius:0 3px 3px 0;
  padding:18px 22px 20px;
  margin:0 0 26px;
  box-shadow:0 1px 2px rgba(70,60,40,.07),0 6px 18px rgba(70,60,40,.06);
}
.hn-daily-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:9px;
}
.hn-daily-lbl{
  font-size:9.5px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;
}
.hn-daily-tag{
  font-size:10.5px;color:var(--muted);letter-spacing:.04em;
  border-bottom:1px dashed var(--hn-edge);padding-bottom:1px;
}
.hn-daily-t{
  font-family:var(--hn-serif);font-size:19px;font-weight:500;
  color:var(--hn-title);line-height:1.5;letter-spacing:-.2px;
  margin-bottom:7px;
}
.hn-daily-x{
  font-size:13.5px;line-height:1.9;color:var(--text-soft);
}
html[data-theme="dark"] .hn-daily{
  box-shadow:0 1px 2px rgba(0,0,0,.30),0 6px 18px rgba(0,0,0,.26);
}
@media (max-width:860px){
  .hn-daily{padding:15px 17px 17px;margin-bottom:20px}
  .hn-daily-t{font-size:17px}
  .hn-daily-x{font-size:13px;line-height:1.8}
}

/* 三科總覽頁頂右側的總量文字（取代原本會「跳回自己」的按鈕） */
.hn-stat{
  font-size:12px;color:var(--hn-muted);letter-spacing:.06em;
  display:inline-block;padding-top:10px;
  font-variant-numeric:tabular-nums;
}
@media (max-width:860px){
  .hn-stat{padding-top:0;font-size:11.5px}
}

/* ---------- ⑭ 科研時事（三科總覽頁，2026-10-30） ----------
   站點級資料 data/_news.json，跨科目。沒有資料整塊不渲染。
   刻意做成「剪報」的感覺：虛線分隔 + 小紙片 + 科目標籤色。
   外部連結一律 target=_blank + rel=noopener。 */
.hn-news{
  margin:32px 0 0;padding-top:24px;
  border-top:1px dashed var(--hn-edge);
}
.hn-news-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin-bottom:16px;
}
/* 区块标题用正文色，别用 --hn-muted —— 实测那个灰蓝当标题太弱，几乎看不见 */
.hn-news-head .hn-lbl{color:var(--hn-title);font-size:12.5px;letter-spacing:.26em;font-weight:700}
.hn-news-sub{font-size:11.5px;color:var(--hn-muted);letter-spacing:.04em}
.hn-news-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:18px;
}
.hn-news-item{
  position:relative;
  background:var(--hn-paper);
  border-radius:4px;padding:16px 18px 14px;
  box-shadow:0 1px 2px rgba(70,60,40,.08),0 6px 16px rgba(70,60,40,.07);
  transition:transform .3s var(--ease-ios),box-shadow .3s var(--ease-ios);
}
.hn-news-item:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(70,60,40,.11),0 16px 32px rgba(70,60,40,.11);
}
.hn-news-meta{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.hn-news-cat{
  font-size:10px;padding:1px 8px;border-radius:999px;
  letter-spacing:.08em;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
}
.hn-news-cat.cat-bio{background:var(--green-tint);color:var(--green);
  border-color:color-mix(in srgb,var(--green) 26%,transparent)}
.hn-news-cat.cat-chem{background:var(--amber-soft);color:var(--amber);
  border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.hn-news-cat.cat-phys{background:var(--accent-soft);color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.hn-news-date{
  font-size:10.5px;color:var(--hn-muted);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.hn-news-t{
  font-family:var(--hn-serif);font-size:16px;font-weight:500;
  color:var(--hn-title);line-height:1.5;letter-spacing:-.1px;
  margin-bottom:7px;
}
.hn-news-x{
  font-size:13px;line-height:1.85;color:var(--text-soft);
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:5;line-clamp:5;overflow:hidden;
}
.hn-news-src{
  display:inline-block;margin-top:10px;font-size:11.5px;
  color:var(--accent);text-decoration:none;letter-spacing:.02em;
  border-bottom:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);
}
.hn-news-src:hover{color:var(--hn-accent);border-bottom-style:solid}
html[data-theme="dark"] .hn-news-item{
  box-shadow:0 1px 2px rgba(0,0,0,.32),0 6px 16px rgba(0,0,0,.28);
}
@media (max-width:860px){
  .hn-news{margin-top:24px;padding-top:20px}
  .hn-news-list{grid-template-columns:1fr;gap:14px}
  .hn-news-t{font-size:15px}
  .hn-news-x{font-size:12.5px;line-height:1.8;-webkit-line-clamp:4}
}
/* ===== LQ 參考答案（題解）=====
   題解是幾百字的 Markdown，用 mdLite 渲染。這裡只管「讀起來舒服」：
   行高放寬、引用塊做成提示條、最後加一條來源聲明。
   ⚠️ 顏色一律走語意變數 —— 這批卡片在深色主題下曾經整片發白過。 */
.lq-guide{font-size:13.5px;line-height:1.95;color:var(--text-soft)}
.lq-guide p{margin:0 0 10px}
