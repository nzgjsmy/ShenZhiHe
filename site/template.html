<script>
/* ===== 修改位置：主題（Light / Dark）初始化 =====
   必須在 <style> 之後、<body> 渲染之前執行，否則首屏會先閃一下白色。
   儲存鍵：f6note.theme（'light' | 'dark'）
   預設邏輯：若使用者手動選過 → 用該值；否則跟隨系統偏好；
            系統偏好淺色時用 light，其餘（偏好深色或無偏好）用 dark。 */
(function(){
  var THEME_KEY='f6note.theme';
  var m='';
  try{ m=localStorage.getItem(THEME_KEY)||''; }catch(e){}
  if(m!=='light' && m!=='dark'){
    try{
      if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) m='light';
      else m='dark';
    }catch(e){ m='dark'; }
  }
  document.documentElement.setAttribute('data-theme', m);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
})();
</script>
<script>
/* ============ 動畫設定：三檔模式 + 時長係數 + 降級偵測 ============
   必須在 CSS 之後、主腳本之前執行，否則首屏會用錯模式（先全開再切換 = 閃現）。
   儲存鍵：f6note.anim（'full' | 'simple' | 'off'）、f6note.animk（係數 0.5–2.0） */
var ANIM_KEY='f6note.anim', ANIMK_KEY='f6note.animk';
var ANIM_DEFAULT='full';
var ANIM_MODES=['full','simple','off'];

/* iOS Safari 動畫異常偵測：
   - 舊版 Safari（<15.4）對 CSS 變數在 calc() 中的 animation/transition 支援不完整
   - 偵測到就自動降級為 off，避免元素閃現錯亂
   回傳 true 表示「動畫不可靠」 */
function detectAnimBroken(){
  try{
    var ua=navigator.userAgent||'';
    var isIOS=/iP(hone|ad|od)/.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var isSafari=/Safari/.test(ua) && !/Chrome|CriOS|FxiOS|Edg|OPR/.test(ua);
    if(isIOS && isSafari){
      // 版本偵測：iOS < 15.4 的 Safari 對 visibility/transform 過渡有已知閃現
      var m=ua.match(/OS (\d+)[._](\d+)/);
      if(m){
        var major=parseInt(m[1],10), minor=parseInt(m[2],10);
        if(major<15 || (major===15 && minor<4)) return true;
      }
      // 沒有版本號（iPadOS 桌面模式）但支援度不明 → 保守降級
      if(!m && !window.CSS || (window.CSS && !CSS.supports('transition','opacity 1s'))){
        return true;
      }
    }
    // 一般偵測：不支援 transition 就別開動畫
    if(!window.CSS || !CSS.supports || !CSS.supports('transition','opacity 1s')) return true;
  }catch(e){ return false; }
  return false;
}
var ANIM_BROKEN=detectAnimBroken();

function animMode(){
  var v='';
  try{ v=localStorage.getItem(ANIM_KEY)||''; }catch(e){}
  if(ANIM_MODES.indexOf(v)<0) v=ANIM_DEFAULT;
  // 偵測到動畫異常時強制關閉（使用者仍可在設定頁手動覆寫，見 animForce）
  if(ANIM_BROKEN && !animForce()) return 'off';
  return v;
}
function animForce(){
  try{ return localStorage.getItem('f6note.animforce')==='1'; }catch(e){ return false; }
}
function animDisabled(){ return animMode()==='off'; }
function animK(){
  var v=parseFloat((function(){ try{ return localStorage.getItem(ANIMK_KEY)||''; }catch(e){ return ''; } })());
  if(isNaN(v)||v<=0) v=1;
  return Math.max(.5, Math.min(2, v));
}
/* 套用到 DOM：html[data-anim] + --anim-k */
function applyAnim(){
  var mode=animMode();
  document.documentElement.setAttribute('data-anim', mode);
  document.documentElement.style.setProperty('--anim-k', String(animK()));
  return mode;
}
/* 設定頁改動後呼叫：即時套用，不用重載 */
function setAnimMode(m){
  if(ANIM_MODES.indexOf(m)<0) return;
  try{ localStorage.setItem(ANIM_KEY, m); }catch(e){}
  if(ANIM_BROKEN) try{ localStorage.setItem('f6note.animforce','1'); }catch(e){}
  applyAnim();
}
function setAnimK(k){
  k=Math.max(.5, Math.min(2, parseFloat(k)||1));
  try{ localStorage.setItem(ANIMK_KEY, String(k)); }catch(e){}
  document.documentElement.style.setProperty('--anim-k', String(k));
  return k;
}
applyAnim();
</script>
<style>
/* ---------- 啟動載入屏（iOS 彈性淡出）----------
   為什麼需要：本站是 3.8 MB 的單檔離線網站，手機首次解析＋渲染需要一點時間。
   有了這一屏，使用者看到的是「正在載入」而不是空白頁。
   為什麼不用 CSP：見 SHARED-MEMORY §4.9 —— 允許 unsafe-inline/unsafe-eval 的 CSP

@keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.72}}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
const SUBJECTS = DATA.subjects || [];
const SITE = DATA.site || {name:'神智核', version:'V0.1.0'};
const NEWS = DATA.news || [];   /* 科研時事（站點級，三科總覽頁） */
const SITE_NAME = SITE.name || '神智核';
const SITE_VER = SITE.version || 'V0.1.0';
const SITE_TITLE = SITE_NAME + ' ' + SITE_VER;
const app = document.getElementById('app');

/* ===== 修改位置：主題切換（Light / Dark）=====
   toggleTheme()：讀當前 data-theme 並切到相反值
   setTheme(t)：套用並寫入 localStorage，同時更新 <meta theme-color>
   注意：初始值已在 <head> 內的 IIFE 設定，這裡只負責「切換」與「寫入」。 */
function setTheme(t){
  if(t!=='light' && t!=='dark') t='dark';
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('f6note.theme', t); }catch(e){}
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', t==='dark' ? '#12141a' : '#0f766e');
  var sw=document.getElementById('themetoggle');
  if(sw) sw.setAttribute('aria-checked', t==='dark' ? 'true' : 'false');
  syncThemeBtns();
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
  setTheme(cur==='dark' ? 'light' : 'dark');
}
/* 目前的主題模式：
     'light' / 'dark' = 使用者手動固定
     'auto'           = 沒存手動選擇 → 跟隨系統（含系統即時切換） */
function curThemeMode(){
  var m='';
  try{ m=localStorage.getItem('f6note.theme')||''; }catch(e){}
  return (m==='light'||m==='dark') ? m : 'auto';
}
/* 把設定頁三顆按鈕的「選中」狀態與下方說明同步到當前模式。
   元素不存在（不在設定頁）時靜默返回，可安全地在任何地方呼叫。 */
function syncThemeBtns(){
  var box=document.getElementById('themebtns');
  if(!box) return;
  var mode=curThemeMode();
  var btns=box.querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    var on=btns[i].getAttribute('data-mode')===mode;
    btns[i].classList.toggle('on', on);
    btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  var tip=document.getElementById('thememode-tip');
  if(tip){
    var cur=document.documentElement.getAttribute('data-theme')==='dark' ? '黑夜' : '白天';
    tip.textContent = (mode==='auto')
      ? ('目前跟隨系統：' + cur + '（系統切換時會自動跟著變）')
      : ('目前固定為：' + cur + '（不會跟隨系統）');
  }
}

/* ============ 科目層 ============
   每個科目（化學／物理／生物）是一份完全獨立的資料：自己的課題、串連、測驗題，
   連學習進度都存在各自的 localStorage 鍵裡，互不干擾。
   頁面永遠在「某一個科目」的範圍內運作，切科目時重建下面這組快取。 */
let SUB=null, TOPICS=[], UNITS=[], LINKS=[], QUIZ={}, TMAP={}, PMAP={}, XMAP={}, COLORS={};
const CHEM_COLORS = {"1a":"#8b5cf6","1b":"#0ea5e9","1c":"#d97706","2a":"#0f766e","2b":"#dc2626","3a":"#db2777","3b":"#ea580c","3c":"#e11d48","4a":"#2563eb","4b":"#059669","6":"#7c3aed","8":"#0891b2"};
const PALETTE = ["#2563eb","#7c3aed","#db2777","#ea580c","#0891b2","#059669","#b45309","#dc2626","#0ea5e9","#8b5cf6","#15803d","#d97706"];
const SUBKEY = 'f6note.subject';

function colorOf(id){return COLORS[id]||(SUB?SUB.color:"#7a756a");}

function useSubject(sid){
  const s = SUBJECTS.find(x=>x.id===sid) || SUBJECTS[0];
  if(!s) return false;
  SUB = s;
  TOPICS = s.topics || [];
  UNITS  = s.units  || [];
  LINKS  = s.links  || [];
  QUIZ   = s.quiz   || {};
  TMAP = {}; TOPICS.forEach(t=>TMAP[t.id]=t);
  PMAP = {}; // pointId -> {p, s(章), t(課題)}
  TOPICS.forEach(t=>(t.sections||[]).forEach(sec=>(sec.points||[]).forEach(p=>{PMAP[p.id]={p,s:sec,t:t};})));
  XMAP = {}; // pointId -> [{to,label}]
  LINKS.forEach(l=>{
    (XMAP[l.from]=XMAP[l.from]||[]).push({to:l.to,label:l.label||''});
    (XMAP[l.to]=XMAP[l.to]||[]).push({to:l.from,label:l.label||''});
  });
  COLORS = {};
  if(s.id==='chem') Object.assign(COLORS, CHEM_COLORS);
  const pal = (s.colors && s.colors.length) ? s.colors : PALETTE;
  TOPICS.forEach((t,i)=>{ if(!COLORS[t.id]) COLORS[t.id]=pal[i%pal.length]; });
  try{ localStorage.setItem(SUBKEY, s.id); }catch(e){}
  /* 切科目時清空測驗勾選並移除浮動操作條，避免殘留別科的課題 id */
  try{ COMBO={ids:[]}; }catch(e){}
  try{ var _pb=document.getElementById('pickbar'); if(_pb) _pb.remove(); }catch(e){}
  migrateStore(s.id);
  return true;
}
function currentSubjectId(){
  let saved='';
  try{ saved = localStorage.getItem(SUBKEY)||''; }catch(e){}
  if(saved && SUBJECTS.some(x=>x.id===saved)) return saved;
  return (SUBJECTS[0]||{}).id||'';
}
function subjectById(sid){ return SUBJECTS.find(x=>x.id===sid); }
function storeKey(sid){
  sid = sid || (SUB&&SUB.id) || '';
  if(!sid) return 'f6note.v1';
  return sid==='chem' ? 'f6chem.v1' : ('f6note.'+sid+'.v1');
}
/* 不切換科目也能讀某科的統計（給科目總覽頁用） */
function subjectPoints(s){
  const out=[];
  (s.topics||[]).forEach(t=>(t.sections||[]).forEach(sec=>(sec.points||[]).forEach(p=>out.push(p))));
  return out;
}
function masteryFor(sid){
  const s=subjectById(sid);
  if(!s) return {m:0,pts:0,mastered:0};
  const at = STORE.get(sid).attempts || {};
  let tot=0,n=0,mc=0;
  subjectPoints(s).forEach(p=>{
    n++;
    const a=at[p.id]; let m=0;
    if(a&&a.n) m=Math.max(0,Math.min(1,(a.r/a.n)*Math.min(1,a.n/2)));
    tot+=m; if(m>=0.85) mc++;
  });
  return {m:n?tot/n:0,pts:n,mastered:mc};
}
function dueCountFor(sid){
  const s=subjectById(sid);
  if(!s) return 0;
  const st=STORE.get(sid), seen=st.seen||{}, rv=st.review||{}, at=st.attempts||{}, now=Date.now();
  const ids={}; subjectPoints(s).forEach(p=>{ids[p.id]=1;});
  // 只算有出題的知識點（跟複習頁 dueList() 同一套判準，數字才對得上）
  const qp={};
  Object.keys(s.quiz||{}).forEach(tid=>(s.quiz[tid]||[]).forEach(q=>{if(q&&q.point)qp[q.point]=1;}));
  let n=0;
  Object.keys(seen).forEach(pid=>{
    if(!ids[pid]||!qp[pid]) return;
    const r=rv[pid];
    if(r){ if(r.due<=now) n++; }
    else if(!(at[pid]&&at[pid].n)) n++;
  });
  return n;
}

/* ---------------- helpers ---------------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* 下標：資料裡大量用 c_rms、N_A、F_x、m_e 這種寫法，直接顯示會是字面下劃線
   （使用者反映「下角標變下劃線」）。這裡把「基底_下標」渲染成真正的 <sub>。
   規則設計（幾個坑都踩過）：
     1. 基底可帶多位（mAu_A、VsI_s、mcrms² 都要能吃）——但若整段是 snake_case
        （前後都有英數、或含多個下劃線），就不要動。
     2. 下標後面常接 ) 」、空格、+ 等符號，不能要求「詞尾」，故改用「不是英數」即可。
     3. 行內代碼（<code>）內的內容一律不動，保留原樣給人抄。
     4. __粗體__ 的雙下劃線不處理。 */
var SUB_RE=/([A-Za-zα-ωΑ-Ω][A-Za-z0-9α-ωΑ-Ω]*)_([A-Za-z0-9α-ωΑ-Ω]+)(?![A-Za-z0-9α-ωΑ-Ω_])/g;
function subify(html){
  // 先做一輪：處理標準「基底_下標」
  var out=html.replace(SUB_RE,function(m,base,sub){
    // snake_case 防呆：全小寫長單詞（如 snake_case_name）不轉
    var looksLikeCode=/^[a-z]+$/.test(base) && base.length>3;
    if(looksLikeCode && !/^[A-Z]/.test(sub)) return m;
    return base+'<sub>'+sub+'</sub>';
  });
  // 第二輪：處理「m_AuA」這種下標後面緊跟字母的連續記號
  // （物理慣例 m_Au_A 常被寫成 m_AuA，本意仍是 m_A·u_A）
  out=out.replace(/([A-Za-z])_([A-Za-z0-9])(?=[A-Za-z])/g,function(m,b,s){
    return b+'<sub>'+s+'</sub>';
  });
  return out;
}
function inline(s){
  var t=esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  /* 行內代碼（反引號）也要做下標轉換。
     原本刻意保留原樣「方便抄寫」，但實際資料裡大量公式就寫在反引號內
     （`V_s I_s = V_p I_p`、`s_y = u_y t`），保留字面下劃線反而讓使用者
     以為是排版壞了。複製時瀏覽器會帶上 <sub> 但貼到純文字處即恢復成
     原字元，不影響抄寫。 */
  return subify(t);
}
/* markdown 表格 → HTML。抽成函數，普通表格與引用塊內的表格共用。
   分隔行（第 2 行且每格都是 ---/:--:）會被跳過。 */
function mdTable(rows){
  let out='<table>';
  rows.forEach((r,ri)=>{
    const cells=r.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
    if(ri===1&&cells.length&&cells.every(c=>/^:?-{2,}:?$/.test(c)))return;
    if(cells.length&&cells[cells.length-1]==='')cells.pop();
    const tag=ri===0?'th':'td';
    out+='<tr>'+cells.map(c=>'<'+tag+'>'+inline(c)+'</'+tag+'>').join('')+'</tr>';
  });
  return out+'</table>';
}
/* 錯題本／未整理清單的題幹摘要。
   ⚠️ 不能直接用 slice(0,300)：那會把 markdown 表格切一半、程式碼塊切到沒有收尾的 ```，
   mdLite 會把後面的內容整段當成程式碼，畫面直接壞掉。
   改成「先切到完整的一行／段落邊界，再補省略號」。 */
function mdBrief(src,limit){
  let t=String(src||'');
  if(t.length<=limit) return mdLite(t);
  const cut=t.slice(0,limit);
  // 切到最後一個換行（段落邊界）
  let p=cut.lastIndexOf('\n');
  if(p>limit*0.4) cut=cut.slice(0,p);
  else{
    // 沒有換行就退而求其次：切到最後一個句號／換行，並避開未閉合的 ``` 與表格行
    p=Math.max(cut.lastIndexOf('。'),cut.lastIndexOf('．'),cut.lastIndexOf('. '));
    if(p>limit*0.4) cut=cut.slice(0,p+1);
    const fences=(cut.match(/```/g)||[]).length;
    if(fences%2) cut=cut.slice(0,cut.lastIndexOf('\n'));
    const lines=cut.split('\n').filter(l=>!/^\s*\|/.test(l));
    cut=lines.join('\n');
  }
  return mdLite(cut+' …');
}
function mdLite(src,keywords){
  // ⚠️ 防禦：資料層若誤把 JSON 的轉義序列「\n」當成內容存進來（兩個字元：反斜杠+n），
  //   mdLite 是「逐行」解析的，整段會被當成一行，表格／清單／程式碼塊全部退化成純文字。
  //   歷史上真的發生過（152 條題解受影響）。這裡做一次就地正規化，雙保險。
  let raw=String(src||'');
  if(raw.indexOf('\\n')>=0) raw=raw.replace(/\\n/g,'\n');
  const lines = raw.split(/\r?\n/);
  let html='', i=0;
  const isTableRow=l=>/^\s*\|.*\|\s*$/.test(l);
  // 圖片行：![說明](src)——src 為 build 注入的 data URI；連續圖片行併成一個 figure
  // 支援單圖 ![](a.webp) 與多圖 ![](a.webp, b.webp, c.webp)（逗號分隔任意張數）
  const IMG_LINE_RE=/^\s*!\[([^\]]*)\]\(([^)]*)\)\s*$/;
  const splitSrcs=s=>String(s).split(',').map(x=>x.trim()).filter(Boolean);
  while(i<lines.length){
    let line=lines[i];
    if(!line.trim()){i++;continue;}
    {
      const im=line.match(IMG_LINE_RE);
      if(im){
        // 收集連續的圖片行（含多圖行），全部併進同一個 figure
        const allSrcs=[]; let cap='';
        while(i<lines.length){
          const m2=lines[i].match(IMG_LINE_RE);
          if(!m2)break;
          if(!cap&&m2[1].trim())cap=m2[1].trim();
          for(const s of splitSrcs(m2[2]))allSrcs.push(s);
          i++;
        }
        if(allSrcs.length){
          html+='<figure class="mdfig">'+allSrcs.map(s=>
            '<img decoding="async" src="'+esc(s)+'" alt="'+esc(cap)+'" title="'+esc(cap)+'">'
          ).join('')+(cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure>';
        }
        continue;
      }
    }
    if(/^```/.test(line)){
      let code='';
      const lang=line.slice(3).trim();
      i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){
        code+=lines[i]+'\n';
        i++;
      }
      if(i<lines.length)i++;
      // 代碼塊內的公式同樣做下標轉換：這裡放的多是物理/化學推導（m_A u_A、F_AB），
      // 顯示成字面下劃線既難看又容易誤讀。縮排與換行靠 <pre> 的 white-space 保留，
      // 插入的 <sub> 不會破壞排版。
      html+='<pre class="mdcodewrap"'+(lang?' data-lang="'+esc(lang)+'"':'')+'><code>'+subify(esc(code))+'</code></pre>';
      continue;
    }
    if(isTableRow(line)){
      const rows=[];
      while(i<lines.length&&isTableRow(lines[i])){ rows.push(lines[i]); i++; }
      html+=mdTable(rows);continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      let items=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      html+='<ul>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      let items=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+[.)]\s+/,''));i++;}
      html+='<ol>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';continue;
    }
    if(/^\s*#{1,4}\s+/.test(line)){html+='<p><strong>'+inline(line.replace(/^\s*#{1,4}\s+/,''))+'</strong></p>';i++;continue;}
    if(/^\s*>\s?/.test(line)){
      // 引用塊：內容是表格行時也要渲染成表格（否則會變成一堆 | 與 --- 的亂碼）
      const inner=line.replace(/^\s*>\s?/,'');
      if(isTableRow(inner)){
        const rows=[];
        while(i<lines.length){
          const l2=lines[i].replace(/^\s*>\s?/,'');
          if(!isTableRow(l2))break;
          rows.push(l2); i++;
        }
        html+='<blockquote class="mdquote">'+mdTable(rows)+'</blockquote>';continue;
      }
      html+='<p style="color:var(--muted)">'+inline(inner)+'</p>';i++;continue;
    }
    let para=[];
    while(i<lines.length&&lines[i].trim()&&!isTableRow(lines[i])&&!IMG_LINE_RE.test(lines[i])&&!/^```/.test(lines[i].trim())&&!/^\s*[-*]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^\s*#{1,4}\s+/.test(lines[i])&&!/^\s*>\s?/.test(lines[i])){para.push(lines[i]);i++;}
    html+='<p>'+para.map(inline).join('<br>')+'</p>';
  }
  return keywords ? markKeywords(html,keywords) : html;
}
/* ---------- 得分字眼高亮 ----------
   做法 Y：不改知識點正文，改成「比對正文裡出現的得分字眼並點亮」。
   規則：
     · 只在該知識點 exam.level>=3 時啟用，避免到處泛黃
     · 比對前先把關鍵字降冪、去掉空白與標點，容忍 OCR 常見的異體/標點差異
     · 比對後還原關鍵字邊界，再用 <mark> 包起來（長度 >=2 才標，避免單字亂命中）
   已標記的片段用屬性 data-kw 記錄，重複呼叫時不會二次套標。 */
function normalizeForKw(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[\s\u3000]+/g,'')          // 空白
    .replace(/[，。、；：？！「」『』（）()《》〈〉·…—～,.;:?!"'\[\]{}<>\/\\|`~@#$%^&*+=_]/g,''); // 標點
}
function markKeywords(htmlSrc, keywords){
  const src=String(htmlSrc);
  const live=[...new Set((keywords||[]).map(k=>String(k).trim()))]
    .filter(k=>k.length>=2 && src.includes(k))
    .sort((a,b)=>b.length-a.length);
  if(!live.length) return src;

  // ⚡ 效能關鍵（原本 2a 課題渲染要 11 秒，全卡在這裡）：
  //   舊寫法對每個關鍵字跑一次 `([^<>]*?)(kw)` 惰性前綴正則，
  //   惰性前綴在長段落上會退化成 O(N²)，再乘上 12 個關鍵字 → 卡到不能動。
  //   改法：(1) 先用一個正則把標籤/文字一次切開（每個文字片段都很短）；
  //        (2) 用「最長優先」的聯合正則單遍匹配，整體回到 O(N)。
  const re=new RegExp(live.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');

  const pieces=src.split(/(<[^>]*>)/);
  let skip=0;   // >0 表示正在 <code>/<a> 內，不高亮（避免染到程式碼與連結）
  for(let i=0;i<pieces.length;i++){
    const p=pieces[i];
    if(i%2===1){                       // 奇數索引是標籤本身
      if(/^<(code|a)\b/i.test(p)) skip++;
      else if(/^<\/(code|a)\s*>/i.test(p)) skip=Math.max(0,skip-1);
      continue;
    }
    if(skip||!p) continue;
    let n=0;
    pieces[i]=p.replace(re,(hit)=>{
      if(n>=20) return hit;
      n++;
      return '<mark class="kwmark" data-kw="'+esc(hit)+'">'+hit+'</mark>';
    });
  }
  return pieces.join('');
}
/* 依 p.exam 渲染考點標記 + 得分字眼清單 */
function examBadge(p){
  const e=p.exam;
  if(!e||!e.years||!e.years.length) return '';
  const lv=e.level||1;
  const label=lv>=3?'必考熱點':lv>=2?'常考':'考過';
  const icon=lv>=3?'🔥':lv>=2?'⭐':'·';
  let h=`<div class="exambar"><span class="examtag lv${lv}">${icon} ${label}</span>`
    +`<span class="examyrs">${e.years.join(' / ')} 考過（${e.hits}年）</span></div>`;
  if((e.keywords||[]).length){
    h+=`<div class="examdetail"><b>得分字眼（${e.keywords.length}）</b>`
      +`<span class="kwlist"><span class="kwtip">評卷參考常見的採分表述，答題時要寫出來</span>`
      +e.keywords.map(k=>`<span class="kw">${esc(k)}</span>`).join('')
      +`</span></div>`;
  } else if((e.samples||[]).length){
    h+=`<div class="examdetail"><b>題目實例</b>`
      +e.samples.slice(0,3).map(s=>`<span class="kh">· ${esc(s.y)} ${esc(s.ref)}：${esc(s.focus)}</span>`).join('')
      +`</div>`;
  }
  return h;
}
/* 所有頁面網址都帶科目代號（#/chem/home），這樣換科目不會互相蓋掉，
   也能直接把某一科的某個課題分享出去。go() 會自動把沒帶科目的舊式網址補上。 */
function normalizeHash(h){
  if(!h || h.charAt(0)!=='#') return h;
  const rest=h.slice(1);
  if(rest==='/subjects'||rest==='/subjects/') return '#/subjects';
  if(rest==='/settings'||rest==='/settings/') return '#/settings';
  const m=rest.match(/^\/([^\/]+)(\/.*)?$/);
  if(!m) return h;
  if(SUBJECTS.some(s=>s.id===m[1])) return h;
  const sid=(SUB&&SUB.id)||currentSubjectId();
  if(!sid) return h;
  return '#/'+sid+rest;
}
function go(h){location.hash=normalizeHash(h);}
function goBack(){ if(history.length>1) history.back(); else go('#/home'); }
function navOn(r){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  // 設定齒輪在 #nav 之外，單獨同步高亮
  const g=document.getElementById('gearbtn'); if(g) g.classList.toggle('on',r==='settings');
}

/* iOS Safari 在慣性捲動中會無聲忽略 scrollIntoView，故自製穩健捲動：
   先歸零 scrollTop 停掉慣性，再平滑捲動到目標；失敗時退回瞬間跳轉。
   動畫模式感知：simple/off 或系統減少動態時改為直接到位（不做平滑），
   但「跳到錨點並高亮」這個必要回饋一律保留。 */
function smoothScrollTo(top){
  top=Math.max(0, Math.round(top));
  var behavior = animDisabled() ? 'auto' : 'smooth';
  if(prefersReducedMotion()) behavior='auto';
  try{ window.scrollTo({top:top, behavior:behavior}); }
  catch(e){ window.scrollTo(0, top); }
  return behavior==='smooth';
}
function prefersReducedMotion(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
}
function scrollToEl(el,block){
  if(!el)return;
  var top=el.getBoundingClientRect().top+window.pageYOffset-(block==='center'?(window.innerHeight/2):72);
  var smooth=smoothScrollTo(top);
  if(!smooth) return;   // 已直接到位，不需保險
  // 保險：iOS 若忽略 smooth，捲動後強制到位（延時隨動畫係數走）
  var wait=Math.max(320, Math.round(420*animK()));
  setTimeout(function(){
    var cur=window.pageYOffset;
    if(Math.abs(cur-top)>40){try{window.scrollTo({top:top,behavior:'auto'});}catch(e2){window.scrollTo(0,top);}}
  },wait);
}
/* 跳到某個知識點並閃一下高亮（章節跳轉／搜尋跳轉共用） */
function flashAnchor(el){
  if(!el) return;
  if(animDisabled()){ el.style.boxShadow='0 0 0 3px #b45309'; return; }
  el.style.transition='box-shadow var(--dur-base) ease';
  el.style.boxShadow='0 0 0 3px #b45309';
  setTimeout(function(){ el.style.boxShadow=''; }, Math.round(1900*animK()));
}

/* ---------------- quiz store ----------------
   進度依科目分開存：化學沿用舊鍵 f6chem.v1（不讓既有紀錄失效），
   物理／生物各用自己的鍵，三科互不汙染。 */
/* ============ 内存与存储自动管控 ============
   必须放在 STORE 之前定义（const/let 有 TDZ，STORE.set 会引用这些常量）。
   1. 监测 localStorage 占用，接近上限时提示导出备份
   2. 单条纪录过长时截断超长字串，避免撑爆存储
   3. 监测 JS 堆内存水位，接近阈值温和提示刷新释放内存
   4. 长时间使用建议刷新释放内存
   ============================================= */
var MEM_CHECK_INTERVAL = 30000;      // 30秒检查一次
var MEM_WARN_THRESHOLD = 0.85;       // JS 堆内存使用率 > 85% 警告
var STORAGE_WARN_THRESHOLD = 0.8;    // localStorage 使用率 > 80% 警告
var MAX_STORE_ITEM = 400000;         // 单条 store 序列化上限（字符）
var MAX_WRONG_ITEM_LENGTH = 50000;   // 错题单条最大字符数（约 50KB）
var memWarnShown = false, storageWarnShown = false, longSessionWarnShown = false;
var SESSION_START = Date.now();
var LONG_SESSION_MS = 30 * 60 * 1000; // 30分钟

function getStorageUsage(){
  var total = 0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && (k.indexOf('f6note.')===0 || k.indexOf('f6chem')===0)){
        total += (localStorage.getItem(k)||'').length + k.length;
      }
    }
  }catch(e){}
  return total;
}
function getStorageQuota(){ return 5 * 1024 * 1024; } // 多数浏览器约 5MB
function checkStorage(){
  var used = getStorageUsage(), quota = getStorageQuota(), ratio = used/quota;
  if(ratio >= STORAGE_WARN_THRESHOLD && !storageWarnShown){
    storageWarnShown = true;
    showMemWarn('⚠️ 本地存储已用 <b>'+Math.round(ratio*100)+'%</b>，接近上限。<br>请点「导出备份」保存进度，否则新纪录可能写不进去。', true);
  }else if(ratio < STORAGE_WARN_THRESHOLD*0.7){ storageWarnShown = false; }
}
function checkMemory(){
  if(!window.performance || !window.performance.memory) return; // 非 Chrome 无此 API
  var m = window.performance.memory, ratio = m.usedJSHeapSize/m.jsHeapSizeLimit;
  if(ratio >= MEM_WARN_THRESHOLD && !memWarnShown){
    memWarnShown = true;
    showMemWarn('🧠 内存占用已达 <b>'+Math.round(ratio*100)+'%</b>，建议刷新页面释放内存。<br><small>记得先导出备份！</small>', false);
  }else if(ratio < MEM_WARN_THRESHOLD*0.7){ memWarnShown = false; }
}
function checkLongSession(){
  if(Date.now()-SESSION_START > LONG_SESSION_MS && !longSessionWarnShown){
    longSessionWarnShown = true;
    showMemWarn('⏰ 已连续使用 <b>30 分钟</b>，建议刷新页面释放内存。<br><small>记得先导出备份！</small>', false);
  }
}
function showMemWarn(msg){
  var el = document.createElement('div');
  el.className = 'memwarn show';
  el.innerHTML = msg + ' <button class="pipbtn" style="margin-top:8px" onclick="exportBackup();this.parentElement.remove()">⬇️ 导出备份</button> <button class="pipbtn" style="margin-top:8px" onclick="this.parentElement.remove()">稍后</button>';
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentElement) el.classList.remove('show'); setTimeout(function(){ if(el.parentElement) el.remove(); },300); },10000);
}
function checkMemoryAndStorage(){ checkStorage(); checkMemory(); checkLongSession(); }
/* 递归截断：序列化超过上限时，把超长字串压到 1/4（保留可读摘要） */
function truncateDeep(o){
  if(typeof o === 'string') return o.length > 8000 ? o.slice(0,8000)+'…[已截断]' : o;
  if(Array.isArray(o)) return o.map(truncateDeep);
  if(o && typeof o === 'object'){
    var out = {};
    Object.keys(o).forEach(function(k){ out[k] = truncateDeep(o[k]); });
    return out;
  }
  return o;
}
/* 限制错题单条最大长度：题目对象序列化过长时截断长字段 */
function truncateWrongItem(q){
  if(!q) return q;
  if(JSON.stringify(q).length <= MAX_WRONG_ITEM_LENGTH) return q;
  var copy = Object.assign({}, q);
  ['q','explanation','body'].forEach(function(k){
    if(copy[k] && typeof copy[k]==='string' && copy[k].length > 20000) copy[k] = copy[k].slice(0,20000)+'…[已截断]';
  });
  return copy;
}

const STORE = {
  get(sid){try{return JSON.parse(localStorage.getItem(storeKey(sid))||'{}');}catch(e){return {};}},
  set(o,sid){
    try{
      // 寫入前做容量保護：序列化後若過大，先截斷超長字串欄位，
      // 避免單條資料膨脹把 localStorage 撐爆（QuotaExceededError）
      let str=JSON.stringify(o);
      if(str.length>MAX_STORE_ITEM){
        o=truncateDeep(o);
        str=JSON.stringify(o);
      }
      localStorage.setItem(storeKey(sid),str);
    }catch(e){
      // 配額滿：提示導出備份，不要靜默吞掉
      if(e&&(e.name==='QuotaExceededError'||e.code===22)){
        storageWarnShown=false;
        showMemWarn('⚠️ 本地存储空间不足，新紀錄写不进去了。<br>请立即「导出备份」，再删除部分本机纪录。',true);
      }
    }
    checkStorage();
  }
};
/* 學習紀錄版本。
   v1 的 bug：只要打開課題頁，那一課整頁的知識點都會被標記成「已看過」，
   於是沒做過測驗的知識點全部湧進「今日待複習」——光是翻一課就會多出幾十個。
   v2 起「已看過」只在使用者真的點開某個知識點時才記錄，並做一次性清理：
   沒有實際學習紀錄（做過測驗或有複習排程）的 seen 一律清掉，因為它們
   極可能只是「整頁被渲染過」而不是真的看過。 */
const STORE_VER = 2;
function migrateStore(sid){
  const s = STORE.get(sid);
  if((s.ver || 1) >= STORE_VER) return;
  const keep = {};
  Object.keys(s.seen || {}).forEach(pid=>{
    const a = (s.attempts || {})[pid];
    if((a && a.n) || (s.review || {})[pid]) keep[pid] = s.seen[pid];
  });
  s.seen = keep;
  s.ver = STORE_VER;
  STORE.set(s, sid);
}
function wrongSet(){const s=STORE.get();return new Set(s.wrong||[]);}
/* 錯題本三層狀態：
   wrong      答錯過的題（不再因答對而自動刪除）
   rightLater 答錯之後又答對的題（可以標記「已整理」歸檔）
   fixed      已整理（從清單收起，仍保留筆記）
   wnotes     使用者自己寫的錯題筆記 {qid: text} */
function rightLaterSet(){const s=STORE.get();return new Set(s.rightLater||[]);}
function fixedSet(){const s=STORE.get();return new Set(s.fixed||[]);}

function markWrong(qid){
  const s=STORE.get();s.wrong=s.wrong||[];
  if(!s.wrong.includes(qid))s.wrong.push(qid);
  s.rightLater=(s.rightLater||[]).filter(x=>x!==qid);

}

  if((s.wrong||[]).includes(qid)){
    s.rightLater=s.rightLater||[];

function setWrongNote(qid, txt){

function toggleFixed(qid){

function allQuestions(){
  const out=[];
  Object.keys(QUIZ).forEach(tid=>(QUIZ[tid]||[]).forEach(q=>out.push(Object.assign({topic:tid},q))));

}
function qIndex(){const m={};allQuestions().forEach(q=>m[q.id]=q);return m;}
function pointStats(pid){ // returns [right,total] attempts
  const s=STORE.get();const a=(s.attempts||{})[pid];return a?[a.r,a.n]:[0,0];

function bumpAttempt(pid,ok){

/* ---------------- 學習進度 · 間隔複習 ---------------- */
const DAYMS=86400000, MAXBOX=5, INTERVALS=[0,1,3,7,16,35];
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchDay(){const s=STORE.get();s.days=s.days||{};s.days[dkey()]=1;STORE.set(s);}
function streak(){
  const ds=STORE.get().days||{};let n=0,d=new Date();
  if(!ds[dkey(d)])d=new Date(Date.now()-DAYMS);
  while(ds[dkey(d)]){n++;d=new Date(d.getTime()-DAYMS);}
  return n;
}
function dayCount(){return Object.keys(STORE.get().days||{}).length;}
/* 「已看過」的寫入改成批次的：
   一個知識點真的被讀到（見 observePointReads）才進來，並集中一次落盤，
   避免一頁滾下來寫幾十次 localStorage。 */
let seenQ=[], seenT=null;
function queueSeen(pid){ if(seenQ.indexOf(pid)<0)seenQ.push(pid); }
function flushSeen(){
  if(seenT){clearTimeout(seenT);seenT=null;}
  if(!seenQ.length)return;
  const ids=seenQ.slice(); seenQ.length=0;
  touchDay();
  const s=STORE.get(); s.seen=s.seen||{};
  const now=Date.now(); let ch=false;
  ids.forEach(pid=>{ if(!s.seen[pid]){ s.seen[pid]=now; ch=true; } });
  if(ch)STORE.set(s);
}
function markSeenSoon(pid){ queueSeen(pid); if(!seenT)seenT=setTimeout(flushSeen,800); }
function markSeen(pid){ queueSeen(pid); flushSeen(); }

/* 知識點要停留在畫面上一下下才算「讀過」；只是被渲染出來不算。
   舊版是在 ptCard() 裡直接 markSeen()，等於打開一課就把整課幾十個知識點
   全標成已看過——複習數字就是這樣爆掉的。 */
const READ_DWELL_MS=1200;
let readObs=null, readTimers={};
function observePointReads(){
  const cards=document.querySelectorAll('#app .pcard');
  if(readObs){readObs.disconnect();readObs=null;}
  Object.keys(readTimers).forEach(k=>{clearTimeout(readTimers[k]);});
  readTimers={};
  if(!cards.length)return;
  // 沒有 IntersectionObserver 的舊瀏覽器：寧可少記，也不要再記錯
  if(typeof IntersectionObserver==='undefined')return;
  const obs=new IntersectionObserver(entries=>{
    // 換頁後舊觀察器可能還會回呼一次，這裡擋掉
    if(obs!==readObs)return;
    entries.forEach(en=>{
      const el=en.target, pid=el.getAttribute('data-pid');
      if(!pid)return;
      if(en.isIntersecting){
        if(readTimers[pid]||obs.seen[pid])return;
        readTimers[pid]=setTimeout(()=>{
          delete readTimers[pid];
          if(obs!==readObs)return;
          obs.seen[pid]=1;
          markSeenSoon(pid);
        },READ_DWELL_MS);
      }else if(readTimers[pid]){
        clearTimeout(readTimers[pid]); delete readTimers[pid];
      }
    });
  },{threshold:0.55});
  obs.seen={};
  readObs=obs;
  cards.forEach(c=>obs.observe(c));
}
function scheduleReview(pid,ok){
  const s=STORE.get();s.review=s.review||{};
  const cur=s.review[pid]||{box:0};
  const box=ok?Math.min(MAXBOX,(cur.box||0)+1):0;
  const r={box:box,due:Date.now()+INTERVALS[box]*DAYMS,last:Date.now()};
  s.review[pid]=r;STORE.set(s);
  return r;
}
function pointMastery(pid){
  const a=(STORE.get().attempts||{})[pid];
  if(!a||!a.n)return 0;
  return Math.max(0,Math.min(1,(a.r/a.n)*Math.min(1,a.n/2)));
}
function pointsOf(t){return (t.sections||[]).reduce((x,s)=>x.concat(s.points||[]),[]);}
function allPoints(){return TOPICS.reduce((x,t)=>x.concat(pointsOf(t)),[]);}
function topicMastery(t){const ps=pointsOf(t);if(!ps.length)return 0;return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;}
function overallMastery(){const ps=allPoints();if(!ps.length)return 0;return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;}
function masteredCount(){return allPoints().filter(p=>pointMastery(p.id)>=0.85).length;}
/* ---------- 子分區（單元）----------
   一個科目底下可再分「熱學／力學／波動學」等單元，避免課題一多就平鋪成長串。
   單元只做分組：課題 id、知識點 id 完全不動，既有學習進度不受影響。
   沒宣告 units 的科目（如化學）維持原本平鋪顯示。 */
function hasUnits(){return UNITS.length>0;}
function topicsOfUnit(u){return (u.topics||[]).map(id=>TMAP[id]).filter(Boolean);}
function unitOfTopic(tid){return UNITS.find(u=>(u.topics||[]).indexOf(tid)>=0)||null;}
function unitMastery(u){
  const ps=topicsOfUnit(u).reduce((x,t)=>x.concat(pointsOf(t)),[]);
  if(!ps.length)return 0;
  return ps.reduce((a,p)=>a+pointMastery(p.id),0)/ps.length;
}
function unitMasteredCount(u){
  return topicsOfUnit(u).reduce((x,t)=>x.concat(pointsOf(t)),[])
    .filter(p=>pointMastery(p.id)>=0.85).length;
}
function masteryLabel(m){return m>=0.85?'熟練':m>=0.6?'不錯':m>=0.3?'起步':'待開始';}
function masteryColor(m){return m>=0.85?'#15803d':m>=0.6?'#0f766e':m>=0.3?'#b45309':'#b0aa9e';}
function fmtDue(ts){
  const d=ts-Date.now();
  if(d<=60000)return '現在';
  const days=d/DAYMS;
  if(days<1)return '今天稍後';
  if(days<1.6)return '明天';
  if(days<30)return Math.round(days)+' 天後';
  return Math.round(days/30)+' 個月後';
}
/* 「該複習了」＝真的有事可做的項目：有測驗題、而且到期（或學過還沒測）。
   沒有出題的知識點排不了複習，永遠清不掉，所以不能混進這個數字裡——
   它們是「學過、還沒出題」，另外用 readOnlyList() 列出來，只讓你看筆記。 */
function dueList(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{},now=Date.now(),out=[];
  const qp=quizPoints();
  Object.keys(seen).forEach(pid=>{
    const o=PMAP[pid];if(!o)return;
    if(!qp[pid])return;
    const r=rv[pid];
    if(r){if(r.due<=now)out.push({pid:pid,o:o,due:r.due,box:r.box,over:now-r.due,fresh:false});}
    else if(!(at[pid]&&at[pid].n))out.push({pid:pid,o:o,due:seen[pid],box:0,over:now-seen[pid],fresh:true});
  });
  out.sort((a,b)=>((a.fresh?1:0)-(b.fresh?1:0))||(b.over-a.over));
  return out;
}
/* 學過、但站上還沒有對應題目的知識點：只能看筆記，不該假裝是待複習任務。 */
function readOnlyList(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{};
  const qp=quizPoints();
  return Object.keys(seen).filter(pid=>PMAP[pid]&&!qp[pid]&&!(at[pid]&&at[pid].n));
}
function newPointCount(){
  const s=STORE.get(),seen=s.seen||{},rv=s.review||{},at=s.attempts||{},qp=quizPoints();
  return Object.keys(seen).filter(pid=>PMAP[pid]&&qp[pid]&&!rv[pid]&&!(at[pid]&&at[pid].n)).length;
}
function quizPoints(){const m={};allQuestions().forEach(q=>{if(q.point)m[q.point]=1;});return m;}

  b.classList.toggle('on',n>0);
}

function switchSubject(sid){
  if(!useSubject(sid))return;
  renderSubbar();
  const h=location.hash||'#/home';
  /* 修 bug：hash 裡帶了舊科目的 id（例如 #/phys/quiz）時，若只改 SUB 而不同步 hash，
     route() 會依 hash 再把科目切回去，造成「點科目沒反應」。
     所以這裡要把 hash 的科目段換成新科目：
       #/phys/quiz  → #/chem/quiz
       #/phys/home  → #/chem/home
     課題頁／單元頁／答題中的頁面在新科目不一定存在，直接回首頁最安全。 */
  const m=h.match(/^#\/([^\/]+)(\/.*)?$/);
  const looksSubject = m && SUBJECTS.some(s=>s.id===m[1]);
  if(looksSubject){
    const rest=m[2]||'/home';
    // 新科目沒有同一個課題／單元，回首頁；其餘（測驗、複習、圖譜…）沿用同頁面。
    // hash 一律帶上科目 id，讓網址與目前科目完全一致（重新整理也不會跑掉）。
    if(rest.startsWith('/t/')||rest.indexOf('/unit/')===0||rest==='/run'){ go('#/'+sid+'/home'); return; }
    go('#/'+sid+rest);
    return;
  }
  // hash 沒帶科目（#/home、#/settings 等）：以新科目的首頁為準，確保狀態與網址同步
  if(h.startsWith('#/settings')){ route(); return; }
  go('#/'+sid+'/home');
}

/* ===== 修改位置：跟隨系統主題 =====
   清掉 localStorage 的手動選擇，改依系統偏好即時決定。 */
function followSystemTheme(){
  try{ localStorage.removeItem('f6note.theme'); }catch(e){}
  var m='dark';
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) m='light';
  }catch(e){}
  document.documentElement.setAttribute('data-theme', m);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
  var sw=document.getElementById('themetoggle');
  if(sw) sw.setAttribute('aria-checked', m==='dark' ? 'true' : 'false');
  syncThemeBtns();
}
/* 若使用者尚未手動選擇，系統切換時即時跟隨 */
(function(){
  try{
    if(!window.matchMedia) return;
    var mql=window.matchMedia('(prefers-color-scheme: dark)');
    var handler=function(){
      var saved='';
      try{ saved=localStorage.getItem('f6note.theme')||''; }catch(e){}
      if(saved==='light'||saved==='dark') return;   // 使用者手動選過，不跟隨
      var m=mql.matches?'dark':'light';
      document.documentElement.setAttribute('data-theme', m);
      var mt=document.querySelector('meta[name="theme-color"]');
      if(mt) mt.setAttribute('content', m==='dark' ? '#12141a' : '#0f766e');
      var sw=document.getElementById('themetoggle');
      if(sw) sw.setAttribute('aria-checked', m==='dark' ? 'true' : 'false');
      syncThemeBtns();   // 讓設定頁的說明文字跟著更新（例如「目前跟隨系統：黑夜」）
    };
    if(mql.addEventListener) mql.addEventListener('change', handler);
    else if(mql.addListener) mql.addListener(handler);
  }catch(e){}
})();

/* 手账感：给首页/单元页的课题卡随机倾斜 −1.6° ~ +1.6°。
   每次渲染重新随机；通过 CSS 变量 --tilt 注入，不会覆盖 :hover 的位移。
   回退：删除本函数与各处 tiltCards() 调用即可（CSS 里的 var(--tilt,0deg) 有兜底）。 */
function tiltCards(){
  /* 手账随机倾斜：每次渲染（含刷新、切页）重新掷一次骰子。
     三层的幅度不同——大卡片可以晃，便利贴和页头要收着点，
     否则阅读区整片歪斜会晕。手机端在 CSS 里被压回 0deg。 */
  var R=function(a){return ((Math.random()*2-1)*a).toFixed(2)+'deg';};
  /* 手機不傾斜：卡片本來就窄，一歪就参差；且 CSS 那條 :nth-child(n){--tilt:0deg}
     會被這裡的「內聯樣式」蓋掉（內聯優先級最高），所以必須在 JS 裡就否掉。 */
  if(window.matchMedia('(max-width:860px)').matches){
    document.querySelectorAll('#app .tcard,#app .dash,#app .dse-duo .dse-hero')
      .forEach(function(c){c.style.removeProperty('--tilt');});
    return;
  }
  /* 装饰轮换：一张胶带、一张图钉交替，每第 3 张再在右下角贴个 emoji，
     像真的一张张随手贴上去，不会整页卡片长得一模一样。 */
  var PINS=['r','b','g','r','g','b'];
  var STICK=['📌','✏️','💡','🔥','🌿','⭐','📎','🍀','🧪','🌱'];

/* ---------- 虚拟滚动实现（可变高度 + 占位块）----------
   长章节（知识点超过阈值）改用虚拟列表：
   - 只渲染视口可见区 + 上下各 VIRT_BUFFER 张缓冲卡片
   - 离开视口的卡片销毁，用占位 div（spacer）保持滚动高度
   - 卡片高度不一（含笔记原图），因此逐张实测高度并修正占位，
     不用固定行高估算，避免卡片互相重叠
   - 滚动时 rAF 节流重算可见范围
   阈值：50 个知识点（可依设备性能调整） */
/* 虛擬滾動已停用（2026-10-28）。
   原因：虛擬滾動會讓瀏覽器 Ctrl+F 找不到未渲染的卡片，也無法跨卡片選取文字，
   對「查考點」這個主要用途傷害很大。
   為什麼可以安全停用：全站 86 個課題只有 6 個超過舊閾值 50，
   最多的一個（chem/2a）也才 88 個知識點，直出渲染完全不成負擔。
   想恢復：把下面的數字改回 50 即可，其餘 virt* 程式碼都還在。 */
const VIRT_THRESHOLD = 100000;
const VIRT_BUFFER = 6;         // 上下各额外渲染几张卡片
const VIRT_EST = 320;          // 未测量卡片的初始预估高度

let VIRT = {items:[], heights:[], est:VIRT_EST, listEl:null, contentEl:null, renderT:null};
function virtReset(){
  VIRT.items = [];
  VIRT.heights = [];
  VIRT.listEl = null;
  VIRT.contentEl = null;
  if(VIRT.renderT){ cancelAnimationFrame(VIRT.renderT); VIRT.renderT = null; }
}
function virtBuildItems(t){
  // 扁平化：把所有章节的知识点按顺序压成一维数组
  const items = [];
  (t.sections||[]).forEach(function(s){
    (s.points||[]).forEach(function(p){
      items.push({p:p, sec:s, t:t});
    });
  });
  return items;
}
/* 前缀和：未测量的用当前平均预估值 */
function virtOffsets(){
  const n=VIRT.items.length, off=new Array(n+1);
  off[0]=0;
  for(let i=0;i<n;i++){
    const h=VIRT.heights[i];
    off[i+1]=off[i]+((h==null||h<=0)?VIRT.est:h);
  }
  return off;
}
function virtRender(){
  const C=VIRT.contentEl, L=VIRT.listEl;
  if(!C||!L||!VIRT.items.length) return;
  const n=VIRT.items.length;
  const off=virtOffsets();
  const st=C.scrollTop, vh=C.clientHeight||window.innerHeight;
  // 可见范围（线性扫描即可，几百个点开销可忽略）
  let first=0;
  while(first<n && off[first+1]<=st) first++;
  first=Math.max(0, first-VIRT_BUFFER);
  let last=first;
  while(last<n-1 && off[last+1]<st+vh) last++;
  last=Math.min(n-1, last+VIRT_BUFFER);
  // 平滑跳轉中：目標索引強制納入渲染範圍（否則到位前目標卡片不存在）
  if(VIRT.pinIdx!=null){
    first=Math.min(first, VIRT.pinIdx);
    last=Math.max(last, VIRT.pinIdx);
  }
  // ---------- 增量更新：不整體替換 DOM，避免圖片加載被中斷閃爍 ----------
  const needed = new Set();
  for(let i=first; i<=last; i++) needed.add(i);
  // 移除不再需要的卡片
  const curItems = L.querySelectorAll('.vitem');
  for(let i=curItems.length-1; i>=0; i--){
    const idx = +curItems[i].dataset.idx;
    if(!needed.has(idx)){
      curItems[i].remove();
    }
  }
  // 已存在的索引
  const existing = new Set();
  L.querySelectorAll('.vitem').forEach(el => existing.add(+el.dataset.idx));
  // 插入需要的新卡片，保持顺序
  for(let i=first; i<=last; i++){
    if(existing.has(i)) continue;
    const card = document.createElement('div');
    card.className = 'vitem';
    card.dataset.idx = i;
    card.innerHTML = ptCard(VIRT.items[i].p, VIRT.items[i].t);
    // 找到插入位置：第一個索引大於 i 的現有元素之前
    let refEl = null;
    const allItems = L.querySelectorAll('.vitem');
    for(let j=0; j<allItems.length; j++){
      if(+allItems[j].dataset.idx > i){
        refEl = allItems[j];
        break;
      }
    }
    if(refEl){
      refEl.parentNode.insertBefore(card, refEl);
    } else {
      L.appendChild(card);
    }
  }
  // ---------- 占位 div ----------
  // 移除舊占位
  L.querySelectorAll('[data-sp]').forEach(sp=>sp.remove());
  let html='';
  if(first>0) html+='<div class="vplaceholder" data-sp="top" style="height:'+Math.round(off[first])+'px"></div>';
  if(last<n-1) html+='<div class="vplaceholder" data-sp="bot" style="height:'+Math.round(off[n]-off[last+1])+'px"></div>';
  if(html){
    const temp = document.createElement('div');
    temp.innerHTML = html;
    // 占位要放在最前和最後
    const topSp = temp.querySelector('[data-sp="top"]');
    const botSp = temp.querySelector('[data-sp="bot"]');
    if(topSp) L.insertBefore(topSp, L.firstChild);
    if(botSp) L.appendChild(botSp);
  }
  // 实测渲染出来的卡片高度并修正（只在有变化时更新占位，避免跳动）
  let changed=false, sum=0, cnt=0;
  L.querySelectorAll('.vitem').forEach(function(el){
    const i=+el.dataset.idx;
    const h=el.offsetHeight;
    if(h>10){
      if(VIRT.heights[i]==null || Math.abs(VIRT.heights[i]-h)>1){ VIRT.heights[i]=h; changed=true; }
      sum+=VIRT.heights[i]; cnt++;
    }
  });
  if(cnt) VIRT.est=Math.max(80, Math.round(sum/cnt));
  if(changed){
    const off2=virtOffsets();
    const topSp=L.querySelector('[data-sp="top"]'), botSp=L.querySelector('[data-sp="bot"]');
    if(topSp) topSp.style.height=Math.round(off2[first])+'px';
    if(botSp) botSp.style.height=Math.round(off2[n]-off2[last+1])+'px';
  }
  observePointReads(); // 新渲染的卡片要重新纳入「停留才算已读」观察
}
function virtOnScroll(){
  if(VIRT.renderT) return;
  VIRT.renderT=requestAnimationFrame(function(){
    VIRT.renderT=null;
    virtRender();
  });
}
/* 跳到指定知识点／章节（虚拟列表里元素不是一直存在，靠计算滚动位置）
   simple/full 用平滑滚动，off 直接到位；高亮回饋一律保留。
   平滑模式下 scrollTop 是漸變的，virtRender 依當前位置算可見範圍會漏掉目標，
   因此先把目標索引記進 VIRT.pinIdx，virtRender 會把它一併渲染出來。 */
function virtJump(idx,center){
  if(idx<0||idx>=VIRT.items.length||!VIRT.contentEl) return false;
  const off=virtOffsets();
  const C=VIRT.contentEl;
  let top = center ? (off[idx] - (C.clientHeight - (VIRT.heights[idx]||VIRT.est))/2) : (off[idx]-56);
  top=Math.max(0, Math.min(top, C.scrollHeight - C.clientHeight));
  const smooth = !animDisabled() && !prefersReducedMotion();
  VIRT.pinIdx = idx;                 // 無論平滑與否，都保證目標被渲染
  if(smooth){
    try{ C.scrollTo({top:top, behavior:'smooth'}); }
    catch(e){ C.scrollTop=top; }
    virtRender();
    // 保險：Safari 忽略 smooth 時強制到位
    const target=top;
    setTimeout(function(){
      if(Math.abs(C.scrollTop-target)>40){ C.scrollTop=target; }
      VIRT.pinIdx=null;
      virtRender();
    }, Math.max(320, Math.round(420*animK())));
  }else{
    C.scrollTop = top;
    VIRT.pinIdx=null;
    virtRender();
  }
  return true;
}
function virtJumpPoint(pid){
  const i=VIRT.items.findIndex(x=>x.p.id===pid);
  if(i<0) return false;
  if(!virtJump(i,true)) return false;
  // 平滑捲動要等卡片渲染出來再高亮
  const delay = (!animDisabled() && !prefersReducedMotion()) ? Math.max(160, Math.round(260*animK())) : 0;
  if(delay){
    setTimeout(function(){ flashAnchor(document.getElementById('pt-'+pid)); }, delay);
  }else{
    flashAnchor(document.getElementById('pt-'+pid));
  }
  return true;
}
function virtJumpSection(sid){
  const i=VIRT.items.findIndex(x=>x.sec.id===sid);
  return i>=0 ? virtJump(i,false) : false;
}
function virtInit(contentEl,listEl,items){
  VIRT.items=items;
  VIRT.heights=new Array(items.length).fill(null);
  VIRT.est=VIRT_EST;
  VIRT.contentEl=contentEl;
  VIRT.listEl=listEl;
  contentEl.addEventListener('scroll',virtOnScroll);
  virtRender();
}

function countPts(t){return (t.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);}
function ptCard(p,t){
  const xs=(XMAP[p.id]||[]);
  const cross=xs.filter(x=>PMAP[x.to]&&PMAP[x.to].t.id!==t.id);
  const inner=xs.filter(x=>PMAP[x.to]&&PMAP[x.to].t.id===t.id&&x.to!==p.id);
  let xl='';
  if(cross.length||inner.length){
    const items=[...cross,...inner].map(x=>{
      const o=PMAP[x.to]; if(!o)return '';
      const same=o.t.id===t.id;
      return `<span class="xl">🔗 <b>${same?'同課題':'跨課題 '+esc(o.t.title)}</b> · <span class="jump" onclick="jumpPoint('${o.p.id}')">${esc(o.s.title)} → ${esc(o.p.title)}</span>${x.label?'<br><span style="color:var(--muted);font-size:13px">'+esc(x.label)+'</span>':''}</span>`;
    }).join('');
    xl=`<div class="xlinks">${cross.length?'<div style="font-size:13px;color:var(--amber);margin-bottom:2px">這個知識點還與……相連</div>':''}${items}</div>`;
  }
  const st=pointStats(p.id);
  const m=pointMastery(p.id);
  const mp=Math.round(m*100);
  const rv=(STORE.get().review||{})[p.id];
  const due=rv&&rv.due<=Date.now();

  const exLv=(p.exam&&p.exam.level)||0;
  return `<div class="pcard" id="pt-${p.id}" data-pid="${p.id}"${exLv?' data-exam="'+exLv+'"':''}>
    <h4>${esc(p.title)}${p.page?'<span class="pg">📄 第 '+p.page+' 頁</span>':''}${st[1]?'<span class="pg">'+st[0]+'/'+st[1]+' 答對</span>':''}${mbadge}${due?'<span class="badge due">該複習了</span>':''}
      <button class="qbtn" onclick="startQuiz({mode:'point',id:'${p.id}'})">測驗</button></h4>
    <div class="md">${mdLite(p.body,(p.exam&&p.exam.years&&p.exam.years.length)?(p.exam.keywords||[]):null)}</div>

    ${examBadge(p)}

/* ---------------- 畫中畫：不離開測驗也能看知識點 ----------------

   現在改成右下角浮動小窗，關掉就回到原本的題號與作答狀態。 */
let PIP_CUR='', PIP_HIST=[];
function pipEl(){return document.getElementById('pip');}
function pipQuizRunning(){return !!(QZ&&(location.hash||'').indexOf('/run')>=0);}
function openPip(pid,keepHist){
  const o=PMAP[pid]; if(!o)return;
  if(!keepHist)PIP_HIST=[];
  if(PIP_CUR&&PIP_CUR!==pid)PIP_HIST.push(PIP_CUR);
  PIP_CUR=pid;
  markSeen(pid);
  renderPip();
  const el=pipEl(); if(!el)return;
  el.classList.add('on');
  bindPipDrag();
  const saved=loadPipPos();
  if(saved)placePip(saved.left,saved.top,false);
}
function pipBack(){
  if(PIP_HIST.length){PIP_CUR=PIP_HIST.pop();renderPip();}
  else closePip();
}
function closePip(){
  PIP_CUR='';PIP_HIST=[];
  const el=pipEl();
  if(!el) return;
  // 先移除 .on 讓過渡播放（Safari 下用 visibility 過渡，元素不會瞬間消失）
  el.classList.remove('on');
  // 過渡結束後才清空內部 DOM，避免「動畫還在跑但內容已被清掉」的閃現；
  // 完全關閉動畫時直接清（沒有過渡可等）。
  const clearNow = animMode()==='off' || animDisabled();
  const delay = clearNow ? 0 : Math.round(220*animK());
  if(el.__clearT) clearTimeout(el.__clearT);
  if(clearNow){
    el.innerHTML='';
  }else{
    el.__clearT=setTimeout(function(){
      el.__clearT=null;
      // 期間若又被打開（PIP_CUR 有值）就不要清
      if(!PIP_CUR && !el.classList.contains('on')) el.innerHTML='';
    },delay);
  }
}
function renderPip(){
  const el=pipEl(); if(!el)return;
  const o=PMAP[PIP_CUR]; if(!o){closePip();return;}
  const p=o.p,t=o.t,sec=o.s;
  const xs=(XMAP[p.id]||[]).map(x=>{
    const q=PMAP[x.to]; if(!q)return '';
    return '<span class="xl">🔗 <b>'+(q.t.id===t.id?'同課題':'跨課題 '+esc(q.t.title))+'</b> · <span class="jump" onclick="openPip(\''+q.p.id+'\',true)">'+esc(q.s.title)+' → '+esc(q.p.title)+'</span>'+(x.label?'<br><span style="color:var(--muted);font-size:13px">'+esc(x.label)+'</span>':'')+'</span>';
  }).join('');
  const st=pointStats(p.id);
  el.innerHTML=
    '<div class="piphead"><div class="pipgrip" title="按住可拖動，雙擊歸位">⋮⋮</div><div class="pipt">'
    +'<span class="pipk">'+esc(t.title)+' · '+esc(sec.title)+'</span>'
    +'<b>'+esc(p.title)+'</b>'

/* ---- 畫中畫可拖動（滑鼠 + 觸屏，統一走 Pointer Events）----
   抓 header 就能拖；拖過的位置記在 localStorage，下次打開還在原位。
   用 left/top 定位，沒拖過時仍由 CSS 的右下角決定。 */
const PIP_POS_KEY = 'f6note.pip.pos';
let PIP_DRAG = null;

function loadPipPos(){
  try{
    const p = JSON.parse(localStorage.getItem(PIP_POS_KEY) || 'null');
    if(p && typeof p.left === 'number' && typeof p.top === 'number') return p;
  }catch(e){}
  return null;
}
function savePipPos(p){
  try{ localStorage.setItem(PIP_POS_KEY, JSON.stringify({left:Math.round(p.left), top:Math.round(p.top)})); }catch(e){}
}
function clearPipPos(){ try{ localStorage.removeItem(PIP_POS_KEY); }catch(e){} }

/* 邊界限制：不讓視窗被拖出畫面外（手機留 8px 手指邊） */
function clampPip(left, top){
  const el = pipEl(); if(!el) return {left:left, top:top};
  const w = el.offsetWidth || 0, h = el.offsetHeight || 0;
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 8;
  const maxLeft = Math.max(pad, vw - w - pad);
  const maxTop  = Math.max(pad, vh - h - pad);
  return {
    left: Math.min(Math.max(pad, left), maxLeft),
    top:  Math.min(Math.max(pad, top), maxTop)
  };
}
function placePip(left, top, save){
  const el = pipEl(); if(!el) return;
  const p = clampPip(left, top);
  el.style.left = p.left + 'px';
  el.style.top = p.top + 'px';
  el.style.right = 'auto';
  el.style.bottom = 'auto';
  if(save) savePipPos(p);
}
/* 歸位：清掉座標，交還給 CSS 的右下角 */
function resetPipPos(){
  clearPipPos();
  const el = pipEl(); if(!el) return;
  el.style.left = ''; el.style.top = '';
  el.style.right = ''; el.style.bottom = '';
}
/* 視窗縮放／轉向後，把已拖動的浮窗拉回可視範圍 */
function keepPipInView(){
  const el = pipEl(); if(!el || !el.classList.contains('on')) return;
  if(!el.style.left) return;   // 還沒拖過，交給 CSS
  const l = parseFloat(el.style.left), t = parseFloat(el.style.top);
  if(isNaN(l) || isNaN(t)) return;
  placePip(l, t, false);
}

function pipDragStart(e){
  const el = pipEl(); if(!el || !el.classList.contains('on')) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const r = el.getBoundingClientRect();
  PIP_DRAG = {id:e.pointerId, dx:e.clientX - r.left, dy:e.clientY - r.top, moved:false};
  el.classList.add('dragging');
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  if(e.cancelable) e.preventDefault();
}
function pipDragMove(e){
  if(!PIP_DRAG || e.pointerId !== PIP_DRAG.id) return;
  PIP_DRAG.moved = true;
  placePip(e.clientX - PIP_DRAG.dx, e.clientY - PIP_DRAG.dy, false);
  if(e.cancelable) e.preventDefault();
}
function pipDragEnd(e){
  if(!PIP_DRAG || e.pointerId !== PIP_DRAG.id) return;
  const el = pipEl();
  const moved = PIP_DRAG.moved;
  const id = PIP_DRAG.id;
  PIP_DRAG = null;
  if(!el) return;
  el.classList.remove('dragging');
  try{ el.releasePointerCapture(id); }catch(_){}
  if(moved && el.style.left){
    savePipPos({left:parseFloat(el.style.left), top:parseFloat(el.style.top)});
  }
}
function bindPipDrag(){
  const el = pipEl(); if(!el || el.__dragBound) return;
  el.__dragBound = true;
  el.addEventListener('pointerdown', function(e){
    if(!e.target.closest('.piphead')) return;
    if(e.target.closest('button')) return;   // 按鈕照常點擊
    pipDragStart(e);
  });
  el.addEventListener('pointermove', pipDragMove);
  el.addEventListener('pointerup', pipDragEnd);
  el.addEventListener('pointercancel', pipDragEnd);
  /* 雙擊把手＝歸位 */
  el.addEventListener('dblclick', function(e){
    if(!e.target.closest('.piphead') || e.target.closest('button')) return;
    resetPipPos();
  });
  /* 老瀏覽器沒有 Pointer Events 時的觸屏保底 */
  if(!window.PointerEvent){
    el.addEventListener('touchstart', function(e){
      if(!e.target.closest('.piphead') || e.target.closest('button')) return;
      const t = e.touches[0]; if(!t) return;
      const r = el.getBoundingClientRect();
      PIP_DRAG = {id:'touch', dx:t.clientX - r.left, dy:t.clientY - r.top, moved:false};
      el.classList.add('dragging');
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchmove', function(e){
      if(!PIP_DRAG) return;
      const t = e.touches[0]; if(!t) return;
      PIP_DRAG.moved = true;
      placePip(t.clientX - PIP_DRAG.dx, t.clientY - PIP_DRAG.dy, false);
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchend', function(){
      if(!PIP_DRAG) return;
      const el2 = pipEl(); const moved = PIP_DRAG.moved;
      PIP_DRAG = null;
      if(!el2) return;
      el2.classList.remove('dragging');
      if(moved && el2.style.left) savePipPos({left:parseFloat(el2.style.left), top:parseFloat(el2.style.top)});
    });
  }
}
window.addEventListener('resize', keepPipInView);
window.addEventListener('orientationchange', function(){ setTimeout(keepPipInView, 200); });



function jumpPoint(pid){

/* ---------------- 關聯地圖 ---------------- */
/* 2026-10-28 重做。舊版是力導向的全科圖：化學 12 節點 24 條邊、物理 20 節點 47 條邊，
   線全部穿過中心、標籤互相壓字，使用者反饋「太亂、沒什麼用」。
   新版三條原則：
     1. 全科不畫圖（節點一多必然亂）→ 改成「關聯排行」清單
     2. 只有單一課題才畫圖，用星形佈局（中心＋環），邊只從中心往外，永不交叉
     3. 每條關聯都寫出「哪個知識點 → 哪個知識點 ＋ 為什麼」，可直接點擊跳轉
   為什麼敢砍掉全科圖：筆記頁每個知識點下方本來就有「這個知識點還與……相連」，
   圖的價值只剩「哪些課題該一起複習」，排行 + 星形圖就夠了。 */
let gFocus = '';
let gAllLimit = 20;   // 全部模式默认只列前 20 对，其余点按钮展开

/* 把 LINKS 依「課題對」聚合 → [{a,b,n,items[]}]，同課題內的不算（筆記頁已有） */
function topicPairs(){
  const m = {};
  LINKS.forEach(l=>{
    const A = PMAP[l.from], B = PMAP[l.to];
    if(!A || !B) return;
    const ka = A.t.id, kb = B.t.id;
    if(ka === kb) return;
    const k = [ka,kb].sort().join('|');
    if(!m[k]) m[k] = {a:ka, b:kb, n:0, items:[]};
    m[k].n++;
    m[k].items.push(l);
  });
  return Object.values(m);
}

/* 一个知识点 → 可点击的按钮（跳到该知识点的笔记位置） */
function lkPointBtn(pid){

/* 一對課題：可展開的 <details>，展開後列出每一條串連 */
function lkPairHTML(p, open){

/* 星形圖：中心＝本課題，外圈＝有關聯的課題。
   因為邊全部從中心放射出去，幾何上不可能交叉，這正是它比力導向佈局好的地方。 */
function lkStarSVG(tid, mine){
  const W = 720, H = 480, cx = W/2, cy = H/2;
  const shown = mine.slice(0, 8);
  const n = shown.length;
  const rx = n <= 4 ? 175 : 265, ry = n <= 4 ? 120 : 165;
  const T = TMAP[tid];
  const total = mine.reduce((a,x)=>a+x.n, 0);

  let out = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="課題關聯星形圖">';
  // 先畫邊，讓節點壓在上面
  shown.forEach((it,i)=>{
    const ang = (-90 + i*360/n) * Math.PI/180;
    it._x = cx + rx*Math.cos(ang);
    it._y = cy + ry*Math.sin(ang);
    const w = Math.min(6, 1.2 + it.n*0.7);
    out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+it._x.toFixed(1)+'" y2="'+it._y.toFixed(1)
        + '" stroke-width="'+w.toFixed(1)+'"/>';
  });
  // 外圈節點 + 標籤
  shown.forEach(it=>{
    const P = TMAP[it.peer];
    const r = 14 + Math.min(11, it.n*1.5);
    const name = P.title.length > 7 ? P.title.slice(0,6)+'…' : P.title;
    /* 標籤一律放在圓點外側：下半圈放下面、上半圈放上面。
       之前上半圈用 ly+14 放「N 條」，結果正好落進圓點裡被蓋住。 */
    const below = it._y > cy;
    const ly = below ? it._y + r + 18 : it._y - r - 26;
    out += '<circle class="lkpeer" cx="'+it._x.toFixed(1)+'" cy="'+it._y.toFixed(1)
        + '" r="'+r.toFixed(1)+'" fill="'+colorOf(it.peer)+'" onclick="go(\'#/'+SUB.id+'/graph/'+it.peer+'\')">'
        + '<title>'+esc(P.title)+'：'+it.n+' 條串連（點擊切換到這個課題）</title></circle>';
    out += '<text x="'+it._x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+esc(name)+'</text>';
    out += '<text class="sub" x="'+it._x.toFixed(1)+'" y="'+(ly+14).toFixed(1)+'" text-anchor="middle">'+it.n+' 條</text>';
  });
  // 中心節點
  out += '<circle class="lkcenter" cx="'+cx+'" cy="'+cy+'" r="42" fill="'+colorOf(tid)+'"/>';
  out += '<text class="lkctr" x="'+cx+'" y="'+(cy+62)+'" text-anchor="middle">'+esc(T.title)+'</text>';
  out += '<text class="sub" x="'+cx+'" y="'+(cy+80)+'" text-anchor="middle">'+total+' 條對外串連</text>';
  out += '</svg>';
  return out;
}

/* 聚焦模式的主体：星形圖 + 每對課題的明細 */
function lkFocusBody(tid, pairs){
  const T = TMAP[tid];
  const mine = pairs
    .filter(p=>p.a===tid || p.b===tid)
    .map(p=>({peer: p.a===tid ? p.b : p.a, n:p.n, items:p.items}))
    .sort((x,y)=> y.n - x.n || (String(x.peer) < String(y.peer) ? -1 : 1));

  if(!mine.length){
    return '<div class="empty">這個課題的知識點目前沒有標註跨課題串連。<br>'
      + '可以到筆記頁看它與本科其他章節的關聯（每個知識點下方都有）。</div>';
  }
  const total = mine.reduce((a,x)=>a+x.n, 0);
  const capped = mine.length > 8;
  return '<div class="lkstar">'+lkStarSVG(tid, mine)+'</div>'
    + (capped ? '<div class="tmeta" style="margin:-6px 0 12px">圖中只畫出關聯最多的 8 個課題，'
        + '完整的 '+mine.length+' 個見下方清單。</div>' : '')
    + '<div class="tmeta" style="margin:0 0 14px">共 <b>'+total+'</b> 條對外串連，涉及 <b>'+mine.length+'</b> 個課題。'
    + '點圓點可切換過去；下方每一條都寫明「從哪個知識點到哪個知識點、為什麼有關」，點名稱直接跳到筆記。</div>'
    + mine.map((x,i)=>lkPairHTML({a:tid, b:x.peer, n:x.n, items:x.items}, i===0)).join('');
}

function viewGraph(focus){
  navOn('graph');
  if(needsContent()) return;
  if(focus !== undefined) gFocus = focus || '';
  if(gFocus && !TMAP[gFocus]) gFocus = '';

  const pairs = topicPairs();
  const degOf = {};
  pairs.forEach(p=>{ degOf[p.a] = (degOf[p.a]||0) + p.n; degOf[p.b] = (degOf[p.b]||0) + p.n; });

  /* 按對外關聯數從多到少排，讓「最值得一起複習的課題」排在最前面 */
  const chipOrder = TOPICS.slice().sort((a,b)=>(degOf[b.id]||0)-(degOf[a.id]||0));
  const chips = chipOrder.map(t=>{
    const d = degOf[t.id] || 0;

    return '<button class="chip'+(on?' on':'')+'" onclick="go(\'#/'+SUB.id+'/graph/'+t.id+'\')"'
      + ' title="'+d+' 條對外串連">'
      + '<i class="lkcdot" style="background:'+colorOf(t.id)+'"></i>'+esc(t.title)
      + '<b>'+d+'</b></button>';
  }).join('');

  let body;
  if(gFocus){
    body = lkFocusBody(gFocus, pairs);
  }else if(!pairs.length){
    body = '<div class="empty">這個科目目前沒有標註跨課題的知識串連。<br>'
      + '（筆記頁每個知識點下方仍會顯示同課題內的相關知識點。）</div>';
  }else{
    const sorted = pairs.slice().sort((a,b)=> b.n - a.n || (String(a.a) < String(b.a) ? -1 : 1));
    const shown = sorted.slice(0, gAllLimit);
    body = '<h3 class="lk-h">關聯最緊密的課題對 <span>共 '+pairs.length+' 對</span></h3>'
      + '<div class="tmeta" style="margin:0 0 12px">數字＝兩個課題之間人工標註的知識串連條數。'
      + '點一列展開，看每一條串連是從哪個知識點到哪個知識點、為什麼有關。</div>'
      + '<div class="lkrank">'+shown.map(p=>lkPairHTML(p, false)).join('')+'</div>'
      + (sorted.length > shown.length
          ? '<div style="text-align:center;margin:14px 0"><button class="ppmore" onclick="gAllLimit=99999;viewGraph()">'
            + '顯示其餘 '+(sorted.length-shown.length)+' 對 ▾</button></div>'
          : '');
  }

  app.innerHTML = '<div class="view">'
    + '<div class="thead">'
    +   '<button class="back" onclick="go(\'#/home\')">← 返回首頁</button>'
    +   '<h2>🕸️ '+(gFocus ? esc(TMAP[gFocus].title)+' 的關聯' : esc(SUB.title)+' 關聯地圖')+'</h2>'
    +   (gFocus ? '<button class="qbtn" style="margin-left:0" onclick="go(\'#/'+SUB.id+'/graph\')">看全部課題</button>' : '')
    + '</div>'
    + '<div class="tmeta">'+(gFocus
        ? '中心是這個課題，外圈是與它有知識串連的其他課題；線越粗＝串連越多。'
        : '先選一個課題看它的星形關聯圖，或直接看下面的關聯排行。')+'</div>'
    + '<div class="chips">'+chips+'</div>'
    + body
    + '</div>';
}

/* ---------------- quiz ---------------- */
let QZ=null; // active session
function startQuiz(scope){
  let pool=[];
  const W=wrongSet();
  if(scope.mode==='all')pool=allQuestions();
  else if(scope.mode==='topic')pool=(QUIZ[scope.id]||[]).map(q=>Object.assign({topic:scope.id},q));
  else if(scope.mode==='unit'){
    // 整個子分區（單元）：把單元內所有課題的題目合起來
    const u=UNITS.find(x=>x.id===scope.id);
    const ids=(u&&u.topics)||[];
    pool=ids.reduce((acc,tid)=>acc.concat((QUIZ[tid]||[]).map(q=>Object.assign({topic:tid},q))),[]);
  }
  else if(scope.mode==='point')pool=allQuestions().filter(q=>q.point===scope.id);
  else if(scope.mode==='wrong')pool=allQuestions().filter(q=>W.has(q.id));
  else if(scope.mode==='wrongtopic')pool=(QUIZ[scope.id]||[]).map(q=>Object.assign({topic:scope.id},q)).filter(q=>W.has(q.id));
  else if(scope.mode==='points'){
    const set=new Set(scope.ids||[]);
    pool=allQuestions().filter(q=>q.point&&set.has(q.point));
  }
  else if(scope.mode==='topics'){
    /* 自由組合測驗：勾選任意幾個課題，把它們的題目合起來考。
       科目本身是隔離的（QUIZ 只含當前科目），所以不會混到別科。
       scope.n 可選：指定抽 n 題；不給就全部。 */
    const ids=scope.ids||[];
    let src=ids.reduce((acc,tid)=>acc.concat((QUIZ[tid]||[]).map(q=>Object.assign({topic:tid},q))),[]);
    if(scope.onlyWrong) src=src.filter(q=>W.has(q.id));
    if(scope.n){
      const n=Math.max(1,Math.min(parseInt(scope.n,10)||10,src.length));
      src=shuffle(src).slice(0,n);
    }
    pool=src;
  }
  else if(scope.mode==='random'){
    // 隨機抽題：源池（全部／錯題／指定課題）先洗牌再截取 n 題
    let src;
    if(scope.from==='wrong')src=allQuestions().filter(q=>W.has(q.id));
    else if(scope.from&&scope.from!=='all')src=(QUIZ[scope.from]||[]).map(q=>Object.assign({topic:scope.from},q));
    else src=allQuestions();
    const n=Math.max(1,Math.min(parseInt(scope.n,10)||10,src.length));
    pool=shuffle(src).slice(0,n);
  }
  if(!pool.length){go('#/quiz');setTimeout(()=>{const el=document.getElementById('qempty');if(el)el.style.display='block';},80);return;}
  pool=shuffle(pool);
  QZ={pool,i:0,score:0,answered:false,log:[]};
  go('#/run');
  if((location.hash||'').indexOf('/run')>=0)renderQ();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- 測驗範圍：直接在課題列表勾選 ----------------

   科目隔離：QUIZ 只含當前科目題目，勾不到別科。 */
let COMBO={ids:[]};
function quizPicks(){ return [...document.querySelectorAll('.qpickwrap input[type=checkbox]')]; }
function quizPicked(){ return quizPicks().filter(b=>b.checked).map(b=>b.value); }
function quizPickCount(ids){
  return ids.reduce((a,tid)=>a+((QUIZ[tid]||[]).length),0);
}
function quizPickWrong(ids){
  const W=wrongSet();
  return ids.reduce((a,tid)=>a+(QUIZ[tid]||[]).filter(q=>W.has(q.id)).length,0);

function quizPickChanged(){
  const ids=quizPicked();
  COMBO.ids=ids;
  // 卡片選中態（.on）與勾選框同步，點卡片空白處也能選
  document.querySelectorAll('.qpick').forEach(card=>{
    const b=card.querySelector('input[type=checkbox]');
    card.classList.toggle('on',!!(b&&b.checked));
  });
  const onlyWrong=!!(document.getElementById('pickwrong')&&document.getElementById('pickwrong').checked);
  const total=onlyWrong?quizPickWrong(ids):quizPickCount(ids);
  const nEl=document.getElementById('pickn');
  const want=nEl?parseInt(nEl.value,10):0;

  // 底部浮動操作條：只在有勾選時出現
  let bar=document.getElementById('pickbar');
  if(!ids.length){
    if(bar) bar.remove();
    return;
  }
  const names=ids.map(tid=>(TMAP[tid]&&TMAP[tid].title)||tid);
  const brief=names.length<=2?names.join('、'):(names.slice(0,2).join('、')+' 等 '+names.length+' 個');
  let txt='已選 '+ids.length+' 個課題（'+brief+'）· 共 '+total+' 題';
  if(want>0&&want<total) txt+='，抽 '+want+' 題';
  if(!bar){
    bar=document.createElement('div');
    bar.id='pickbar';
    bar.className='pickbar';
    bar.innerHTML='<span class="pickbar-t" id="pickbar-t"></span>'

function quizPickAll(on){

function renderQ(){

function explain(ok,q,extra){
  const e=document.getElementById('expl');
  const correct=q.type==='mc'?(q.options||[])[q.answer]:q.type==='tf'?(q.answer?'正確':'錯誤'):(Array.isArray(q.answer)?q.answer[0]:q.answer);
  e.className='expl show '+(ok?'good':'bad');
  const nd=QZ.nextDue;
  const dueLine=nd?'<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">📅 這個知識點 '+fmtDue(nd.due)+' 再複習一次</div>':'';
  // 題解走 mdLite：quiz 資料裡有些題解寫了 **粗體**、換行、列表（esc 會讓它們原樣顯示）
  e.innerHTML=(ok?'<strong>✅ 答對了！</strong>':'<strong>❌ 不對喔。</strong> 正確答案：<code>'+esc(correct==null?'—':correct)+'</code>')+(extra?'<br>'+extra:'')+
    (q.explanation?'<div style="margin-top:6px" class="md">'+mdLite(q.explanation)+'</div>':'')+
    (q.point&&PMAP[q.point]?'<div style="margin-top:6px">📖 相關知識點：<button class="pipopen" onclick="openPip(\''+q.point+'\')">'+esc(PMAP[q.point].p.title)+'</button> <span style="font-size:12.5px;color:var(--muted)">畫中畫開啟，測驗進度不會丟</span></div>':'')+
    dueLine;
  const nb=document.getElementById('nextbtn'); if(nb)nb.style.display='inline-block';
}
function finishOne(q,ok){
  QZ.score+=ok?1:0;
  QZ.log.push({id:q.id,ok:ok,q:q.q,point:q.point});
  QZ.nextDue=null;
  touchDay();
  if(q.point){
    bumpAttempt(q.point,ok);
    var r=scheduleReview(q.point,ok);
    QZ.nextDue={pid:q.point,due:r.due,box:r.box};
  }
  if(ok)markRight(q.id);else markWrong(q.id);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  QZ.answered=true;
  updateNavBadge();
}
function answerMc(idx){
  if(QZ.answered)return;
  const q=QZ.pool[QZ.i];
  const ans=q.type==='tf'?(q.answer?0:1):q.answer;
  const ok=idx===ans;
  document.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;
    if(i===ans)b.classList.add('right');
    else if(i===idx)b.classList.add('wrong');
  });
  finishOne(q,ok);
  explain(ok,q);
}
function norm(s){
  return String(s).toLowerCase().replace(/\s+/g,'').replace(/[（）()，,。.:：;；]/g,'')
    .replace(/[０-９ａ-ｚＡ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
function answerFill(){
  if(QZ.answered)return;
  const q=QZ.pool[QZ.i];
  const inp=document.getElementById('fillin');
  const val=inp.value;
  if(!val.trim()){inp.focus();return;}
  const alts=(Array.isArray(q.answer)?q.answer:[q.answer]).map(norm);
  const ok=alts.includes(norm(val));
  inp.disabled=true;
  finishOne(q,ok);
  explain(ok,q,ok?'':'你答：<code>'+esc(val)+'</code>');
}

/* ---------- 練習作答（離線自評）----------
   站點是純離線單檔案，沒有後端，所以「老師怎麼改」只能這樣近似：
   把每道小題的得分點濃縮成關鍵概念詞，檢查學生作答有沒有提到。
   —— 不要求用字與參考答案相同，同義詞、子串、自己的話都算。      */
function lqById(id){
  let r=null;
  (lqAll()||[]).forEach(q=>{ if(q.id===id) r=q; });
  return r;
}
function lqNorm(s){
  return String(s||'').replace(/[\s，。、：；！？（）()「」『』“”‘’"'·\-—…]/g,'').toLowerCase();
}
function lqHit(cands,txt){
  for(let i=0;i<cands.length;i++){
    const w=lqNorm(cands[i]);
    if(w.length>=2 && txt.indexOf(w)>=0) return true;
  }
  return false;
}
/* ──「關係／方向」判定 ──────────────────────────────────────────────
   DSE 長題目的得分點要的是**一條完整陳述**（誰上升、誰下降、兩者什麼關係），
   光把「尿液排泄量」「鈉濃度」這些名詞列出來**不給分**；
   只寫「有變化／有影響」這種沒指出方向的**也不給分**。
   所以判分時除了概念詞，還要檢查作答有沒有寫出得分點要求的方向。     */
const REL_UP=('上升 升高 增加 增多 增大 變大 變高 加快 提高 較高 越高 愈高 越大 愈大 '
 +'越多 愈多 越快 愈快 越強 愈強 最大 最高 較多 較快 較大 正比 正相關 促進 活化 '
 +'刺激 擴大 回升 大於 高於 多於 快於').split(' ');
const REL_DOWN=('下降 降低 減少 減小 變小 變低 減慢 放緩 較低 越低 愈低 越小 愈小 '
 +'越少 愈少 越慢 愈慢 越弱 愈弱 最小 最低 較少 較慢 較小 反比 負相關 抑制 受阻 '
 +'減弱 萎縮 下跌 回落 小於 低於 少於 慢於').split(' ');
const REL_ANY=('導致 引起 造成 因此 因而 故此 由於 改變 變化 差異 相比 比較 相關 '
 +'趨勢 模式 依次 關係 影響 取決於 隨着 隨著').split(' ');
// 只覆盖方向词里会出现的简体字 —— 让学生写简体也能识别
const S2T={减:'減',变:'變',较:'較',来:'來',说:'說',过:'過',还:'還',应:'應',关:'關',
 响:'響',导:'導',随:'隨',着:'著',趋:'趨',势:'勢',异:'異',强:'強',长:'長',进:'進',
 扩:'擴',抑:'抑',缩:'縮',涨:'漲',较:'較',级:'級',两:'兩',个:'個',这:'這'};
function lqT2S(s){
  return String(s||'').replace(/[减变较来说过还应关响导随著趋势异强长进扩抑缩涨级两个这]/g,
    function(c){ return S2T[c]||c; });
}
function lqHas(ws,txt){
  for(let i=0;i<ws.length;i++) if(txt.indexOf(ws[i])>=0) return true;
  return false;
}
/* 回傳 {ok, why}
   m 為得分點要求的關係型態：
     inv   反向對比（A 越高、B 越少）→ 兩個方向都要寫到
     up    要寫出上升／變大
     down  要寫出下降／變小
     chain 因果鏈（滲透壓升高 → 釋放 ADH → 尿量減少）→ 寫出任一段，但仍要有方向詞
     any   得分點本身無方向，有因果／比較措辭即可
     null  純名詞型得分點，不要求關係                                        */
function lqRelState(m,R){
  if(!m) return {ok:true,why:''};
  if(m==='inv'){
    if(R.u&&R.d) return {ok:true,why:''};
    if(R.u||R.d) return {ok:false,why:'只寫了一邊的方向 —— 這題是「一個上升、另一個下降」，<b>兩邊都要寫</b>。'};
    return {ok:false,why:R.a?'你寫了「有變化／有影響」，但<b>沒指出具體是上升還是下降</b> —— 這種中性寫法 DSE 不給分。':'還沒寫出它的變化方向。'};
  }
  if(m==='up'||m==='down'){
    const want=m==='up', yes=want?R.u:R.d, rev=want?R.d:R.u;
    if(yes) return {ok:true,why:''};
    if(rev) return {ok:false,why:'方向寫反了 —— 這題要的是'+(want?'<b>上升／變大</b>':'<b>下降／變小</b>')+'。'};
    return {ok:false,why:R.a
      ?'你寫了「有變化／有影響」，但<b>沒指出是'+(want?'上升':'下降')+'還是'+(want?'下降':'上升')+'</b> —— 中性寫法不給分。'
      :'還沒寫出它的變化方向（'+(want?'上升／變大':'下降／變小')+'）。'};
  }
  if(m==='chain'){
    if(R.u||R.d) return {ok:true,why:''};
    return {ok:false,why:R.a?'你寫了「有變化／有影響」，但<b>沒指出具體的變化方向</b> —— 中性寫法不給分。':'還沒寫出它的變化方向。'};
  }
  return (R.u||R.d||R.a)?{ok:true,why:''}:{ok:false,why:'還沒寫出兩者之間的關係。'};
}
function lqTogglePrac(btn){
  const card=btn.closest('.lq-card');
  const box=card.querySelector('.lq-prac');
  if(!box) return;
  const open=!box.classList.contains('on');
  box.classList.toggle('on',open);
  btn.classList.toggle('open',open);
  btn.querySelector('.lq-btn-i').textContent=open?'▴':'▾';
  if(open){
    // 還原先前寫過的答案
    const s=STORE.get(); const saved=(s.lqans||{})[card.dataset.id]||{};
    box.querySelectorAll('.lq-prac-item').forEach(it=>{

function lqVerdict(n,m,empty,near){
  if(m<=0) return {cls:'',t:'老師點評：這題暫時沒有可核對的得分點，直接對照參考答案吧。'};
  if(empty) return {cls:'low',t:'老師點評：空白是長題目最致命的失分 —— 哪怕只寫出兩三個關鍵詞，也比留白好。'};
  if(n>=m) return {cls:'good',t:'老師點評：這題的得分點你都寫到了，答得很完整。接著可以對照參考答案，看看用字是否更精準、因果鏈是否更順。'};
  // 「提到概念但沒寫出方向」是最需要點破的情況 —— 學生常以為寫到名詞就有分
  if(n<=0&&near>0) return {cls:'low',
    t:'老師點評：你提到了 '+near+' 個得分點的「概念」，但<b>都只寫出名詞，沒寫出變化／關係</b>。'
     +'DSE 長題目要的是「誰上升、誰下降」這種完整陳述；'
     +'只列「尿液排泄量」「鈉濃度」這類關鍵詞，或只寫「有變化／有影響」，'
     +'改卷時都是<b>不給分</b>的。按下面的提示把方向補上。'};
  if(n<=0) return {cls:'low',t:'老師點評：你寫的方向似乎還沒碰到這題的得分點。建議先回到題目，圈出它在問什麼（為什麼？如何？比較？），再按提示想想該用哪個概念。'};
  const r=n/m;
  if(r>=0.6) return {cls:'mid',t:'老師點評：方向對了，但還有 '+(m-n)+' 個得分點沒觸及'
    +(near>0?'（其中 '+near+' 個你提到了概念，只是還沒寫出變化方向）':'')
    +'。DSE 長題目是按點給分，漏一個就少一分。'};
  return {cls:'low',t:'老師點評：只觸及 '+n+'/'+m+' 個得分點'
    +(near>0?'，另有 '+near+' 個提到概念但未寫完整':'')
    +'。先回到題目，想清楚它問的是「為什麼」還是「如何」，再把因果鏈寫完整。'};
}
function lqEval(item,withHint){
  const card=item.closest('.lq-card');
  const q=lqById(card.dataset.id);
  if(!q) return null;
  const i=+item.dataset.i;
  const sub=(q.subqs||[])[i];
  if(!sub) return null;
  const pts=sub.points||[];
  const rels=sub.pointRel||[];
  const raw=((item.querySelector('textarea')||{}).value)||'';
  const txt=lqNorm(raw);
  // 關係詞要在「簡體已轉繁體」的文本上找，學生寫「减少」才認得到「減少」
  const rt=lqNorm(lqT2S(raw));
  const R={u:lqHas(REL_UP,rt),d:lqHas(REL_DOWN,rt),a:lqHas(REL_ANY,rt)};
  // 逐得分點：先比概念，概念中了再比「關係／方向」
  const st=pts.map(function(c,k){
    const rel=(rels[k]||{}).m;
    if(!lqHit(c,txt)) return {s:'miss',c:c,why:'',rel:rel};
    const rs=lqRelState(rel,R);
    return rs.ok?{s:'hit',c:c,why:'',rel:rel}:{s:'near',c:c,why:rs.why,rel:rel};
  });
  const m=pts.length;
  const n=st.filter(function(x){return x.s==='hit';}).length;
  const near=st.filter(function(x){return x.s==='near';});
  const miss=st.filter(function(x){return x.s==='miss';});
  const v=lqVerdict(n,m,!raw.trim(),near.length);
  const lvl=+item.dataset.hint||0;
  let hintHtml='';
  if(withHint&&m>0){
    // 提示排成**一條連續的隊列**：先把「提到概念但缺方向」的補完
    // （這比再丟一個新概念有用），補完才給還沒碰到的概念。
    const queue=near.concat(miss);
    if(!queue.length){
      hintHtml=`<div class="lq-fb-h">這題的得分點你都寫到了，不需要提示了。</div>`;
    }else if(lvl<queue.length){
      const it=queue[lvl], no=`<div class="lq-fb-h">💡 提示 ${lvl+1}/${queue.length}：`;
      if(lvl<near.length){
        hintHtml=no+it.why+`</div>`;
      }else{
        // 提示要給「最有資訊量」的那個詞 —— 候選詞裡最長的通常最像完整概念，
        // 短的碎片（如「三組」）單看沒有指引作用。
        // ⚠️ 若該得分點還要求變化方向，提示必須一併講清楚，
        // 否則學生照著提示寫完概念仍拿不到分，提示就自相矛盾了。
        const kw=it.c.slice().sort((a,b)=>b.length-a.length)[0];
        const need=it.rel==='inv'
          ? '這題是「一個上升、另一個下降」，<b>兩個方向都要寫</b>。'
          : it.rel==='up' ? '還要寫出它<b>上升／變大</b>。'
          : it.rel==='down' ? '還要寫出它<b>下降／變小</b>。'
          : it.rel==='chain' ? '還要寫出<b>變化的方向</b>。'
          : '';
        hintHtml=no+`<b>${esc(kw)}</b> —— 順著這個概念，把它的原因或結果寫出來。`
          +(need?`<br>${need}`:'')+`</div>`;
      }
    }else{
      hintHtml=`<div class="lq-fb-h">提示都給完了 —— 這時直接看參考答案，
        然後蓋著答案再寫一次，效果最好。</div>`;
    }
  }
  const bar=m?`<div class="lq-fb-n">得分點：<b>${n} / ${m}</b>`
    +(near.length?`　｜　提到概念但未寫完整：<b>${near.length}</b> 個`:'')+`</div>`:'';
  return {cls:v.cls,html:`<div class="lq-fb-t">${v.t}</div>${bar}${hintHtml}`};
}

let ppLazyObs=null;
function ppLazyInit(){
  const imgs=document.querySelectorAll('#pp-bytopic img.pplazy[data-src]');
  if(!imgs.length)return;
  if(typeof IntersectionObserver==='undefined'){
    imgs.forEach(im=>{im.src=im.dataset.src;im.removeAttribute('data-src');});
    return;
  }
  if(ppLazyObs)ppLazyObs.disconnect();
  ppLazyObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting)return;
      const im=en.target;
      if(im.dataset.src){im.src=im.dataset.src;im.removeAttribute('data-src');}
      obs.unobserve(im);
    });
  },{rootMargin:'400px 0px'});
  imgs.forEach(im=>ppLazyObs.observe(im));
}
