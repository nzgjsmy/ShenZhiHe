<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="480" height="210" fill="#ffffff"/><rect x="40" y="60" width="140" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="110" y="96" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">熱水</text><text x="110" y="113.4" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">m₁ c₁ T₁</text><rect x="300" y="60" width="140" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="370" y="96" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">冷水</text><text x="370" y="113.4" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">m₂ c₂ T₂</text><line x1="190" y1="105" x2="290" y2="105" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><line x1="290" y1="105" x2="283.819" y2="108.286" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><line x1="290" y1="105" x2="283.819" y2="101.714" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><text x="240" y="88" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">放熱</text><text x="240" y="176" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">Q放 = Q吸　⇒　m₁c₁(T₁ − T) = m₂c₂(T − T₂)</text><text x="240" y="30" font-size="11.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">混合法：最終達熱平衡，高溫物體放出的熱 = 低溫物體吸收的熱</text></svg>