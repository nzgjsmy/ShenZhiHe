<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="520" height="220" fill="#ffffff"/><text x="260" y="24" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">平均加速度計算：a = (v − u) / t</text><rect x="30" y="50" width="460" height="46" rx="8" fill="#fbfdfd" stroke="#c9c2b3" stroke-width="1.4"/><text x="52" y="79" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">(a)</text><text x="84" y="79" font-size="11.5" fill="#2b2a26" text-anchor="start" font-weight="normal">u = 0 → v = 20 m s⁻¹，t = 4 s</text><text x="478" y="79" font-size="11.5" fill="#b91c1c" text-anchor="end" font-weight="bold">a = 20/4 = 5 m s⁻²</text><rect x="30" y="104" width="460" height="46" rx="8" fill="#fbfdfd" stroke="#c9c2b3" stroke-width="1.4"/><text x="52" y="133" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">(b)</text><text x="84" y="133" font-size="11.5" fill="#2b2a26" text-anchor="start" font-weight="normal">u = 15 → v = 5 m s⁻¹，t = 2 s</text><text x="478" y="133" font-size="11.5" fill="#b91c1c" text-anchor="end" font-weight="bold">a = (5−15)/2 = −5 m s⁻²</text><rect x="30" y="158" width="460" height="46" rx="8" fill="#fbfdfd" stroke="#c9c2b3" stroke-width="1.4"/><text x="52" y="187" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">(c)</text><text x="84" y="187" font-size="11.5" fill="#2b2a26" text-anchor="start" font-weight="normal">u = 8 → v = 8 m s⁻¹，t = 3 s</text><text x="478" y="187" font-size="11.5" fill="#b91c1c" text-anchor="end" font-weight="bold">a = 0（勻速）</text><text x="260" y="212" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">注意：減速時 a 為負值；勻速時 a = 0</text></svg>