<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="600" height="380" fill="#ffffff"/><text x="300" y="24" font-size="13.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">量度冰的熔解比潛熱（對照裝置法）</text><rect x="36" y="50" width="88" height="32" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/><circle cx="108" cy="66" r="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/><text x="68" y="70" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">焦耳計</text><polygon points="70,100 150,100 130,168 90,168" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="112" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="95" cy="118" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="110" cy="112" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="125" cy="120" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="140" cy="112" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="95" cy="150" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="110" cy="156" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="125" cy="150" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><rect x="92" y="128" width="36" height="16" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.6"/><line x1="75" y1="82" x2="110" y2="128" stroke="#b45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3"/><text x="64" y="136" font-size="10.5" fill="#b45309" text-anchor="end" font-weight="bold">電熱器</text><line x1="66" y1="132" x2="90" y2="134" stroke="#b45309" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/><polygon points="210,100 290,100 270,168 230,168" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="220" cy="115" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="235" cy="120" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="250" cy="112" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="265" cy="120" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="280" cy="115" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="232" cy="150" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="240" cy="156" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="244" cy="150" r="3.2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><circle cx="105" cy="180" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><circle cx="117" cy="190" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><circle cx="107" cy="200" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><circle cx="245" cy="180" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><circle cx="257" cy="190" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><circle cx="247" cy="200" r="2.2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><rect x="78" y="210" width="64" height="60" rx="5" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2"/><rect x="80" y="238" width="60" height="30" rx="0" fill="#dbeafe" stroke="none" stroke-width="1.5"/><text x="110" y="288" font-size="10.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">燒杯（實驗）</text><text x="110" y="304" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">增加的水 = m<tspan dy="2.2" font-size="72%">B</tspan></text><rect x="218" y="210" width="64" height="60" rx="5" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2"/><rect x="220" y="238" width="60" height="30" rx="0" fill="#dbeafe" stroke="none" stroke-width="1.5"/><text x="250" y="288" font-size="10.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">燒杯（對照）</text><text x="250" y="304" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">增加的水 = m<tspan dy="2.2" font-size="72%">A</tspan></text><rect x="330" y="60" width="255" height="240" rx="10" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.6"/><text x="457" y="84" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">計算流程</text><text x="346" y="112" font-size="10.5" fill="#2b2a26" text-anchor="start" font-weight="bold">① 焦耳計讀數變化 = Q</text><text x="346" y="140" font-size="10.5" fill="#2b2a26" text-anchor="start" font-weight="normal">② 兩個燒杯各自「實驗後 − 實驗前」：</text><text x="360" y="160" font-size="10.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">實驗燒杯增加 = m<tspan dy="2.2" font-size="72%">B</tspan></text><text x="360" y="176" font-size="10.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">對照燒杯增加 = m<tspan dy="2.2" font-size="72%">A</tspan></text><text x="346" y="206" font-size="10.5" fill="#2b2a26" text-anchor="start" font-weight="bold">③ 經電熱器熔化的冰的質量</text><text x="360" y="226" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="bold">= m<tspan dy="2.2" font-size="72%">B</tspan> − m<tspan dy="2.2" font-size="72%">A</tspan></text><text x="346" y="258" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="bold">④ l<tspan dy="2.2" font-size="72%">f</tspan> = Q / (m<tspan dy="2.2" font-size="72%">B</tspan> − m<tspan dy="2.2" font-size="72%">A</tspan>)</text><text x="300" y="350" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="normal">對照裝置的作用：扣掉「從周圍環境吸熱而熔化」的冰，讓 Q 只對應電熱器真正熔化的冰</text></svg>