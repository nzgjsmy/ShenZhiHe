<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="460" height="240" fill="#ffffff"/><polygon points="160,50 300,50 250,120 210,120" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="230" y="78" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">冰 + 水</text><rect x="150" y="150" width="160" height="70" rx="6" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2"/><rect x="152" y="176" width="156" height="42" rx="0" fill="#dbeafe" stroke="none" stroke-width="1.5"/><text x="230" y="200" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">熔化的水</text><text x="230" y="236" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">分別稱量：實驗前 m_A、實驗後 m_B</text><line x1="340" y1="60" x2="340" y2="110" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="340" y1="110" x2="336.714" y2="103.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="340" y1="110" x2="343.286" y2="103.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><text x="356" y="84" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="normal">電熱器</text><text x="230" y="30" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">熔解比潛熱 l_f = Q / (m_B − m_A)</text></svg>