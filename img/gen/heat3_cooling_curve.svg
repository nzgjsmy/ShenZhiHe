<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="600" height="300" fill="#ffffff"/><text x="300" y="24" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">冷卻曲線：物質 X 不斷冷卻（與加熱曲線鏡像）</text><line x1="60" y1="206" x2="374" y2="206" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="374" y1="206" x2="367.819" y2="209.286" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="374" y1="206" x2="367.819" y2="202.714" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="60" y1="206" x2="60" y2="42" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="60" y1="42" x2="63.2863" y2="48.1806" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="60" y1="42" x2="56.7137" y2="48.1806" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><text x="216" y="258" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">時間</text><text x="60" y="32" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">溫度 / °C</text><line x1="60" y1="68" x2="120" y2="98" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><line x1="120" y1="98" x2="175" y2="98" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><line x1="175" y1="98" x2="230" y2="160" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><line x1="230" y1="160" x2="285" y2="160" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><line x1="285" y1="160" x2="360" y2="198" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><text x="147" y="86" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="normal">冷凝平台（沸點 T₂）</text><text x="257" y="148" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="normal">凝固平台（熔點 T₁）</text><text x="78" y="226" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">氣</text><text x="172" y="226" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">氣+液</text><text x="236" y="226" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">液</text><text x="298" y="226" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">液+固</text><text x="360" y="226" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">固</text><rect x="392" y="56" width="190" height="176" rx="10" fill="#fbfdfd" stroke="#1d4ed8" stroke-width="1.6"/><text x="487" y="80" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">冷卻過程五階段</text><text x="408" y="106" font-size="11" fill="#7a756a" text-anchor="start" font-weight="normal">①</text><text x="426" y="106" font-size="11" fill="#2b2a26" text-anchor="start" font-weight="normal">氣態變冷</text><text x="566" y="106" font-size="9.5" fill="#7a756a" text-anchor="end" font-weight="normal">溫度下降</text><text x="408" y="132" font-size="11" fill="#7a756a" text-anchor="start" font-weight="normal">②</text><text x="426" y="132" font-size="11" fill="#2b2a26" text-anchor="start" font-weight="normal">冷凝</text><text x="566" y="132" font-size="9.5" fill="#7a756a" text-anchor="end" font-weight="normal">沸點 T₂（氣+液）</text><text x="408" y="158" font-size="11" fill="#7a756a" text-anchor="start" font-weight="normal">③</text><text x="426" y="158" font-size="11" fill="#2b2a26" text-anchor="start" font-weight="normal">液態變冷</text><text x="566" y="158" font-size="9.5" fill="#7a756a" text-anchor="end" font-weight="normal">溫度下降</text><text x="408" y="184" font-size="11" fill="#7a756a" text-anchor="start" font-weight="normal">④</text><text x="426" y="184" font-size="11" fill="#2b2a26" text-anchor="start" font-weight="normal">凝固</text><text x="566" y="184" font-size="9.5" fill="#7a756a" text-anchor="end" font-weight="normal">熔點 T₁（液+固）</text><text x="408" y="210" font-size="11" fill="#7a756a" text-anchor="start" font-weight="normal">⑤</text><text x="426" y="210" font-size="11" fill="#2b2a26" text-anchor="start" font-weight="normal">固態變冷</text><text x="566" y="210" font-size="9.5" fill="#7a756a" text-anchor="end" font-weight="normal">溫度下降</text><text x="300" y="284" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">物質不斷向周圍環境**放出**能量 → 整個過程能量不斷**減少**</text></svg>