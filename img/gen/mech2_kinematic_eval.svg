<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="520" height="240" fill="#ffffff"/><text x="260" y="24" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">運動方程計算（勻加速）</text><rect x="24" y="50" width="230" height="72" rx="10" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.5"/><text x="139" y="80" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">v = u + at</text><text x="139" y="104" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">（不含 缺 s）</text><rect x="274" y="50" width="230" height="72" rx="10" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.5"/><text x="389" y="80" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">s = ut + ½at²</text><text x="389" y="104" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">（不含 缺 v）</text><rect x="24" y="136" width="230" height="72" rx="10" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.5"/><text x="139" y="166" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">v² = u² + 2as</text><text x="139" y="190" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">（不含 缺 t）</text><rect x="274" y="136" width="230" height="72" rx="10" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.5"/><text x="389" y="166" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">s = ½(u+v)t</text><text x="389" y="190" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">（不含 缺 a）</text><text x="260" y="232" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">解題關鍵：按「已知／未知」選方程，避免解聯立</text></svg>