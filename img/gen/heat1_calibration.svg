<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 250" width="430" height="250" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="430" height="250" fill="#ffffff"/><line x1="70" y1="202" x2="334" y2="202" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="334" y1="202" x2="327.819" y2="205.286" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="334" y1="202" x2="327.819" y2="198.714" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="70" y1="202" x2="70" y2="48" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="70" y1="48" x2="73.2863" y2="54.1806" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><line x1="70" y1="48" x2="66.7137" y2="54.1806" stroke="#2b2a26" stroke-width="1.8" stroke-linecap="round"/><text x="201" y="236" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">液柱長度 L / cm</text><text x="60" y="38" font-size="14" fill="#2b2a26" text-anchor="end" font-weight="bold">溫度 T / °C</text><line x1="100" y1="178" x2="290" y2="74" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/><circle cx="100" cy="178" r="5" fill="#b91c1c"/><text x="114" y="172" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="normal">L₀ = 6 cm（0 °C）</text><circle cx="290" cy="74" r="5" fill="#b91c1c"/><text x="270" y="60" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="normal">L₁₀₀ = 21 cm（100 °C）</text><text x="215" y="28" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">校準圖：以兩個定點畫直線，再換算其他長度</text><rect x="290" y="170" width="130" height="56" rx="8" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.4"/><text x="355" y="190" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="normal">T / 100 =</text><text x="355" y="205.225" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="normal">(L − L₀)/(L₁₀₀ − L₀)</text></svg>