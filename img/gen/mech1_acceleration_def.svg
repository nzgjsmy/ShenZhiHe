<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="500" height="210" fill="#ffffff"/><rect x="30" y="50" width="190" height="120" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="125" y="76" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">初速度 u</text><line x1="60" y1="118" x2="130" y2="118" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="118" x2="123.819" y2="121.286" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="118" x2="123.819" y2="114.714" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><text x="95" y="142" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">t = 0</text><rect x="280" y="50" width="190" height="120" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/><text x="375" y="76" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">末速度 v</text><line x1="300" y1="118" x2="440" y2="118" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><line x1="440" y1="118" x2="433.819" y2="121.286" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><line x1="440" y1="118" x2="433.819" y2="114.714" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><text x="370" y="142" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">t</text><text x="250" y="190" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">平均加速度 a = (v − u) / t　（單位 m s⁻²）</text><text x="250" y="26" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">加速度 = 速度的變化率（不是速度本身）</text></svg>