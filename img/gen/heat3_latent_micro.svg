<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="500" height="220" fill="#ffffff"/><rect x="30" y="50" width="200" height="120" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="130" y="78" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">升溫階段</text><text x="130" y="106" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">吸收能量 →</text><text x="130" y="128" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">分子動能 ↑</text><text x="130" y="150" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">溫度上升</text><rect x="270" y="50" width="200" height="120" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/><text x="370" y="78" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">物態變化階段</text><text x="370" y="106" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">吸收能量 →</text><text x="370" y="128" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">分子勢能 ↑</text><text x="370" y="150" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">溫度不變</text><text x="250" y="30" font-size="11.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">潛熱：能量用於拉開分子間距（勢能），不是加快運動（動能）</text></svg>