<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="500" height="220" fill="#ffffff"/><rect x="40" y="60" width="180" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="130" y="92" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">水 1 kg</text><text x="130" y="116" font-size="12" fill="#7a756a" text-anchor="middle" font-weight="normal">C = mc</text><text x="130" y="136" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">↑ 熱容量加倍</text><rect x="260" y="60" width="180" height="90" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="350" y="92" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">水 2 kg</text><text x="350" y="116" font-size="12" fill="#7a756a" text-anchor="middle" font-weight="normal">C = mc</text><text x="350" y="136" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">↑ 熱容量加倍</text><text x="250" y="30" font-size="12" fill="#2b2a26" text-anchor="middle" font-weight="bold">熱容量 C 隨質量增加；比熱容量 c 是物質特性（不隨質量變）</text><rect x="60" y="172" width="380" height="36" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.5"/><text x="250" y="196" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">C = Q/ΔT　　c = Q/(mΔT)　　Q = mcΔT</text></svg>