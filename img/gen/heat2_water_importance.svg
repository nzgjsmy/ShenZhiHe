<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="520" height="200" fill="#ffffff"/><rect x="20" y="44" width="152" height="116" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="96" y="84" font-size="30" fill="#2b2a26" text-anchor="middle" font-weight="normal">🌊</text><text x="96" y="116" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">海洋調節氣候</text><text x="96" y="140" font-size="9.5" fill="#7a756a" text-anchor="middle" font-weight="normal">吸放大量熱而溫度變化小</text><rect x="182" y="44" width="152" height="116" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="258" y="84" font-size="30" fill="#2b2a26" text-anchor="middle" font-weight="normal">🚗</text><text x="258" y="116" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">汽車冷卻劑</text><text x="258" y="140" font-size="9.5" fill="#7a756a" text-anchor="middle" font-weight="normal">帶走引擎大量熱</text><rect x="344" y="44" width="152" height="116" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="420" y="84" font-size="30" fill="#2b2a26" text-anchor="middle" font-weight="normal">♨️</text><text x="420" y="116" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">熱水袋</text><text x="420" y="140" font-size="9.5" fill="#7a756a" text-anchor="middle" font-weight="normal">放熱緩慢、持久</text><text x="260" y="26" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">水的高比熱容量（4200 J kg⁻¹ °C⁻¹）的應用</text></svg>