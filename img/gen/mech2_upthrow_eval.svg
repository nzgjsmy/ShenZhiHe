<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="540" height="260" fill="#ffffff"/><text x="270" y="24" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">上拋計算：月球 vs 地球（g 不同）</text><rect x="30" y="46" width="245" height="170" rx="12" fill="#fbfdfd" stroke="#1d4ed8" stroke-width="1.8"/><text x="152" y="72" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">地球</text><text x="152" y="96" font-size="11.5" fill="#7a756a" text-anchor="middle" font-weight="normal">g = 9.81 m s⁻²</text><text x="152" y="126" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="normal">同一初速 u 上拋：</text><text x="152" y="141.225" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="normal">最大高度 H = u²/(2g)</text><text x="152" y="156.45" font-size="10.5" fill="#1d4ed8" text-anchor="middle" font-weight="normal">飛行時間 T = 2u/g</text><text x="152" y="196" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="bold">g 較小 → H 較大、T 較長</text><rect x="295" y="46" width="245" height="170" rx="12" fill="#fbfdfd" stroke="#b45309" stroke-width="1.8"/><text x="417" y="72" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">月球</text><text x="417" y="96" font-size="11.5" fill="#7a756a" text-anchor="middle" font-weight="normal">g = 1.62 m s⁻²</text><text x="417" y="126" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="normal">同一初速 u 上拋：</text><text x="417" y="141.225" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="normal">最大高度 H = u²/(2g)</text><text x="417" y="156.45" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="normal">飛行時間 T = 2u/g</text><text x="417" y="196" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="bold">g 較小 → H 較大、T 較長</text><text x="270" y="242" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">月球重力小，同一初速拋得更高、留空更久</text></svg>