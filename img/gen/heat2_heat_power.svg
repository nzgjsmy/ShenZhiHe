<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="460" height="180" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="460" height="180" fill="#ffffff"/><rect x="40" y="50" width="120" height="90" rx="12" fill="#ffedd5" stroke="#b45309" stroke-width="2"/><text x="100" y="88" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">高溫物體</text><text x="100" y="105.4" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">（能量多）</text><line x1="180" y1="95" x2="270" y2="95" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="95" x2="263.819" y2="98.2863" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="95" x2="263.819" y2="91.7137" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><text x="225" y="80" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">熱 Q</text><rect x="290" y="50" width="120" height="90" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2"/><text x="350" y="88" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">低溫物體</text><text x="350" y="105.4" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">（能量少）</text><text x="230" y="168" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">功率 P = Q / t　（1 W = 1 J s⁻¹）</text><text x="230" y="28" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">熱是能量的轉移過程（不是物體「含有」熱）</text></svg>