<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 276" width="460" height="276" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="460" height="276" fill="#ffffff"/><text x="230" y="24" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">量度比熱容量：加熱已知質量，記錄溫升</text><rect x="140" y="96" width="170" height="124" rx="8" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2"/><rect x="152" y="108" width="146" height="100" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="225" y="188" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">水 + 金屬塊（m 已知）</text><text x="225" y="236" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">量熱器（隔熱杯）</text><rect x="182" y="52" width="10" height="106" rx="5" fill="#fff" stroke="#2b2a26" stroke-width="1.6"/><rect x="184" y="92" width="6" height="68" rx="0" fill="#e11d48" stroke="none" stroke-width="1.5"/><circle cx="187" cy="161" r="6.5" fill="#e11d48"/><line x1="170" y1="60" x2="181" y2="66" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/><text x="166" y="62" font-size="10.5" fill="#b91c1c" text-anchor="end" font-weight="normal">溫度計</text><line x1="256" y1="48" x2="256" y2="150" stroke="#2b2a26" stroke-width="2.2" stroke-linecap="round"/><line x1="248" y1="150" x2="264" y2="150" stroke="#2b2a26" stroke-width="3.2" stroke-linecap="round"/><line x1="268" y1="56" x2="259" y2="62" stroke="#7a756a" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/><text x="272" y="58" font-size="10.5" fill="#7a756a" text-anchor="start" font-weight="normal">攪拌棒</text><rect x="166" y="204" width="118" height="7" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.4"/><line x1="296" y1="208" x2="330" y2="200" stroke="#b45309" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/><text x="334" y="203" font-size="10" fill="#b45309" text-anchor="start" font-weight="normal">電熱器（P、t 已知）</text><rect x="312" y="60" width="140" height="56" rx="8" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.4"/><text x="382" y="84" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">Q = Pt = mcΔT</text><text x="382" y="99.95" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">c = Pt / (mΔT)</text><text x="230" y="262" font-size="10.5" fill="#7a756a" text-anchor="middle" font-weight="normal">攪拌使溫度均勻；隔熱杯減少熱量損失</text></svg>