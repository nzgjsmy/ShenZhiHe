<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="520" height="210" fill="#ffffff"/><rect x="30" y="60" width="200" height="110" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/><text x="130" y="86" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">金屬鍋</text><text x="130" y="112" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">自由電子多</text><text x="130" y="136" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">→ 導熱快</text><rect x="290" y="60" width="200" height="110" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="390" y="86" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">木柄／布料</text><text x="390" y="112" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">無自由電子</text><text x="390" y="136" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">→ 導熱慢（絕緣）</text><text x="260" y="30" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">傳導能力取決於是否有大量自由電子</text><text x="260" y="192" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">金屬 &gt; 非金屬固體 &gt; 液體 &gt; 氣體</text></svg>