<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="560" height="200" fill="#ffffff"/><rect x="16" y="30" width="170" height="140" rx="12" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.8"/><rect x="16" y="30" width="170" height="30" rx="12" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.5"/><text x="101" y="50" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">波義耳定律</text><text x="101" y="78" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">T 不變</text><text x="101" y="102" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">pV = 常數</text><text x="101" y="122" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">p₁V₁ = p₂V₂</text><text x="101" y="150" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">p–V 雙曲線</text><rect x="198" y="30" width="170" height="140" rx="12" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.8"/><rect x="198" y="30" width="170" height="30" rx="12" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.5"/><text x="283" y="50" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">氣壓定律</text><text x="283" y="78" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">V 不變</text><text x="283" y="102" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">p/T = 常數</text><text x="283" y="122" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">p₁/T₁ = p₂/T₂</text><text x="283" y="150" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">p–T 直線</text><rect x="380" y="30" width="170" height="140" rx="12" fill="#fbfdfd" stroke="#0f766e" stroke-width="1.8"/><rect x="380" y="30" width="170" height="30" rx="12" fill="#e6f3f1" stroke="#0f766e" stroke-width="1.5"/><text x="465" y="50" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">查理定律</text><text x="465" y="78" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">p 不變</text><text x="465" y="102" font-size="12.5" fill="#2b2a26" text-anchor="middle" font-weight="bold">V/T = 常數</text><text x="465" y="122" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">V₁/T₁ = V₂/T₂</text><text x="465" y="150" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">V–T 直線</text><text x="280" y="18" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">理想氣體三定律（都是 pV = nRT 的特例）</text></svg>