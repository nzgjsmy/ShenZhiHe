name: 科研時事更新

# 每天抓一次泛科學 RSS，有新內容才重建並部署。
#
# 已於 2026-10-30 手動觸發驗證通過：條目分類正確、部署後圖片無 404。
# 故打開 schedule，每天自動執行。
#
# 歷史提醒：本專案曾因 cp -rn 的 no-clobber 讓 39 張圖 404 很久沒人發現，
# 所以自動部署第一次一定要人工盯 —— 這次盯過了才開。
#
# ⚠️ schedule 只在「預設分支」上的 workflow 文件才會觸發。
#    本 repo 預設分支是 main（部署產物分支），所以本文件在 main 上也要有一份。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'    # UTC 22:17 = 香港時間 06:17，早上打開就是新的

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出源碼分支
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取科研時事（只用標準庫，無第三方依賴）
        run: python scripts/fetch_news.py

      # 翻譯端點會限流（2026-10-30 那批就整批落成英文、沒人發現）。
      # 這裡再跑一次補翻：已經翻好的不會動，只有仍是英文的會被補上。
      - name: 補翻未翻譯的英文條目
        run: python scripts/fetch_news.py --retranslate

      - name: 檢查是否有新內容
        id: diff
        run: |
          if git diff --quiet -- data/_news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新內容，本次跳過構建與部署"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "有新內容："
            git diff --stat -- data/_news.json
          fi

      - name: 提交數據變更回 source
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_news.json
          git commit -m "chore(news): 自動更新科研時事 $(date -u +%Y-%m-%d)"
          git push origin HEAD:source

      - name: 構建站點
        if: steps.diff.outputs.changed == 'true'
        run: |
          python site/build.py
          python site/prep_ghpages.py

      - name: 部署到 main
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用 worktree 單獨拿一份 main，不動當前工作區
          git worktree add --detach /tmp/deploy origin/main
          cd /tmp/deploy

          # ⚠️ --delete 會讓部署目錄與 gh-pages/ 完全一致，
          #    所以必須排除 .git 與 .github ——
          #    .github/workflows 是本工作流自己的家，被刪掉下次就不會跑了。
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/gh-pages/" /tmp/deploy/

          git add -A
          if git diff --cached --quiet; then
            echo "部署內容無變化，不提交"
            exit 0
          fi
          git commit -m "deploy: 科研時事自動更新 $(date -u +%Y-%m-%d)"
          git push origin HEAD:main

      - name: 結果摘要
        if: always()
        run: |
          echo "### 科研時事更新" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✅ 有新內容，已重建並部署" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏸️ 沒有新內容，本次未部署（保持原樣，不硬湊）" >> "$GITHUB_STEP_SUMMARY"
          fi
