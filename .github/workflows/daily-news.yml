name: 科研時事更新

# 每天抓一次泛科學 RSS，有新內容才重建並部署。
#
# ⚠️ 為什麼 schedule 先註解掉：
#    第一次上線時先只用 workflow_dispatch 手動觸發，確認「抓到的內容對、
#    構建沒問題、部署後圖片沒 404」之後，再把 schedule 打開。
#    自動部署最怕的就是踩到這個專案以前踩過的圖片坑（cp -rn 的 no-clobber
#    曾讓 39 張圖 404），所以第一次一定要人工盯。
#
# ⚠️ schedule 只在「預設分支」上的 workflow 文件才會觸發。
#    本 repo 預設分支是 main（部署產物分支），所以本文件在 main 上也要有一份。

on:
  workflow_dispatch:
  # 驗證通過後取消註解：
  # schedule:
  #   - cron: '17 22 * * *'    # UTC 22:17 = 香港時間 06:17，早上打開就是新的

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出源碼分支
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取科研時事（只用標準庫，無第三方依賴）
        run: python scripts/fetch_news.py

      - name: 檢查是否有新內容
        id: diff
        run: |
          if git diff --quiet -- data/_news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新內容，本次跳過構建與部署"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "有新內容："
            git diff --stat -- data/_news.json
          fi

      - name: 提交數據變更回 source
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_news.json
          git commit -m "chore(news): 自動更新科研時事 $(date -u +%Y-%m-%d)"
          git push origin HEAD:source

      - name: 構建站點
        if: steps.diff.outputs.changed == 'true'
        run: |
          python site/build.py
          python site/prep_ghpages.py

      - name: 部署到 main
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用 worktree 單獨拿一份 main，不動當前工作區
          git worktree add --detach /tmp/deploy origin/main
          cd /tmp/deploy

          # ⚠️ --delete 會讓部署目錄與 gh-pages/ 完全一致，
          #    所以必須排除 .git 與 .github ——
          #    .github/workflows 是本工作流自己的家，被刪掉下次就不會跑了。
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/gh-pages/" /tmp/deploy/

          git add -A
          if git diff --cached --quiet; then
            echo "部署內容無變化，不提交"
            exit 0
          fi
          git commit -m "deploy: 科研時事自動更新 $(date -u +%Y-%m-%d)"
          git push origin HEAD:main

      - name: 結果摘要
        if: always()
        run: |
          echo "### 科研時事更新" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✅ 有新內容，已重建並部署" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏸️ 沒有新內容，本次未部署（保持原樣，不硬湊）" >> "$GITHUB_STEP_SUMMARY"
          fi
